<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="斐斐加油">
<meta name="theme-color" content="#F6E3E9">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>斐斐的背诵手册</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
  --pink:#F4A8BE; --pink-l:#FBE0E8; --pink-xl:#FDF1F5;
  --rose:#E0678A; --rose-d:#C94D72; --rose-dd:#A93A5C;
  --gold:#E7B24C; --gold-l:#FDF5E5;
  --ink:#3D2E33; --ink2:#5D4A50; --sub:#A08B92;
  --bg:#FFFAF9; --card:#FFFFFF; --line:#F5E6EA;
  --ok:#3FA96B; --ok-bg:#EBF8F0;
  --shadow:0 2px 14px rgba(224,103,138,.07);
  --shadow2:0 8px 30px rgba(224,103,138,.13);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
body{
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); background:var(--bg); -webkit-text-size-adjust:100%;
  padding-bottom:calc(74px + var(--safe-b)); overflow-x:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}

.blob{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0}
.blob.b1{width:320px;height:320px;right:-110px;top:-90px;background:rgba(244,168,190,.34)}
.blob.b2{width:260px;height:260px;left:-110px;top:38%;background:rgba(253,224,232,.5)}
.blob.b3{width:300px;height:300px;right:-120px;bottom:6%;background:rgba(231,178,76,.13)}

header{
  position:sticky;top:0;z-index:20;overflow:hidden;
  padding:calc(12px + var(--safe-t)) 18px 16px;
  background:linear-gradient(135deg,#FBD3DF 0%,#F4A8BE 42%,#E8849F 100%);
  box-shadow:0 3px 18px rgba(201,77,114,.16);
}
header:after{
  content:"";position:absolute;inset:auto -30% -70% -30%;height:150px;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.42),transparent 70%);
  pointer-events:none;
}
.h-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.h-hi{font-size:20px;font-weight:800;color:#fff;letter-spacing:.4px;text-shadow:0 1px 6px rgba(169,58,92,.22)}
.h-sub{font-size:12.5px;color:rgba(255,255,255,.95);margin-top:3px;letter-spacing:.2px}
.h-sub b{font-size:15px;font-weight:800}
.h-cat{flex:0 0 auto;width:54px;height:46px;animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
.h-bar{height:7px;border-radius:99px;background:rgba(255,255,255,.42);margin-top:13px;overflow:hidden;position:relative;z-index:1}
.h-bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.22,.61,.36,1);
  background:linear-gradient(90deg,#FFF3F7,#FFE08A);box-shadow:0 0 12px rgba(255,255,255,.7)}

main{padding:16px 14px 10px;max-width:900px;margin:0 auto;position:relative;z-index:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;
  margin-bottom:14px;box-shadow:var(--shadow);animation:cardIn .34s cubic-bezier(.22,.61,.36,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.sec-title{font-size:12.5px;font-weight:800;color:var(--sub);letter-spacing:1.4px;
  margin:20px 6px 9px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-title span{font-weight:500;letter-spacing:0;font-size:12px}

.tag{display:inline-block;font-size:12px;padding:3px 11px;border-radius:99px;
  background:var(--pink-l);color:var(--rose-dd);font-weight:700;margin-right:6px}
.tag.gold{background:var(--gold-l);color:#A8770F}
.tag.ok{background:var(--ok-bg);color:#1E7B47}
.tag.plain{background:#F4F1F2;color:var(--sub)}

.day-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day-no{font-size:30px;font-weight:900;line-height:1;letter-spacing:-.5px;
  background:linear-gradient(120deg,var(--rose) 10%,var(--rose-dd) 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.day-no em{font-style:normal;font-size:13px;font-weight:600;-webkit-text-fill-color:var(--sub);color:var(--sub)}
.day-date{font-size:12.5px;color:var(--sub);margin-left:auto;font-weight:600}
.day-task{font-size:18.5px;font-weight:700;margin:13px 0 0;line-height:1.5;letter-spacing:.2px}
.focus{margin:11px 0 0;padding:0;list-style:none}
.focus li{position:relative;padding-left:19px;font-size:14.5px;color:var(--ink2);margin-top:7px;line-height:1.6}
.focus li:before{content:"";position:absolute;left:5px;top:9px;width:6px;height:6px;border-radius:99px;
  background:linear-gradient(135deg,var(--pink),var(--rose))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-radius:15px;background:#F7F1F3;font-size:15px;font-weight:700;
  min-height:48px;transition:transform .14s,opacity .14s}
.btn:active{transform:scale(.975);opacity:.86}
.btn.rose{background:linear-gradient(135deg,#EE7C9D,#D9557E);color:#fff;
  box-shadow:0 5px 16px rgba(217,85,126,.3)}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.btn.ghost{background:var(--pink-xl);color:var(--rose-dd)}
.btn.sm{min-height:38px;padding:7px 13px;font-size:13.5px;border-radius:12px}
.btn.big{min-height:56px;font-size:16.5px;border-radius:17px}
.row-btn{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.row-btn .btn{flex:1;min-width:132px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.step{border:1.5px solid var(--line);border-radius:18px;padding:13px 6px;text-align:center;
  background:#FFFCFD;transition:.2s cubic-bezier(.22,.61,.36,1);min-height:82px;
  display:flex;flex-direction:column;justify-content:center;gap:3px}
.step b{font-size:15px;font-weight:700;display:block}
.step span{font-size:11px;color:var(--sub)}
.step .bx{width:24px;height:24px;border-radius:99px;border:2px solid #EEDCE2;margin:0 auto 5px;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:.2s}
.step.on{background:linear-gradient(180deg,#F0FBF5,#E7F7EE);border-color:#A5DEBF}
.step.on .bx{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px rgba(63,169,107,.14)}
.step.on b{color:#1E7B47}
.step:active{transform:scale(.97)}

.plist{display:flex;flex-direction:column;gap:9px}
.prow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:17px;padding:13px 15px;text-align:left;width:100%;box-shadow:var(--shadow);transition:transform .14s}
.prow:active{transform:scale(.985)}
.prow .num{flex:0 0 46px;font-size:13px;font-weight:900;color:var(--rose);line-height:1.25}
.prow .num small{display:block;font-size:10px;color:var(--sub);font-weight:600}
.prow .tx{flex:1;min-width:0}
.prow .tx b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tx span{font-size:11.5px;color:var(--sub)}
.prow .dot{flex:0 0 auto;width:26px;height:26px;border-radius:99px;border:2px solid #EFE0E5;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.prow.done{background:linear-gradient(180deg,#F2FBF6,#EAF8F0);border-color:#B9E3CB}
.prow.done .dot{background:var(--ok);border-color:var(--ok)}
.prow.done .tx b{color:#1E7B47}
.stagebar{font-size:12px;font-weight:800;color:var(--sub);margin:18px 6px 8px;letter-spacing:.8px;
  display:flex;justify-content:space-between}
.pbar{height:6px;border-radius:9px;background:#F5ECEF;overflow:hidden;margin:0 6px 10px}
.pbar i{display:block;height:100%;border-radius:9px;
  background:linear-gradient(90deg,var(--pink),var(--rose));transition:width .5s}
.stagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 15px;
  box-shadow:var(--shadow);margin-top:2px;text-align:left;transition:.2s}
.stagehead:active{transform:scale(.985)}
.stagehead .sh-l b{display:block;font-size:15px;font-weight:800;color:var(--ink)}
.stagehead .sh-l span{font-size:11.5px;color:var(--sub);font-weight:600}
.stagehead .sh-r{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;color:var(--rose-d)}
.stagehead .caret{font-style:normal;font-size:18px;color:var(--sub);line-height:1;transition:transform .22s}
.stagehead.open{border-color:#F3D3DF;background:linear-gradient(180deg,#FFFBFD,#FDF3F7)}
.stagehead.open .caret{transform:rotate(90deg)}
.stagehead.cur{border-color:#F0C7D6}
.stagehead .here{font-size:10.5px;font-weight:800;color:#fff;background:var(--rose);
  border-radius:99px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.todaybox{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FFF6F9,#FDEDF3);
  border:1.5px solid #F8DCE6;border-radius:20px;padding:15px 16px;box-shadow:var(--shadow)}
.todaybox .n{flex:0 0 auto;font-size:26px;font-weight:900;color:var(--rose-d);line-height:1}
.todaybox .t{flex:1;min-width:0}
.todaybox .t b{display:block;font-size:15px;font-weight:800}
.todaybox .t span{font-size:12.5px;color:var(--sub)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:13px;background:var(--gold-l);color:#8A5A06;font-size:13.5px;
  font-weight:700;border:1.5px solid #F6E4C2;min-height:42px;display:flex;align-items:center}
.chip.on{background:var(--ok-bg);color:#1E7B47;border-color:#A5DEBF}
.chip small{opacity:.75;font-weight:500;margin-left:5px}

/* ---------- 陪伴模式 ---------- */
.taskrow{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);
  border-radius:16px;padding:14px 15px;text-align:left;width:100%;transition:.18s}
.taskrow:active{transform:scale(.985)}
.taskrow .tbx{flex:0 0 auto;width:26px;height:26px;border-radius:99px;border:2px solid #EEDCE2;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;transition:.2s}
.taskrow .ttx{flex:1;font-size:15.5px;font-weight:600;color:var(--ink2)}
.taskrow.on{background:linear-gradient(180deg,#F0FBF5,#E7F7EE);border-color:#A5DEBF}
.taskrow.on .tbx{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px rgba(63,169,107,.14)}
.taskrow.on .ttx{color:#1E7B47}
.moods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mood{padding:14px 8px;border-radius:16px;background:#FFFCFD;border:1.5px solid var(--line);
  font-size:15px;font-weight:700;min-height:54px;transition:.18s}
.mood:active{transform:scale(.97)}
.mood.on{background:linear-gradient(135deg,#EE7C9D,#D9557E);color:#fff;border-color:transparent;
  box-shadow:0 5px 16px rgba(217,85,126,.3)}
.mstrip{display:flex;gap:8px}
.mstrip .md{flex:1;text-align:center;padding:10px 2px;border-radius:14px;background:#FCFAFB;
  border:1.5px solid var(--line)}
.mstrip .md b{display:block;font-size:15px;font-weight:800;color:var(--ink2)}
.mstrip .md span{font-size:10.5px;color:var(--sub)}
.mstrip .md.dn{border-color:#B9E3CB}
.mstrip .md.m1{background:#E6F6EC;border-color:#A5DEBF}
.mstrip .md.m2{background:#FDF3DC;border-color:#F0DCA8}
.mstrip .md.m3{background:#F3F1F2;border-color:#E3DEE1}
.mstrip .md.m4{background:#FDE8EE;border-color:#F3C6D5}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
.calhead span{text-align:center;font-size:11.5px;font-weight:800;color:var(--sub)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calcell{aspect-ratio:1/1;border-radius:12px;background:#FCFAFB;border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.calcell b{font-size:13px;font-weight:800;color:var(--ink2)}
.calcell i{font-style:normal;font-size:9px;color:var(--ok);font-weight:900}
.calcell.ph{background:transparent;border-color:transparent}
.calcell.fut{opacity:.45}
.calcell.dn{border-color:#B9E3CB}
.calcell.m1{background:#E6F6EC;border-color:#A5DEBF}
.calcell.m2{background:#FDF3DC;border-color:#F0DCA8}
.calcell.m3{background:#F3F1F2;border-color:#E3DEE1}
.calcell.m4{background:#FDE8EE;border-color:#F3C6D5}
.calcell.today{box-shadow:inset 0 0 0 2px var(--rose)}
.callegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:12px;color:var(--sub);font-weight:600}
.callegend span{display:flex;align-items:center;gap:5px}
.callegend .sw{width:12px;height:12px;border-radius:4px;display:block;background:#F3F1F2}
.callegend .sw.m1{background:#A5DEBF}
.callegend .sw.m2{background:#F0DCA8}
.callegend .sw.m3{background:#E3DEE1}
.callegend .sw.m4{background:#F3C6D5}

.duecard{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#FFF6F9,#FDEDF3);
  border:1.5px solid #F8DCE6;border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.duecard .big{font-size:30px;font-weight:900;color:var(--rose-d);line-height:1}
.duecard .txt{flex:1;min-width:0}
.duecard .txt b{display:block;font-size:15.5px;font-weight:800}
.duecard .txt span{font-size:12.5px;color:var(--sub)}

.kframe{background:#FDFAFB;border:1px solid var(--line);border-radius:15px;padding:13px 15px;
  font-size:14px;line-height:2;white-space:pre-wrap;color:var(--ink2)}
.qa{border-bottom:1px solid var(--line);padding:2px 0}
.qa:last-child{border-bottom:0}
.qa .q{display:flex;gap:9px;width:100%;text-align:left;font-size:15px;font-weight:700;
  padding:12px 0;align-items:flex-start;line-height:1.5}
.qa .q i{flex:0 0 auto;font-style:normal;color:var(--rose);font-weight:900;min-width:19px}
.qa .q u{text-decoration:none;margin-left:auto;flex:0 0 auto;color:var(--sub);font-size:12px;
  font-weight:600;padding-top:3px}
.qa .a{display:none;margin:0 0 12px;padding:11px 13px;border-left:3px solid var(--pink);
  background:#FFFBF4;border-radius:10px;font-size:14.5px;line-height:1.75;color:var(--ink2)}
.qa.open .a{display:block;animation:cardIn .22s both}
.qa.open .q u{color:var(--ok)}
.level{display:flex;gap:7px;margin-top:11px}
.level button{flex:1;padding:9px 4px;border-radius:11px;font-size:13.5px;font-weight:700;min-height:42px}
.level button[data-rate="0"],.level button[data-rq="0"]{background:#FDECEF;color:#C0392B}
.level button[data-rate="1"],.level button[data-rq="1"]{background:#FFF6E5;color:#A8770F}
.level button[data-rate="2"],.level button[data-rq="2"]{background:#EAF8F0;color:#1E7B47}
.level button:active{transform:scale(.95)}
.rated{margin-top:10px;font-size:13px;font-weight:700;color:#1E7B47;
  background:var(--ok-bg);border-radius:10px;padding:9px 12px;animation:cardIn .25s both}
.cf{margin:0;padding:0;list-style:none}
.cf li{font-size:14.5px;line-height:1.7;padding:11px 0;border-bottom:1px dashed var(--line)}
.cf li:last-child{border-bottom:0}
.cf b{color:var(--rose-d);display:block;font-size:14px;margin-bottom:3px}
.nums{margin:0;padding-left:20px;font-size:14.5px;line-height:1.8;color:var(--ink2)}
.nums li{margin-top:8px}
.nums li:first-child{margin-top:0}

.review{position:fixed;inset:0;z-index:70;background:linear-gradient(170deg,#FFF9FB,#FDF1F5);
  display:flex;flex-direction:column;padding:calc(14px + var(--safe-t)) 16px calc(16px + var(--safe-b));overflow:auto}
.rv-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.rv-top .close{font-size:15px;font-weight:700;color:var(--sub);padding:8px 4px}
.rv-prog{flex:1;height:8px;border-radius:9px;background:#F6E7EC;overflow:hidden}
.rv-prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pink),var(--rose));transition:width .3s}
.rv-num{font-size:13px;font-weight:800;color:var(--rose-d);font-variant-numeric:tabular-nums}
.rv-card{background:#fff;border-radius:24px;padding:22px 20px;box-shadow:var(--shadow2);
  border:1px solid var(--line);animation:cardIn .3s both}
.rv-from{font-size:11.5px;color:var(--sub);font-weight:700;letter-spacing:.6px;margin-bottom:10px}
.rv-q{font-size:19px;font-weight:800;line-height:1.55}
.rv-a{margin-top:16px;padding:14px 15px;background:#FFFBF4;border-left:4px solid var(--gold);
  border-radius:12px;font-size:15px;line-height:1.8;color:var(--ink2);animation:cardIn .28s both}
.rv-done{text-align:center;padding:30px 10px}
.rv-done .emo{font-size:52px}
.rv-done .scorebig{font-size:44px;font-weight:900;line-height:1.1;margin:6px 0 2px;
  background:linear-gradient(120deg,#E0678A,#A93A5C);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.rv-done h2{font-size:22px;margin:12px 0 6px;color:var(--rose-d)}
.rv-done p{color:var(--sub);font-size:14.5px;margin:0 0 20px;line-height:1.8}

.love-item{display:flex;gap:13px;padding:14px;border-radius:18px;margin-bottom:10px;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.love-item.locked{background:#FCFAFB;border-style:dashed;box-shadow:none;opacity:.62;padding:11px 14px}
.love-item.locked .n{flex:0 0 32px;height:32px;border-radius:10px;font-size:12px}
.love-item.locked .t{font-size:13.5px;color:var(--sub)}
.love-item .n{flex:0 0 40px;height:40px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-weight:900;font-size:13px;color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--rose))}
.love-item.locked .n{background:#EFE6E9;color:var(--sub)}
.love-item .t{flex:1;font-size:14.5px;line-height:1.7;color:var(--ink2)}
.love-item .t .d{display:block;font-size:11.5px;color:var(--sub);margin-top:5px;font-weight:600}
.love-hero{text-align:center;padding:10px 4px 4px}
.love-hero .big{font-size:40px;font-weight:900;
  background:linear-gradient(120deg,var(--rose),var(--rose-dd));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}

.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:4px;background:#F6EDF0;display:block}
.heat i[data-l="1"]{background:#FBD9E4}
.heat i[data-l="2"]{background:#F4A8BE}
.heat i[data-l="3"]{background:#E0678A}
.heat i[data-l="4"]{background:#B9436A}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:11px}
.badge{text-align:center;padding:12px 5px;border-radius:17px;background:#FCFAFB;
  border:1px solid var(--line);transition:.2s}
.badge .e{font-size:26px;display:block;filter:grayscale(1);opacity:.35}
.badge .t{font-size:11.5px;font-weight:700;color:var(--sub);margin-top:6px;display:block}
.badge.got{background:linear-gradient(180deg,#FFF7FA,#FDECF2);border-color:#F6D6E1;box-shadow:var(--shadow)}
.badge.got .e{filter:none;opacity:1;animation:bob 3s ease-in-out infinite}
.badge.got .t{color:var(--rose-dd)}

.mask{position:fixed;inset:0;background:rgba(61,46,51,.42);z-index:60;display:flex;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:#fff;width:100%;max-width:660px;border-radius:26px 26px 0 0;
  padding:20px 18px calc(20px + var(--safe-b));max-height:90vh;overflow:auto;
  animation:up .3s cubic-bezier(.22,.61,.36,1)}
@keyframes up{from{transform:translateY(46px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:800}
.sheet p.hint{margin:0 0 14px;font-size:13px;color:var(--sub)}
.sheet textarea{width:100%;min-height:128px;border:1.5px solid var(--line);border-radius:15px;
  padding:13px;font-size:16px;resize:vertical;background:#FDFAFB}
.sheet textarea:focus{outline:none;border-color:var(--pink)}
.seg{display:flex;gap:8px;margin-top:13px}
.seg button{flex:1;padding:11px;border-radius:13px;background:#F7F1F3;font-size:14px;font-weight:700;min-height:46px}
.seg button.on{background:linear-gradient(135deg,#EE7C9D,#D9557E);color:#fff}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:38px 10px}
.empty div{font-size:42px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:27px;font-weight:900;line-height:1.2;
  background:linear-gradient(120deg,var(--rose),var(--rose-dd));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.stat span{font-size:11.5px;color:var(--sub);font-weight:600}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);
  border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.note .nh{display:flex;justify-content:space-between;align-items:center;gap:8px;
  font-size:11.5px;color:var(--sub);margin-bottom:6px;font-weight:600}
.note .nt{font-size:15px;white-space:pre-wrap;word-break:break-word}
.note .del{color:#C0392B;font-size:13px;font-weight:700;padding:5px 9px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav button{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;
  gap:2px;color:var(--sub);font-size:10.5px;font-weight:700;transition:color .18s}
nav button .ic{font-size:20px;line-height:1.15;transition:transform .2s}
nav button.on{color:var(--rose-d)}
nav button.on .ic{transform:translateY(-2px) scale(1.14)}

/* ===== 彩蛋：完成一天的庆祝动画 ===== */
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}
#fx .particles{position:absolute;inset:0;overflow:hidden}
#fx .p{position:absolute;bottom:-10vh;opacity:0;will-change:transform,opacity;
  animation:rise var(--dur) cubic-bezier(.22,.61,.36,1) var(--delay) forwards}
@keyframes rise{
  0%{opacity:0;transform:translate3d(0,0,0) scale(.35) rotate(0deg)}
  14%{opacity:var(--op)}
  58%{transform:translate3d(calc(var(--sway) * .62),-56vh,0) scale(1) rotate(calc(var(--rot) * .45))}
  100%{opacity:0;transform:translate3d(var(--sway),-120vh,0) scale(1.08) rotate(var(--rot))}
}
#fx .halo{position:absolute;left:50%;top:44%;width:52vmin;height:52vmin;margin:-26vmin 0 0 -26vmin;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(244,168,190,.55),rgba(244,168,190,0) 68%);
  animation:halo 1.5s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes halo{0%{opacity:.85;transform:scale(.3)}100%{opacity:0;transform:scale(2.5)}}
#fx .ring{position:absolute;left:50%;top:44%;width:230px;height:230px;margin:-115px 0 0 -115px;
  border-radius:50%;border:2px solid rgba(224,103,138,.42);animation:ring 1.7s ease-out .1s forwards;pointer-events:none}
@keyframes ring{0%{opacity:.7;transform:scale(.4)}100%{opacity:0;transform:scale(1.85)}}
#fx .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:22px;background:radial-gradient(ellipse at 50% 45%,rgba(61,46,51,.14),rgba(61,46,51,.42));
  pointer-events:auto;animation:fadeIn .24s both}
.cel{position:relative;width:100%;max-width:430px;border-radius:30px;padding:26px 22px 22px;
  text-align:center;background:linear-gradient(175deg,#FFFFFF 0%,#FFF7FA 58%,#FDEEF4 100%);
  box-shadow:0 26px 70px rgba(120,40,70,.34);
  animation:pop .58s cubic-bezier(.18,1.2,.36,1) both}
@keyframes pop{0%{opacity:0;transform:translateY(38px) scale(.82)}
  62%{opacity:1;transform:translateY(-8px) scale(1.025)}100%{opacity:1;transform:none}}
.cel:before{content:"";position:absolute;inset:-1.5px;border-radius:31px;padding:1.5px;
  background:linear-gradient(135deg,#F9C9D8,#F4A8BE 35%,#FFE7A8 70%,#F9C9D8);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;animation:shine 3.4s linear infinite}
@keyframes shine{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(22deg)}}
.cel .cat{width:96px;height:82px;margin:0 auto 10px;animation:bob 2.6s ease-in-out infinite}
.cel .daytag{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.6px;
  color:var(--rose-dd);background:#FCE7EE;border-radius:99px;padding:5px 15px;animation:cardIn .4s .1s both}
.cel .msg{font-size:18.5px;line-height:1.72;font-weight:700;color:var(--ink);
  margin:15px 2px 0;letter-spacing:.3px;animation:cardIn .5s .22s both}
.cel .collect{font-size:12px;color:var(--sub);font-weight:600;margin-top:13px;animation:cardIn .5s .34s both}
.cel .btn{margin-top:16px;width:100%;animation:cardIn .5s .44s both}
.cel .spark{position:absolute;font-size:15px;animation:tw 1.9s ease-in-out infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.82)}50%{opacity:1;transform:scale(1.18)}}
.cel .spark.s1{left:16px;top:22px}
.cel .spark.s2{right:20px;top:44px;animation-delay:.3s}
.cel .spark.s3{left:30px;bottom:88px;animation-delay:.6s}
.cel .spark.s4{right:34px;bottom:126px;animation-delay:.9s}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (min-width:700px){ .day-task{font-size:19.5px} .cel{max-width:470px} }
</style>

    ["青铜器形制与纹饰发展演变", "形制上：商代多厚重、方直（如方鼎、方尊），西周趋于规整、简朴（如大盂鼎、毛公鼎），春秋战国则轻薄精巧、造型奇巧（如莲鹤方壶、错金银器），并出现实用化趋势。纹饰上：商代以饕餮纹、夔龙纹为主，配云雷纹地，神秘威严；西周前期沿袭饕餮纹，中晚期盛行窃曲纹、环带纹、重环纹等抽象几何纹；春秋战国出现蟠螭纹、攻战纹、宴乐纹等写实性纹样，并盛行金银错与镶嵌工艺。"],

    ["帛画", "定义：战国至汉代画在丝帛上的绘画，多用于丧葬仪式，属旌幡一类，出殡时张举、下葬时覆盖棺上，目的是引魂升天。代表作品：战国《人物龙凤帛画》《人物御龙帛画》（湖南长沙楚墓出土），西汉《T 形帛画》（湖南长沙马王堆一号汉墓出土）。特征：以墨线勾勒为主，平涂设色，线条流畅圆转，人物作侧面或正侧面，构图讲究上下层次的宇宙空间秩序。"],
    ["战国《人物龙凤帛画》", "战国时期楚国帛画，1949 年出土于湖南长沙陈家大山楚墓。画面下部绘一侧身合掌的贵妇，上部绘一龙一凤（一说夔龙与凤鸟）腾跃引导。特征：以毛笔线描为主，线条流畅，设色简淡，主题为墓主人祈求龙凤引导灵魂升天，是已知最早的独幅人物画之一。"],
    ["战国《人物御龙帛画》", "战国时期楚国帛画，1973 年出土于湖南长沙子弹库楚墓。画面绘一男子高冠长袍、腰佩长剑，手执缰绳立于龙身之上，龙作舟形，上有华盖、下有游鱼。特征：线条劲挺流畅，人物形象写实，主题为墓主人乘龙升天，与《人物龙凤帛画》同为楚墓帛画的双璧。"],
    ["T 形帛画", "又称马王堆一号汉墓帛画，1972 年出土于湖南长沙马王堆一号汉墓（长沙国丞相利苍之妻辛追墓），是覆盖在内棺上的随葬旌幡。特征：呈 T 形，全长约 2 米，画面分天上、人间、地下三部分——上部绘日、月、扶桑、人首蛇身神与天门；中部绘墓主人拄杖前行及侍女、祭祀场面；下部绘巨人托地、鸱龟等。以墨线勾勒、平涂设色，色彩以朱红、石青、藤黄为主，构图对称严整，是汉代绘画的最高代表，兼具神话与写实价值。"],
    ["马王堆汉墓帛画的绘画特点", "以线造型，线条细劲流畅、圆转匀称；设色以平涂为主，局部有渲染，色彩浓丽沉稳（朱红、土红、石青、藤黄、白）；构图采用上下分层、左右对称的格局，把天上、人间、地下三个世界组织在一个画面中；人物形象写实，服饰、器具刻画具体，反映西汉初期绘画的高度成熟。"],
    ["画像石", "定义：汉代雕刻在墓室、祠堂、石阙等石构件上的图像，用减地平面阴刻或阴线刻等方法制成，兼具绘画与雕刻性质，主要用于丧葬建筑装饰。代表遗存：山东嘉祥武氏祠、山东沂南汉画像石墓、河南南阳汉画像石墓、陕北汉画像石、四川汉画像石。特征：题材包括神话传说、历史故事、车马出行、宴饮乐舞、狩猎农耕等；构图分层分格、密而不乱，多用剪影式造型与夸张动态，风格质朴雄浑，是研究汉代社会生活的形象史料。"],
    ["武氏祠画像石", "东汉晚期画像石的代表，位于山东嘉祥县武宅山，是武氏家族墓地的祠堂石刻群（主要有武梁祠等）。特征：采用减地平雕加阴线刻，刻画帝王圣贤、忠臣孝子、列女刺客等历史故事及祥瑞图像，人物多作侧面、大小按身份区别，旁有榜题文字，是研究汉代儒学教化与画像石艺术的珍贵实物。"],
    ["画像砖", "定义：汉代用于砌筑墓室的一种模制或雕刻的装饰砖，表面有浮雕或线刻图像，多为一砖一画或一砖多画。代表遗存：四川成都一带（如《弋射收获画像砖》《酿酒画像砖》）、河南洛阳、陕西等地。特征：题材有农业、渔猎、纺织、宴饮、车骑、乐舞等，形象生动写实，浮雕线条简练，充满生活气息，是研究汉代社会经济与民俗的直观材料。"],
    ["《弋射收获画像砖》", "东汉画像砖，四川成都一带出土。画面分上下两部分：上部绘荷塘边两人张弓弋射，水中有鱼鸭游动；下部绘五人挥镰收割。特征：构图饱满、形象概括，采用浅浮雕加线刻，生动反映汉代四川地区渔猎与农业生产的场景，是画像砖中现实题材的代表作品。"],
    ["战国秦汉绘画的总体特点", "①功能上强调为礼教和丧葬服务，绘画多用于引魂升天、宣扬道德；②技法上以毛笔线描造型为主，线条圆转流畅，平涂设色；③构图上分层布局、主次分明，善于把不同时空的内容纳入同一画面；④题材上由战国楚墓帛画的神话引魂，到汉代扩展为现实生活、历史故事与神话祥瑞并重。"],
    ["汉代美术的写实倾向", "汉代美术在继承了楚文化浪漫想象的同时，越来越重视对现实生活的描绘：帛画中出现墓主人肖像与具体祭祀场面；画像石画像砖描绘农耕、渔猎、纺织、宴饮、车马出行等真实场景；塑造形象注重动态与身份差别。这种写实与审美、浪漫与质朴的结合，构成汉代美术雄浑博大的时代风貌。"]

    ["战国帛画 / 西汉 T 形帛画", "战国帛画画面较小、内容单一，只绘墓主人与引导的龙、凤，重在引魂升天；西汉 T 形帛画（马王堆一号汉墓）呈 T 形、长约 2 米，以天上、人间、地下三部分构成完整宇宙图式，人物众多、色彩浓丽，是汉代绘画最高代表。"],
    ["画像石 / 画像砖", "画像石是在墓室、祠堂的石构件上雕刻图像，属石刻（减地平雕、阴线刻），体量较大、可整面连续构图；画像砖是用模制或雕刻的砖块砌入墓室，多为一块一画，属陶砖浮雕，规格统一、便于重复排列。"],
    ["帛画 / 画像石画像砖", "帛画是画在丝帛上的绘画，可移动，属旌幡用于引魂升天，以线描平涂为主；画像石画像砖是附属于墓室祠堂建筑的雕刻装饰，不可移动，以刀代笔、兼具绘画与雕刻性，题材更偏现实生活与历史故事。"],

    ["楚文化的浪漫想象 / 汉代的写实倾向", "战国楚墓帛画以龙凤神灵、引魂升天为主题，充满浪漫神秘色彩；汉代美术在保留神话祥瑞的同时大幅增加现实题材（肖像、祭祀、农耕渔猎、车马出行），写实作风明显增强。"]

  frame: "战国秦汉美术（二）\n  一、秦始皇陵兵马俑\n  二、霍去病墓前石雕\n  三、汉代工艺雕塑\n    1. 长信宫灯\n    2. 采桑宴乐攻战纹铜壶\n    3. 马踏飞燕\n    4. 击鼓说唱俑、立式说唱俑\n  四、瓦当",
  must: [
    ["秦始皇陵兵马俑", "1974 年发现于陕西临潼秦始皇陵东侧，1979 年建成博物馆对外开放，是秦代大型陶塑群像。特征：以真人真马为原型，兵马俑身高约 1.8 米、陶马高约 1.5 米，按军阵排列，分步兵、车兵、骑兵等；陶俑面容各异、神态威武，采用模制与手塑结合、分段烧制后组装，再施彩绘（今多已脱落）。它们以巨大的规模和写实的造型，体现秦代统一六国的雄壮气势与高超的雕塑、烧造水平，被誉为「世界第八大奇迹」。"],
    ["兵马俑的艺术特点", "①崇尚写实，人物比例、服饰、发式、铠甲刻画具体，面容因人而异，具肖像性；②高度统一而富有变化，整体排列成严整军阵，气势恢宏，细部各有性格；③塑、绘结合，塑形后敷彩，追求逼真效果；④数量巨大、体量惊人，是秦代「重形似、重气势」雕塑风格的典型代表。"],
    ["霍去病墓前石雕", "西汉大型纪念性石雕群，位于陕西兴平茂陵东侧霍去病墓前。代表作品：《马踏匈奴》《跃马》《伏虎》《卧牛》等。特征：利用巨石的自然形状，采用循石造型、圆雕、浮雕与线刻相结合的手法，只作必要雕凿，保留石材原貌，造型概括浑朴、气魄雄大。《马踏匈奴》以战马踏倒手持弓箭的匈奴人，象征霍去病抗击匈奴的战功，是汉代纪念碑式雕塑的代表作。"],
    ["《马踏匈奴》", "霍去病墓前石雕群的主像，西汉作品，位于陕西兴平。特征：以一匹昂首屹立的战马踏倒一个仰卧挣扎、手持弓箭的匈奴人；马身雄健沉着，敌人蜷缩狼狈，以对比手法象征霍去病抗击匈奴的赫赫战功。采用循石造型与圆雕、线刻结合，造型质朴浑厚，是汉代纪念性雕塑的杰作。"],
    ["长信宫灯", "西汉青铜鎏金灯具，1968 年出土于河北满城中山靖王刘胜妻窦绾墓。特征：整体作一跪坐宫女双手执灯之形，宫女右臂上举、袖口与灯体相通形成烟道，灯盘可转动、灯罩可开合以调节光照，体内可贮水吸收油烟。造型优美、设计科学，是实用与审美巧妙结合的汉代工艺珍品，因灯上有「长信」铭文而得名。"],
    ["采桑宴乐攻战纹铜壶", "又称宴乐水陆攻战纹铜壶，战国时期青铜器，1965 年出土于四川成都百花潭。特征：壶身以三道带状纹饰分层表现采桑、宴乐、弋射、水陆攻战等场面，人物众多、动作生动，采用嵌错（金银错）工艺；以连环画式的构图记录社会生活与战争，是战国青铜装饰由神秘纹样转向写实叙事的代表作。"],
    ["马踏飞燕", "又称铜奔马，东汉青铜雕塑，1969 年出土于甘肃武威雷台汉墓。特征：奔马三足腾空、一足踏于一只回首的飞燕之上，飞燕为支撑点，巧妙解决重心问题；马的昂首嘶鸣、四蹄翻飞的动态极其生动，造型符合力学原理，是中国古代雕塑中浪漫与写实结合的典范，现为中国旅游标志。"],
    ["击鼓说唱俑", "东汉陶塑，1957 年出土于四川成都天回山崖墓。特征：陶俑为坐姿，袒胸露腹，左手抱鼓、右手举槌，头戴帻巾，一足高翘，面部作眉飞色舞、张口大笑的诙谐神情，生动再现汉代民间说唱艺人的表演瞬间，是汉代陶塑中富有生活气息与世俗趣味的代表作。"],
    ["立式说唱俑", "东汉陶塑说唱俑的一种，作站立表演姿态，一手抱鼓、一手举槌，身体前倾、表情夸张。与坐姿的《击鼓说唱俑》同为汉代四川地区说唱俑的代表，反映汉代民间俳优说唱艺术的兴盛，体现汉代陶塑善于捕捉瞬间动态、诙谐生动的艺术特色。"],
    ["瓦当", "定义：古代建筑檐头筒瓦前端的遮挡构件，起保护椽头与装饰建筑的作用，最早见于西周，秦汉最盛。代表作品：秦画像瓦当、汉代四神瓦当（青龙、白虎、朱雀、玄武）、文字瓦当（如「长乐未央」「千秋万岁」）。特征：多为圆形，采用模制，纹样有卷云纹、动物纹、四神纹与文字等，构图适合圆形、对称均衡，兼具装饰性与吉祥寓意。"],
    ["四神瓦当", "汉代瓦当中最著名的种类，以青龙、白虎、朱雀、玄武四种神灵动物为纹样，分别对应东、西、南、北四个方位，起辟邪与标示方位的作用。特征：圆形当面内动物身躯卷曲、姿态矫健，构图饱满，线条简练有力，多用于宫殿、陵墓建筑，是汉代建筑装饰与阴阳五行观念结合的产物。"],
    ["秦汉雕塑的总体特点", "①规模宏大，与宫殿陵墓等大型建筑结合，服务于皇权与厚葬需要（秦始皇陵兵马俑、霍去病墓石雕）；②手法上秦代重写实逼真、气势严整，汉代重循石造型、概括夸张，浪漫与写实结合；③题材上兼有军阵、纪念性人物与日常生活、乐舞说唱形象；④陶塑、石雕、青铜雕塑全面发展，工艺与造型结合紧密（长信宫灯、马踏飞燕）。"]

  frame: "魏晋南北朝时期美术（一）\n  一、时代背景\n  二、美术发展新特点\n  三、代表画家（曹不兴、卫协、顾恺之、陆探微、张僧繇、曹仲达）\n  四、顾恺之艺术理论与实践\n  五、魏晋审美风尚新变化",
  must: [
    ["魏晋南北朝美术的时代背景", "魏晋南北朝（公元 220—589 年）是中国长期分裂、战乱频繁的时期，也是民族大融合与思想大解放的时期。玄学兴起、清谈盛行，儒家礼教松动，人的个性与精神风貌受到重视；佛教自汉代传入后在此期大盛，开窟造像蔚然成风。士族阶层成为文化主体，出现专业画家与系统的绘画理论，中国美术由此进入自觉时代。"],
    ["魏晋南北朝美术发展新特点", "①佛教美术空前兴盛，石窟寺、造像、壁画大规模出现；②绘画走向独立与自觉，出现有姓名可考的专业画家和传世画迹；③人物画成熟，注重传神与个性表现，山水画开始萌芽并成为独立画科；④绘画理论产生，出现顾恺之、谢赫、宗炳、王微等理论著作；⑤书法进入自觉阶段，楷、行、草诸体完备，出现「二王」；⑥审美上崇尚秀骨清像、褒衣博带的清俊风尚。"],
    ["曹不兴", "三国吴画家，被称为「佛画之祖」。据传他曾在五十尺绢上画佛像，心敏手运、须臾而成；又善画龙、虎、马。是文献记载中最早以佛像著称的画家，对后世佛教绘画影响深远，与顾恺之、陆探微、张僧繇并称早期大家之一。"],
    ["卫协", "西晋画家，师法曹不兴而青出于蓝。擅长人物、佛像与神仙题材，谢赫评其「古画皆略，至协始精」，赞其画六法之中几近兼备，是西晋最有影响的画家。他对顾恺之影响很大，标志人物画由粗略向精微的转变。"],
    ["顾恺之", "东晋画家、绘画理论家，字长康，小字虎头，晋陵无锡（今江苏无锡）人，时称「才绝、画绝、痴绝」。代表作品：《女史箴图》《洛神赋图》《列女仁智图》（均为后世摹本）。理论著作：《论画》《魏晋胜流画赞》《画云台山记》。特征：人物画善于传神，主张「以形写神」「传神写照，正在阿堵中」「迁想妙得」；线描如春蚕吐丝（高古游丝描），笔迹周密、线条圆润流畅，设色简淡，是中国人物画与画论的开创者。"],
    ["顾恺之的艺术理论", "主要见于《论画》《魏晋胜流画赞》《画云台山记》三篇。核心主张：①「以形写神」，强调通过形似表现对象的内在精神；②「传神写照，正在阿堵中」，认为眼睛是传神的关键；③「迁想妙得」，主张画家设身处地体会对象、以想象获得妙悟；④「悟对通神」，强调与对象精神相通；⑤重视人物画的「骨法」与「置陈布势」（构图）。这些理论奠定了中国画重传神、重意境的传统。"],
    ["《女史箴图》", "东晋顾恺之的代表作品（现存唐摹本，藏于英国大英博物馆）。依据西晋张华《女史箴》一文分段作图，描绘冯媛挡熊、班姬辞辇等列女故事，用以规劝宫廷女子德行。特征：以高古游丝描勾线，线条细劲圆润、如春蚕吐丝，人物衣带飘举、姿态端庄，注重神色刻画，画面旁附箴文，是研究魏晋人物画与顾恺之画风的重要作品。"],
    ["《洛神赋图》", "东晋顾恺之的代表作品（现存宋摹本数种）。依据曹植《洛神赋》创作，描绘曹植与洛水女神相遇、相恋、终至分离的连续情节。特征：采用连环画式的连续构图，把不同时间的情节安排在同一长卷中，山水树石作为背景与分隔（人大于山、水不容泛），线条如春蚕吐丝，色彩典雅，是诗画结合的早期典范。"],
    ["陆探微", "南朝宋画家，吴（今江苏苏州）人，擅长人物、肖像与佛像。人物造型清瘦秀劲，被概括为「秀骨清像」，反映魏晋士族审美风尚。谢赫评其画「穷理尽性，事绝言象」，将其列为《古画品录》第一品第一人；与顾恺之、张僧繇并称，其画风被称为「陆家样」。"],
    ["张僧繇", "南朝梁画家，吴（今江苏苏州）人，擅长佛像、人物与龙。曾创立「张家样」，是南朝佛教绘画的典范。相传他在金陵安乐寺画四龙而不点睛，点睛后龙即破壁飞去，即「画龙点睛」的典故。用笔简洁概括，被称为「笔才一二，象已应焉」的「疏体」，与顾恺之、陆探微的「密体」相对。"],
    ["曹仲达", "北齐画家，原为西域曹国人，以画梵像（佛像）著称，官至朝散大夫。所画人物衣服紧贴身体、如出水之状，被称为「曹衣出水」，与唐代吴道子的「吴带当风」并称，是外来画风与中国传统融合的代表，对北朝佛教造像影响很大。"],
    ["魏晋审美风尚新变化", "①由汉代重礼教、重功利的审美转向重人物内在精神与个性风采，讲求「传神」「气韵」；②人物造型崇尚清瘦秀逸，「秀骨清像」成为时代典型；③服饰上流行褒衣博带、衣带飘举，追求潇洒飘逸的风度；④士人寄情山水，山水审美意识觉醒，山水画与山水诗兴起；⑤品评风气盛行，出现以品第高下论画论书的著作（如谢赫《古画品录》）。"],
    ["人物画的传神要求", "魏晋人物画把「传神」作为最高标准：顾恺之提出「以形写神」「传神写照，正在阿堵中」，认为眼睛最能体现人物精神；又强调「迁想妙得」，要求画家深入体会对象。由此人物画从汉代的重故事、重教化，转向重个性、重精神气质的表现，标志中国人物画的成熟。"],
    ["佛教美术的兴盛", "魏晋南北朝时期佛教大盛，统治者大力提倡，开窟造像成风，形成敦煌莫高窟、云冈石窟、龙门石窟、麦积山石窟等大型石窟群；同时出现大量寺塔壁画与单体造像。外来佛像样式与中国传统造型逐渐融合（如曹仲达的「曹衣出水」），佛教美术成为此期规模最大、影响最广的美术门类，也推动了人物画技法的进步。"],
    ["山水画的萌芽", "魏晋南北朝时期，士人因社会动荡而寄情山水，玄学与隐逸之风盛行，山水审美意识觉醒，山水诗与山水画相继兴起，山水开始由人物画的背景走向独立画科。此时山水画尚处早期，比例上「人大于山、水不容泛」，树石画法稚拙（见《洛神赋图》），但为隋唐青绿山水的发展奠定基础。"]

  frame: "魏晋南北朝时期美术\n  一、时代背景与美术新特点\n  二、画论\n    1. 谢赫《古画品录》与六法\n    2. 宗炳《画山水序》、王微《叙画》\n    3. 山水画兴起的原因\n  三、绘画与书法遗存\n    1. 竹林七贤与荣启期砖画\n    2. 东晋南朝书法、二王",
  must: [
    ["魏晋南北朝美术发展的新特点（高频论述）", "①佛教传入，石窟壁画与造像艺术大盛；②人物画由「传神」走向成熟，出现有姓名可考的专业画家（顾恺之、陆探微、张僧繇）；③山水画开始从人物画背景中独立出来，并产生专门的山水画论；④画论、画品、画史著作出现，如谢赫《古画品录》、宗炳《画山水序》；⑤书法进入自觉时代，楷、行、草体完备，形成「二王」体系；⑥绘画题材由礼教转向人物品藻与山水审美。"],
    ["谢赫《古画品录》（名词解释）", "南齐谢赫所著的绘画品评专著，是中国现存最早的绘画品评著作。全书将三国至南齐的画家二十七人分为六品，逐一品评优劣，提出绘画的社会功能「明劝戒，著升沉，千载寂寥，披图可鉴」，并总结出绘画创作与批评的六条标准——六法，成为后世中国画创作与品评的最高准则。"],
    ["谢赫六法（必背，逐条能默写）", "一、气韵生动；二、骨法用笔；三、应物象形；四、随类赋彩；五、经营位置；六、传移模写。其中「气韵生动」是最高审美标准，指作品要表现出对象的精神气质与内在生命力；「骨法用笔」讲用笔的力度与线质；「应物象形」讲造型要合于对象；「随类赋彩」讲设色按物类施色；「经营位置」即构图章法；「传移模写」指临摹传承。"],
    ["气韵生动（名词解释）", "谢赫六法之首，中国画的最高审美标准。要求绘画不仅写形，更要传达对象的精神气度、内在生命与画面整体的生动气机，是「传神」思想在画论上的总结。后世引申为评画的第一标准，凡有气韵者即为上品。"],
    ["骨法用笔（名词解释）", "谢赫六法之一。指绘画造型要依靠有力度、有骨力的线条用笔来完成，强调线是中国画的骨干，用笔须有笔力、笔势，能立起形象的骨架。它把书法用笔引入绘画，为后世「书画同源」「以书入画」奠定基础。"],
    ["宗炳《画山水序》（名词解释）", "南朝宋宗炳所著，是中国最早的山水画论之一。文中提出「澄怀味象」「畅神」的审美观，认为山水画能「卧游」以代替真山水，满足士人隐逸情怀；又提出「竖画三寸，当千仞之高；横墨数尺，体百里之迥」，论述了山水画的远近透视与比例问题，为山水画独立发展提供了理论依据。"],
    ["王微《叙画》（名词解释）", "南朝宋王微所著山水画论，与宗炳《画山水序》并称南朝两大山水画论。文中强调山水画不同于地图，应「本乎形者融灵，而动变者心也」，要画出山水的气势与神韵；提出「望秋云，神飞扬；临春风，思浩荡」，把欣赏山水与画山水视为愉悦精神的活动，进一步确立了山水画的审美价值。"],
    ["山水画兴起的原因（论述要点）", "①社会动荡，士人崇尚隐逸，寄情山林，玄学与老庄思想盛行，为山水审美提供思想基础；②江南经济开发，自然山水成为士人日常游赏对象；③人物画发展成熟，其中的背景山水技法积累到可以独立成科；④宗炳《画山水序》、王微《叙画》等理论著作出现，从理论上确立了山水画的地位；⑤审美风尚由重礼教转向重个人情性与自然之美。"],
    ["竹林七贤与荣启期砖画（名词解释）", "南京南朝墓出土的模印砖画，是现存最早、最完整的大型人物砖画之一。画面分列嵇康、阮籍、山涛、王戎、向秀、刘伶、阮咸七贤与春秋隐士荣启期共八人，各具姿态，或抚琴、或饮酒、或长啸，以线条勾勒，旁标姓名。它以「树下人物」形式表现士人放达风度，反映了魏晋品藻人物的审美风尚，是研究南朝人物画的重要实物。"],
    ["东晋南朝书法发展概况", "东晋南朝是书法自觉与成熟的时代。篆、隶、楷、行、草诸体齐备，楷书、行书、草书在此期定型并达到高峰。代表书家有东晋王羲之、王献之父子，南朝羊欣、王僧虔等。书法由实用书写上升为独立艺术，讲究笔势、气韵与个人风神，形成影响千年的帖学传统。"],
    ["王羲之（名词解释）", "东晋书法家，被后世尊为「书圣」。其行书《兰亭序》被誉为「天下第一行书」，另有《丧乱帖》《十七帖》等。他博采众长，一变汉魏质朴书风，创造出妍美流便、遒媚飘逸的新体，楷、行、草皆精，把书法从实用推进到抒情写意的艺术境界。"],
    ["《兰亭序》（名词解释）", "东晋王羲之书，被誉为「天下第一行书」。东晋永和九年三月三日，王羲之与友人在会稽山阴兰亭修禊，乘兴写成此序。全篇二十八行，三百余字，笔势遒媚飘逸，通篇二十余个「之」字写法各异，自然天成，体现了从容萧散的魏晋风度，代表行书的最高成就。今存皆为摹本，以唐冯承素摹本（神龙本）最著名。"],
    ["王献之（名词解释）", "东晋书法家，王羲之第七子，与父并称「二王」。其书兼精楷、行、草，更以行草见长，代表作《鸭头丸帖》《中秋帖》《洛神赋十三行》（小楷）。他用笔外拓、气势奔放流畅，风格比其父更为纵逸，与其父内擫书风形成对比，对后世行草书影响极大。"],
    ["「二王」与帖学传统（名词解释）", "指东晋王羲之、王献之父子。「二王」确立了行书、草书与楷书的典范，其书风妍美流便、以韵胜，为历代书法取法正宗，形成以墨迹摹本、刻帖流传的帖学传统，元代赵孟頫、明代董其昌等皆以「二王」为宗。"],
    ["《古画品录》与顾恺之画论的关系", "顾恺之提出「传神写照」「以形写神」「迁想妙得」，重在人物精神的表现；谢赫在此基础上总结为「六法」，把「气韵生动」列为第一，并给出一套可操作的创作与品评标准。由顾恺之的「传神」到谢赫的「气韵」，是魏晋画论由经验上升为体系的标志。"],
    ["魏晋审美风尚的新变化", "由汉代重礼教、重功利，转向重人物风神、重个性才情；品评人物讲「风骨」「神韵」，影响到绘画的「传神」与「气韵」；士人追求超脱放达、寄情山水，清谈玄学盛行，秀骨清像成为人物造型的典型样式；艺术由「成教化，助人伦」的政教功能延伸到审美与抒情功能。"],
    ["魏晋南北朝佛教美术与石窟", "佛教盛行带动石窟寺与造像大发展，著名的有敦煌莫高窟、云冈石窟、龙门石窟、麦积山石窟等。造像与壁画题材以佛、菩萨、飞天、本生故事为主，早期受犍陀罗与西域影响，后逐渐中国化，形成「秀骨清像」「褒衣博带」的本土样式，是中国雕塑与壁画的重要遗产。"]
  ],
  confuse: [
    ["谢赫《古画品录》 / 张彦远《历代名画记》", "谢赫是南齐人，书为最早的绘画品评著作，核心是六法与分六品；张彦远是唐代人，书为最早的绘画通史，核心是画史源流与「书画同源」论述。"],
    ["宗炳《画山水序》 / 王微《叙画》", "皆南朝宋山水画论：宗炳主「澄怀味象」「畅神」「卧游」，重山水画的审美愉悦功能；王微主山水非地图、须「融灵」动心，重山水画的精神与气势表现。"],
    ["气韵生动 / 骨法用笔", "皆六法之一，但层次不同：气韵生动是整体精神气机的最高标准（讲画面效果与神采）；骨法用笔是具体技法要求（讲线条的力度与笔势）。"],
    ["王羲之 / 王献之", "父子并称「二王」：王羲之书风内擫、含蓄遒媚，代表《兰亭序》；王献之书风外拓、纵逸奔放，代表《鸭头丸帖》《洛神赋十三行》。"],
    ["魏晋南北朝「传神」论 / 谢赫「六法」", "顾恺之的「传神写照」「以形写神」是针对人物画的具体主张；谢赫六法是涵盖造型、用笔、设色、构图的完整品评体系，「气韵生动」是「传神」的升华。"]

ART_CONTENT[7] = {
  frame: "隋唐美术（一）人物画\n  一、时代背景与隋唐绘画新发展\n  二、初唐人物画家\n    1. 阎立本\n  三、盛唐人物画家\n    1. 吴道子\n  四、唐代绮罗仕女画\n    1. 张萱\n    2. 周昉",
  must: [
    ["隋唐绘画的新发展（高频论述）", "①人物画达到高峰，出现阎立本、吴道子等大家，题材有帝王、功臣、仕女、宗教；②山水画摆脱人物画背景而独立成科，分青绿山水与水墨山水两大体系；③花鸟画与鞍马、走兽题材兴起，出现韩干、韩滉等名家；④宗教壁画极盛，寺观壁画规模宏大，石窟壁画达到高峰；⑤绘画理论成熟，张彦远《历代名画记》出现；⑥宫廷绘画机构与画家的官方身份确立，绘画的政教与观赏功能并重。"],
    ["阎立本（名词解释）", "唐代初年著名人物画家、工程家，官至宰相。擅长人物、车马、台阁，尤以帝王肖像与历史题材见长。代表作《步辇图》《历代帝王图》《职贡图》。其画以线描为主，线条匀细劲健、设色沉着，人物主次分明、比例合度，真实记录了唐初重大政治事件与帝王形象，具有极高的历史与艺术价值。"],
    ["《步辇图》（名词解释）", "唐阎立本作，现藏故宫博物院，是现存最早反映汉藏民族交往的绘画作品。描绘唐太宗坐步辇接见吐蕃使者禄东赞的场景：太宗端坐辇上，宫女簇拥，右侧为引见官员、禄东赞与译员。构图主次分明，以人物大小与位置区分尊卑，线描劲细，设色浓重，真实记录了文成公主入藏前的历史事件。"],
    ["《历代帝王图》（名词解释）", "传为唐阎立本作（一说郎余令），绢本设色，绘自汉昭帝至隋炀帝的十三位帝王像。画中按帝王功过与气质刻画形象：开国之君端庄气盛，昏庸之主萎靡失色，并以侍从的小巧衬托帝王的魁伟。人物用线细劲，设色古雅，是研究唐代人物画与肖像画的重要作品。"],
    ["吴道子（名词解释）", "唐代最负盛名的画家，被后世尊为「画圣」，又称「吴生」。擅长佛道人物、山水、鸟兽，曾任宫廷画师。他把张僧繇的「张家样」发展为「吴家样」，所画人物衣纹飞动飘举，被称为「吴带当风」，与北齐曹仲达「曹衣出水」相对；用笔以兰叶描、莼菜条为特色，落笔豪放，有「笔才一二，像已应焉」的疏体之称。代表作《送子天王图》《天王送子图》、壁画《地狱变相》。"],
    ["吴带当风（名词解释）", "指唐代吴道子人物画的衣纹特征。他画人物衣带飘举飞扬，笔势圆转流畅如风吹动，故称「吴带当风」；与北齐曹仲达所画人物衣纹紧窄、贴身如出水而称「曹衣出水」相对，合称「曹衣出水，吴带当风」，是中国古代人物画线描的两大典范。"],
    ["吴家样（名词解释）", "唐代吴道子创立的佛教人物画样式。他在张僧繇「张家样」基础上，融合西域画法与中原线描，形成衣带飘举、气势飞动、设色简淡而重墨线的人物样式，成为唐代寺观壁画与后世佛道画的通行范式，对敦煌壁画与后代宗教绘画影响巨大。"],
    ["《送子天王图》（名词解释）", "传为唐吴道子所作（一作宋摹本），描绘释迦牟尼降生后其父净饭王抱子拜谒天神的场面。画面线条遒劲飞动、粗细顿挫有致，衣纹飘举，人物神情各异，神怪形象威武怪异，集中体现了「吴带当风」的线描成就。"],
    ["张萱（名词解释）", "唐代盛期仕女画家，官至史馆画直。擅长贵族妇女、婴儿、鞍马、宫苑题材，所画仕女丰腴健美，色彩明丽匀净，善于通过动作与神情表现人物的生活情态，是唐代绮罗人物画的代表。代表作《虢国夫人游春图》《捣练图》。"],
    ["《虢国夫人游春图》（名词解释）", "传为唐张萱作（现存宋徽宗摹本），绢本设色。描绘虢国夫人与随从骑马春游的场景：人物鞍马自右向左缓行，前有男装侍女开道，中有夫人与侍女并辔，后有随从持鞭跟随。画面不画背景花木，全凭人马轻盈的动态、绚丽的服装色彩表现春游的明媚气息，是唐代仕女画的杰作。"],
    ["《捣练图》（名词解释）", "传为唐张萱作（现存宋徽宗摹本）。描绘宫中妇女捣练、络线、熨平的劳作过程，分捣练、织修、熨烫三段，共十二人。人物分组而有呼应，动作细腻生动，小孩在练下钻来钻去的细节增添了生活情趣，设色雅丽，体现了唐代仕女画对现实生活的细致观察。"],
    ["周昉（名词解释）", "唐代中晚期著名仕女画家，出身贵族，官至宣州长史。擅长绮罗人物、佛像、肖像，所画仕女体态丰肥、衣着华丽、神情闲适而略带寂寞，创「水月观音」样式，被称为「周家样」。代表作《簪花仕女图》《挥扇仕女图》《调琴啜茗图》。"],
    ["《簪花仕女图》（名词解释）", "传为唐周昉作，绢本设色，是唐代仕女画的代表作品。描绘贵族妇女在庭院中赏花、戏犬、执扇、拈蝶的闲适生活，人物丰颊厚体、头戴牡丹等大朵花饰，衣着薄纱透体，用线细劲流畅，设色浓艳而不失雅致，通过仕女慵懒的神态传达出宫廷生活的富贵与空虚。"],
    ["绮罗仕女画（名词解释）", "唐代以贵族妇女生活为题材的人物画，因画中人物多着绮罗华服而得名，又称「仕女画」「绮罗人物」。代表画家有张萱、周昉，代表作品有《虢国夫人游春图》《捣练图》《簪花仕女图》。其特征是人物体态丰腴健美、服饰华丽、设色浓艳，善于以生活细节与神态表现人物内心，反映盛唐至中唐的审美风尚。"],
    ["「张家样」与唐代人物画样式", "「张家样」为南朝梁张僧繇创立的佛教人物画样式，人物体态丰腴、自成规范；唐代吴道子在其基础上创「吴家样」，周昉创「周家样」，三者与北齐曹仲达的「曹家样」并称古代佛像画四大样式，体现了佛教绘画中国化的过程。"],
    ["唐代人物画的主要成就", "①题材广阔：帝王功臣、仕女绮罗、宗教神怪、外国使节皆入画；②线描高度成熟：阎立本的铁线描、吴道子的兰叶描各具面貌；③重视写神：通过姿态、眼神、细节刻画人物性格与身份；④设色浓丽，形成「绮罗人物」的丰腴华美风格；⑤出现有明确师承与样式的画家群体，并被画史著录。"],
    ["唐代宗教壁画与《地狱变相》", "唐代寺观壁画盛极一时，吴道子在长安、洛阳寺观所画壁画多达三百余堵。相传他在景云寺画《地狱变相》，画中不见刀山油锅等恐怖刑具，而靠人物的神情与气势使人「毛骨悚然」，以致屠夫渔户观后改业，可见其绘画的感染力和「吴带当风」的艺术效果。"]
  ],

    ["张萱 / 周昉", "同为唐代绮罗仕女画家，皆画丰腴贵妇：张萱多画盛唐贵族游春、劳作等生活场面，明快活泼（《虢国夫人游春图》《捣练图》）；周昉多画中唐宫苑妇女的闲适寂寞，情调低沉（《簪花仕女图》），并创「周家样」「水月观音」。"],
    ["吴带当风 / 曹衣出水", "吴带当风指唐吴道子衣纹飘举飞动、笔势圆转；曹衣出水指北齐曹仲达衣纹紧窄贴体、如湿衣贴身。二者是古代人物画线描的两大典范。"],
    ["《步辇图》 / 《职贡图》", "皆唐初反映对外交往的人物画：《步辇图》为阎立本作，画唐太宗接见吐蕃使者禄东赞；《职贡图》画外国使节来朝进贡的形象，传为阎立本或梁元帝萧绎所作。"],

  must: [
    ["展子虔与《游春图》（名词解释）", "展子虔是隋代画家，善画人物、车马、台阁、山水，是隋代最有影响的画家之一。其代表作《游春图》是现存最早的山水卷轴画，绢本设色，描绘贵族士人在春日山水中骑马游赏的情景：以石青石绿敷染山石树木，远山近坡层次分明，水波用细线勾出，人物虽小却姿态可辨；人马、山石、树木比例趋于合理，改变了「人大于山、水不容泛」的早期画法。它标志着山水画已从人物画背景中独立出来，是青绿山水的开创之作。"],
    ["隋唐山水画的总体发展", "隋唐是山水画独立成科的时期，隋代展子虔《游春图》开其端；唐代形成两大体系：以李思训、李昭道父子为代表的青绿（金碧）山水，工整富丽、色彩浓重；以王维、张璪为代表的水墨山水，讲究笔墨与意境，被后世推为文人画之源。山水画从人物画背景变为独立画科，并出现专门的画法论述。"],
    ["李思训（名词解释）", "唐代青绿山水代表画家，官至右武卫大将军，人称「大李将军」。擅长山水、楼阁、佛道、花鸟，画风工整严谨、设色浓重，以金碧辉煌的青绿山水著称，被称为「金碧山水」。代表作《江帆楼阁图》。其子李昭道亦善此道，世称「大小李将军」。"],
    ["李昭道（名词解释）", "唐代画家，李思训之子，人称「小李将军」。继承家学而更趋精巧，擅长青绿山水与楼阁界画。代表作《明皇幸蜀图》，描绘唐玄宗避安史之乱入蜀的场面，画面山势险峻、云气缭绕，人马衣着鲜明，是唐代青绿山水的代表作。"],
    ["青绿山水与水墨山水（名词解释对比）", "青绿山水是以石青、石绿等矿物颜料为主色、勾勒轮廓后重彩敷染的山水样式，画面鲜艳富丽，盛唐李思训一派更用泥金勾染山石轮廓与云水，称「金碧山水」；代表画家有隋展子虔、唐李思训、李昭道，代表作品有《游春图》《江帆楼阁图》《明皇幸蜀图》，特征是工整细致、色彩浓丽、装饰性强。水墨山水是唐代兴起并以墨色浓淡代替色彩的山水样式，相传由王维首创、张璪继之，以破墨、泼墨表现山水气韵，讲求笔墨情趣与意境，为五代荆关董巨与宋元文人山水开辟了道路。"],
    ["王维（名词解释）", "唐代诗人、画家，官至尚书右丞，世称「王右丞」。擅长山水、人物，首创水墨渲染的山水画法，以「破墨」写山水，画风简淡清雅、富有诗意，苏轼评其「诗中有画，画中有诗」。代表作《辋川图》《雪溪图》。明代董其昌将其推为山水画「南宗」之祖、文人画之祖。"],
    ["张璪（名词解释）", "唐代水墨山水画家，善画松石山水。提出「外师造化，中得心源」的著名论断，主张以自然为师又要经过画家内心的加工创造，把写生与主观情思统一起来，是中国画创作论的重要命题。相传他画松能双管齐下，一为生枝、一为枯枝。"],
    ["外师造化，中得心源（名词解释）", "唐代张璪提出的绘画创作主张。「造化」指自然万物，「心源」指画家的内心感悟。意为既要师法自然、以自然为师，又要经过画家内心的陶铸与再创造，做到客观物象与主观情思的统一。它成为中国画创作的基本准则，对后世文人画影响深远。"],
    ["韩干（名词解释）", "唐代鞍马画家，官至太府寺丞。曾师曹霸，后以真马为师，画马体态雄健、骨肉停匀、神采生动。代表作《照夜白图》《牧马图》，是唐代鞍马画的代表人物，与以画牛著称的韩滉并称「韩马戴牛」中的「韩马」。"],
    ["韩滉（名词解释）", "唐代画家，官至宰相，封晋国公。擅长人物、田家风俗与走兽，尤以画牛著称。代表作《五牛图》以粗重厚拙的线条画出五头牛的不同姿态与神情，形神兼备，是现存最早的纸本中国画之一，反映唐代对农家题材的关注。"],
    ["张彦远《历代名画记》（名词解释）", "晚唐张彦远所著，是中国第一部绘画通史著作，成书于唐大中年间。全书十卷，记叙自上古至唐代的画家三百七十余人的事迹与品评，并论述绘画的源流、兴废、师承、技法、鉴藏等。书中提出「书画同源」「意存笔先，画尽意在」等著名论点，保存了大量珍贵的画史资料，被誉为画史中的《史记》。"],
    ["昭陵六骏（名词解释）", "唐太宗李世民昭陵前的六块浮雕石刻，刻于贞观年间，分别为飒露紫、拳毛騧、白蹄乌、特勒骠、青骓、什伐赤，是唐太宗征战时骑过的六匹战马的写真。六骏姿态各异，或立或行或奔，造型写实雄健，其中「飒露紫」与「拳毛騧」于近代流失海外，现藏美国宾夕法尼亚大学博物馆，其余四件藏西安碑林博物馆，是唐代陵墓浮雕的最高代表。"],
    ["唐三彩（名词解释）", "唐代盛行的低温铅釉陶器，因以黄、绿、白（也有褐、蓝）为主色而得名，多作明器随葬。采用二次烧成，先素烧再施釉低温烧制，釉色交融流淌、斑驳绚丽。代表作品有唐三彩马、骆驼、仕女俑、镇墓兽等，造型丰满生动，反映了唐代厚葬之风与中外文化交流的盛况。"],
    ["初唐四家（名词解释）", "指唐初书法家欧阳询、虞世南、褚遂良、薛稷。四家皆承王羲之书风而各具面貌：欧阳询楷书险劲严谨，代表作《九成宫醴泉铭》；虞世南楷书温润圆融，代表作《孔子庙堂碑》；褚遂良楷书清秀灵动，代表作《雁塔圣教序》；薛稷楷书瘦劲，代表作《信行禅师碑》。他们确立了唐楷的法度。"],
    ["颜真卿（名词解释）", "唐代书法家，官至太子太师，封鲁郡公，世称「颜鲁公」。楷书端庄雄伟、笔画肥厚、筋骨遒劲，世称「颜体」，与柳公权并称「颜筋柳骨」；行书《祭侄文稿》被誉为「天下第二行书」。代表作楷书《多宝塔碑》《颜勤礼碑》《麻姑仙坛记》。"],
    ["柳公权（名词解释）", "唐代书法家，官至太子少师，世称「柳少师」。楷书骨力遒劲、结体严紧、笔画瘦硬，世称「柳体」，与颜真卿并称「颜筋柳骨」。代表作《玄秘塔碑》《神策军碑》。他提出「心正则笔正」，以书法论人品，为后世所重。"],
    ["「颠张狂素」（名词解释）", "指唐代草书大家张旭与怀素。张旭性格狂放，嗜酒，人称「张颠」，其草书笔势奔放连绵、变化莫测，代表作《古诗四帖》；怀素为僧人，亦嗜酒，人称「醉素」「狂素」，草书笔走龙蛇、瘦劲飞动，代表作《自叙帖》《苦笋帖》。二人把唐代狂草推向高峰，合称「颠张狂素」。"],
    ["唐代石窟艺术（名词解释）", "唐代是石窟艺术的鼎盛期，主要遗存有敦煌莫高窟、龙门石窟、炳灵寺、麦积山、天龙山、四川大足等。敦煌唐代壁画以经变画、供养人像著称，色彩富丽、场面宏大；龙门石窟唐代造像以奉先寺卢舍那大佛为代表，面容丰润慈和、衣纹流畅，体现唐代雄健华美的时代风格，佛教造像至此完成中国化。"]
  ],
  confuse: [
    ["青绿山水 / 水墨山水", "青绿山水以石青石绿重彩敷染，工整富丽，代表展子虔、李思训、李昭道（《游春图》《江帆楼阁图》《明皇幸蜀图》）；水墨山水以墨色浓淡表现，简淡重意境，代表王维、张璪，为后世文人画之源。"],
    ["李思训 / 李昭道", "父子二人并称「大小李将军」：李思训（大李将军）画风工整富丽，代表作《江帆楼阁图》；李昭道（小李将军）更为精巧细致，代表作《明皇幸蜀图》。"],
    ["韩干 / 韩滉", "皆唐代名家但题材不同：韩干以画马著称（《照夜白图》《牧马图》）；韩滉以画牛著称（《五牛图》），并善田家风俗。"],
    ["颜真卿 / 柳公权", "并称「颜筋柳骨」：颜体端庄雄浑、笔画肥厚（《多宝塔碑》《颜勤礼碑》）；柳体骨力瘦硬、结体严紧（《玄秘塔碑》《神策军碑》）。"],
    ["张旭 / 怀素", "皆唐代狂草大家，合称「颠张狂素」：张旭人称「张颠」，代表作《古诗四帖》；怀素人称「醉素」「狂素」，代表作《自叙帖》。"],
    ["《游春图》 / 《明皇幸蜀图》", "皆青绿山水：《游春图》为隋展子虔（传）作，现存最早的山水卷轴画；《明皇幸蜀图》为唐李昭道作，画唐玄宗避乱入蜀。"]
  ],
  nums: [
    "《游春图》——传为隋展子虔作，现存最早的山水卷轴画。",
    "《历代名画记》——晚唐张彦远著，中国第一部绘画通史著作，全书十卷，记画家三百七十余人。",
    "昭陵六骏——唐太宗昭陵浮雕，六匹马名：飒露紫、拳毛騧、白蹄乌、特勒骠、青骓、什伐赤；飒露紫、拳毛騧流失美国。",
    "初唐四家＝欧阳询、虞世南、褚遂良、薛稷；欧阳询代表作《九成宫醴泉铭》。",
    "「颠张狂素」＝唐张旭与怀素；《祭侄文稿》为颜真卿行书，被誉为天下第二行书。",
    "《五牛图》——唐韩滉作，现存最早的纸本中国画之一，画五头牛。",

ART_CONTENT[9] = {
  frame: "五代两宋美术（一）五代绘画与北宋院体\n  一、五代人物画（顾闳中、周文矩）\n  二、五代北宋山水画（荆关董巨）\n  三、五代花鸟画（黄荃、徐熙）\n  四、宋代院体画",
  must: [
    ["五代绘画的总体面貌", "五代虽战乱，但南唐、西蜀因相对安定而成为绘画中心，并设画院。人物画承唐而精工，代表画家顾闳中、周文矩；山水画出现荆浩、关仝为代表的北方派与董源、巨然为代表的南方派；花鸟画形成黄荃的「黄家富贵」与徐熙的「徐熙野逸」两大体系，直接影响了北宋院体画与文人画的发展。"],
    ["顾闳中（名词解释）", "五代南唐画家，曾任南唐画院待诏。擅长人物，尤工仕女与贵族生活题材，用笔圆劲，设色浓丽，善于通过神情、动作刻画人物心理。代表作《韩熙载夜宴图》，是中国古代人物画的杰作。"],
    ["《韩熙载夜宴图》（名词解释）", "五代南唐顾闳中作（现存宋摹本），绢本设色。以连环长卷形式描绘南唐中书侍郎韩熙载在家设宴行乐的全过程，分听乐、观舞、暂歇、清吹、散宴五段，各段以屏风、床榻自然分隔。画中韩熙载神情抑郁、眉宇含忧，反衬出他避祸自保的处境。人物用线细劲，设色雅丽，是研究五代人物画与服饰、家具的重要作品。"],
    ["周文矩（名词解释）", "五代南唐画家，曾任南唐画院待诏。擅长人物、仕女、车马、楼观，画风继承周昉而更趋纤细，衣纹用「战笔」（颤笔）描，线条瘦硬颤动、流畅有力，人物体态修长、神态闲雅。代表作《重屏会棋图》《宫中图》。"],
    ["《重屏会棋图》（名词解释）", "五代南唐周文矩作（现存宋摹本），描绘南唐中主李璟与兄弟在屏风前下棋的情景。画中人物衣纹用战笔描，细劲颤动；背景屏风上又画一屏风与人物，形成「重屏」的巧妙构图，扩大了画面空间层次，是五代人物画的代表作。"],
    ["荆浩（名词解释）", "五代后梁山水画家，字浩然，号洪谷子，隐居太行山。他提出山水画要有「气、韵、思、景、笔、墨」六要（《笔法记》），并主张「搜妙创真」。画风气势雄伟，善写北方崇山峻岭、全景式构图。代表作《匡庐图》，是北方山水画派的开创者。"],
    ["关仝（名词解释）", "五代后梁山水画家，荆浩的弟子，与荆浩并称「荆关」。擅长表现关陕一带的雄伟山川，画风「石体坚凝，杂木丰茂」，山石用笔粗壮、气势峭拔，意境荒寒。代表作《关山行旅图》《山溪待渡图》，为北方山水画派代表。"],
    ["董源（名词解释）", "五代南唐山水画家，曾任南唐北苑副使，世称「董北苑」。善画江南丘陵江湖景色，创「披麻皴」与「点子皴」，山石用细长圆润的线条皴擦，再以密密苔点表现草木郁茂，画风平淡天真、烟雨迷蒙。代表作《潇湘图》《夏山图》《龙宿郊民图》，是南方山水画派的开创者，被后世奉为文人山水画之祖。"],
    ["巨然（名词解释）", "五代宋初僧人画家，师法董源，与董源并称「董巨」。擅长表现江南烟岚气象，画风清淡秀润，善用长披麻皴，山顶多作「矾头」（石块堆叠如矾石），林麓间点缀卵石。代表作《万壑松风图》《层岩丛树图》，是南方山水画派的继承者与发展者。"],
    ["「荆关董巨」与南北山水画派", "「荆关」指五代荆浩、关仝，代表北方山水画派，多写太行、关陕的崇山峻岭、全景构图，气势雄伟，用笔刚健；「董巨」指五代南唐董源、巨然，代表南方山水画派，多写江南丘陵江湖，用披麻皴与点子皴，画风平淡天真、烟雨迷蒙。两派共同确立了五代北宋山水画的格局，董巨一派为元明清文人画所宗。"],
    ["黄荃（名词解释）", "五代西蜀画家，曾任西蜀画院待诏、检校少府少监。擅长花鸟、山水、人物，所画多为宫苑中的珍禽瑞鸟、名花奇石，画法工整细致，先以淡墨勾线再层层赋色，形成「勾勒填彩」的工笔重彩样式，画风富丽精工，被称为「黄家富贵」。代表作《写生珍禽图》。其子黄居寀继其画风，成为北宋画院花鸟画的标准。"],
    ["徐熙（名词解释）", "五代南唐画家，终身不仕，人称「江南布衣」。擅长花鸟、蔬果、禽鱼，多画江湖汀花野竹、水鸟渊鱼，画法以墨为主，先用墨笔勾勒形体再略施淡彩，即「落墨花」，画风清新野逸，被称为「徐熙野逸」。代表作《雪竹图》。与黄荃并称「黄徐体异」，是五代花鸟画两大体系。"],
    ["「黄家富贵，徐熙野逸」（名词解释）", "指五代花鸟画的两大风格体系。黄荃为西蜀画院画家，多画宫苑珍禽名花，用勾勒填彩、工笔重彩，风格富丽精工，称「黄家富贵」；徐熙为江南布衣，多画汀花野竹、水鸟渊鱼，用落墨为主、略施丹粉，风格清新野逸，称「徐熙野逸」。二者的差异既源于题材与生活境遇，也源于画法，成为后世花鸟画工笔与写意分野的源头。"],
    ["院体画（名词解释）", "指由宫廷画院画家创作的绘画。五代西蜀、南唐始设画院，北宋设翰林图画院，至宋徽宗时最盛。院体画多取材于宫苑花鸟、珍禽瑞兽、山水楼阁与帝王生活，画风工整细致、富丽精工，讲求形似与法度，强调写生与观察，以黄荃父子的花鸟、北宋院体山水为代表，是中国工笔重彩传统的集中体现。"],
    ["北宋前期院体花鸟画", "北宋初年画院花鸟画以黄荃、黄居寀父子的「黄家富贵」为标准，画风工整富丽、勾勒填彩，被视为「院体」正宗。至北宋中期，赵昌、易元吉、崔白等画家注重写生与自然情态，崔白《双喜图》以生动自然打破黄氏一统的格局，使院体花鸟画由富丽转向清雅生动。"],

  must: [
    ["文人画（名词解释）", "又称「士人画」「士夫画」，由北宋苏轼明确提出并加以倡导，指文人士大夫所画的、区别于宫廷院体画与民间绘画的绘画。主张「论画以形似，见与儿童邻」，重神韵、轻形似，讲求笔墨情趣与诗画一律，多取材山水、花鸟、竹石，用以抒写胸中逸气。代表画家有苏轼、文同、米芾、米友仁，至元代赵孟頫、元四家而大盛，成为元明清画坛主流。"],
    ["苏轼的绘画主张（名词解释）", "北宋苏轼是文人画理论的奠基者。他提出「士人画」概念，主张「论画以形似，见与儿童邻」，认为绘画重在表现画家的品格与情思，不必拘泥形似；提倡「诗画一律」「诗中有画，画中有诗」；又提出「常形」与「常理」之分，强调画家应把握事物的内在规律。他善画枯木竹石，代表作《枯木怪石图》。"],
    ["米氏山水（名词解释）", "又称「米点山水」「云山墨戏」，为北宋米芾、米友仁父子所创。画法用饱含水分的横墨点层层叠加，称「落茄皴」（米点皴），表现江南烟雨迷蒙、云雾变幻的景色，不重形似而重墨韵与意境。米友仁代表作《潇湘奇观图》，是文人山水画的重要样式。"],
    ["米芾（名词解释）", "北宋书画家、鉴赏家，字元章，号襄阳漫士、海岳外史。书法与苏轼、黄庭坚、蔡襄并称「宋四家」，用笔八面出锋、沉着痛快；绘画独创「米点山水」，以横墨点写江南云山，代表作《春山瑞松图》。他精于鉴藏，著《画史》《书史》。"],
    ["梁楷（名词解释）", "南宋画家，曾任画院待诏，性格狂放，人称「梁疯子」。擅长人物、山水、花鸟，创「减笔」画法，用极简练奔放的笔墨概括对象，形简神完。代表作《泼墨仙人图》《太白行吟图》《六祖斫竹图》。其中《泼墨仙人图》以大块水墨泼写人物，开中国写意人物画之先河。"],
    ["《泼墨仙人图》（名词解释）", "南宋梁楷作，纸本水墨。画一位袒胸露腹、步履蹒跚的仙人，五官用细笔简略勾出，身躯与衣袍以大块淋漓的水墨泼扫而成，墨色浓淡自然变化，笔势奔放酣畅。全画形简神足，是现存最早的写意人物画杰作，体现了减笔画的最高成就。"],
    ["李公麟（名词解释）", "北宋画家，字伯时，号龙眠居士。擅长人物、鞍马、山水、花鸟，尤精白描，把过去仅作起稿用的白描发展为独立的绘画形式，线条如行云流水、洗练准确。代表作《五马图》《临韦偃牧放图》《免胄图》。"],
    ["《五马图》（名词解释）", "北宋李公麟作，纸本墨笔，画北宋元祐年间西域进贡的五匹名马——凤头骢、锦膊骢、好头赤、照夜白、满川花，每马由一名奚官牵引。全图纯用白描，线条遒劲洗练、富于变化，马的形态神骏，牵马人衣着神情各异，是白描画的典范作品。"],
    ["张择端《清明上河图》（名词解释）", "北宋张择端作，绢本设色长卷，现藏故宫博物院。描绘北宋都城汴京（今开封）清明时节汴河两岸的繁华景象，全卷可分郊野、汴河、街市三段：起首写城郊春色与驮队，中段写虹桥上下漕船争渡、行人如织，末段写城内街市店铺林立、车马喧嚣。全图共画人物五百余、牲畜数十，以散点透视与高度写实的笔法展现了宋代城市经济与市民生活，是中国风俗画的巅峰之作。"],
    ["北宋三大家（名词解释）", "指北宋山水画家李成、范宽、董源（一说李成、范宽、关仝）。李成善画寒林平远、气象萧疏，代表作《读碑窠石图》；范宽长于北方崇山峻岭，用「雨点皴」，代表作《溪山行旅图》《雪景寒林图》；董源写江南丘陵江湖，平淡天真。三家确立了北宋山水画的高峰，为后世所宗。"],
    ["范宽（名词解释）", "北宋山水画家，名中立，字仲立，因性情宽厚人称范宽，隐居终南山、太华山。画风峰峦浑厚、气势雄强，山石用「雨点皴」（豆瓣皴）密点如雨，山顶多作密林，构图取全景式。代表作《溪山行旅图》，以巨大山体占据画面大半，给人以震撼的崇高感。"],
    ["李成（名词解释）", "五代宋初山水画家，字咸熙，出身贵族而怀才不遇。擅长画寒林平野、雪景，用笔清瘦、墨法精微，画树如蟹爪（蟹爪枝），气象萧疏清旷。代表作《读碑窠石图》《寒林平野图》。他与范宽、董源并称北宋三大家，其画风影响了北宋院体山水。"],
    ["南宋四家（名词解释）", "指南宋画院画家李唐、刘松年、马远、夏圭。四家山水画一改北宋全景式构图，多用对角线取景的「一角半边」式章法，画面留白多、意境空灵，用笔刚健雄放并创大斧劈皴。李唐代表作《万壑松风图》《采薇图》；刘松年代表作《四景山水图》；马远代表作《踏歌图》《寒江独钓图》；夏圭代表作《溪山清远图》。"],
    ["马远（名词解释）", "南宋画家，世代为画院画家，光宗、宁宗时为画院待诏。擅长山水、人物、花鸟，构图多取一角半边之景，人称「马一角」；山石用大斧劈皴，笔法劲利，画水尤精。代表作《踏歌图》《寒江独钓图》《水图》。与夏圭并称「马夏」，是南宋院体山水的代表。"],
    ["夏圭（名词解释）", "南宋画家，宁宗时为画院待诏。擅长山水，构图常取半边之景，人称「夏半边」；用笔简括苍劲，善用秃笔带水作大斧劈皴，墨色淋漓，画面留白多而意境清远。代表作《溪山清远图》《山水十二景》。与马远并称「马夏」，同属南宋四家。"],
    ["「一角半边」构图（名词解释）", "指南宋马远、夏圭山水画的章法特点。他们不再采用北宋全景式构图，而把景物集中于画面的一角或半边，其余大片留白以表现烟水迷蒙的空阔境界，故马远称「马一角」、夏圭称「夏半边」。这种构图以少胜多、虚实相生，是南宋院体山水的重要特征。"],
    ["两宋风俗画（名词解释）", "北宋中期以后随城市经济发展而兴盛的人物画类别，多描绘市井生活、节令风俗与城乡百态。代表作品有张择端《清明上河图》、李嵩《货郎图》、苏汉臣《秋庭婴戏图》、燕文贵《七夕夜市图》等。其特征是场面宏大、人物众多、细节真实，具有很高的史料价值与社会认识价值，是中国古代写实绘画的高峰。"],

  must: [
    ["五代两宋美术时代背景", "五代十国分裂，南唐、西蜀因战乱较少而设画院，绘画承唐启宋，山水形成荆关董巨南北两大体系，花鸟形成黄徐二体。北宋统一后经济文化繁荣，宫廷画院鼎盛，山水、人物、花鸟三科并进，出现李成、范宽、郭熙等山水名家与崔白、赵佶等花鸟名家。南宋偏安，院体山水转为水墨苍劲、一角半边。宋代绘画总体特征是题材世俗化、文学趣味浓、写实与写意并行。"],
    ["黄筌（黄家富贵）", "五代西蜀宫廷画家。代表作《写生珍禽图》（现藏北京故宫博物院）。风格称「黄家富贵」「黄筌富贵」：多画宫中珍禽瑞鸟、奇花怪石，先以极细墨线勾勒轮廓再填浓艳色彩，即「勾勒填彩、旨趣浓艳」，造型精工逼真、富贵华美，为北宋前期画院的标准风格。"],
    ["徐熙（徐熙野逸）", "五代南唐画家，一生未入画院。代表作《雪竹图》《石榴图》。风格称「徐熙野逸」：多画汀花野竹、水鸟渊鱼，以墨为主、落墨为格，略施丹粉，即「落墨为格、杂彩副之」，笔法清秀、野逸自然，开后世水墨写意花鸟的先声。与黄筌并称「黄徐体异」。"],
    ["黄徐体异", "五代花鸟画的两大体系：黄筌尚勾勒填彩、富贵精工，徐熙尚落墨为格、野逸清雅，一在宫廷一在民间，题材与画法均异。北宋前期黄家风格统治画院近百年，直到崔白出现才被打破，此后两体互相融合，形成工笔与写意两大花鸟传统。"],
    ["崔白《双喜图》", "北宋神宗画院画家。代表作《双喜图》《寒雀图》。《双喜图》画秋风枯草间野兔与山坡山喜鹊相呼应，一静一动，刻画入微、秋意萧瑟，属兼工带写、设色清淡的「院体新体花鸟」。他改变了黄筌父子以来百年富丽画风，是北宋花鸟画的转折点。"],
    ["翰林图画院", "五代宋初正式设立、宋代规模最大的官方绘画机构，北宋翰林图画院为全国绘画中心，宋徽宗时最盛。画师有待诏、艺学、祗候、学生等等级，授以「图画院待诏」「画学正」等职名；写御容、图经、寺观壁画、书籍插图皆归其职。宋代名画家如黄居寀、崔白、郭熙、张择端、王希孟、李唐、马远等多出于画院。"],
    ["画学与命题取士", "宋徽宗崇宁三年（公元 1104 年）设「画学」，是中国最早的宫廷绘画学校，后并入画院，以考试取士，兼习经义与画艺。命题多取诗句，如「踏花归去马蹄香」以蝴蝶追逐马蹄表现香、「竹锁桥边卖酒家」只画桥头酒帘、「野水无人渡，孤舟尽日横」以舟子卧吹横笛表现无人，崇尚立意含蓄、诗画一律。"],
    ["宋徽宗赵佶", "北宋皇帝，也是宋代最著名的画家。在位期间把画院推向鼎盛，编《宣和画谱》《宣和书谱》《宣和博古图》，刻《大观帖》；绘画上要求画院格物写实（如孔雀升墩必先举左足、月季须辨四时朝暮花蕊叶，传为画院考校故事）。代表作《芙蓉锦鸡图》《瑞鹤图》《听琴图》《柳鸦芦雁图》，花鸟造型严谨、设色典雅，兼工笔与水墨。"],
    ["瘦金体", "宋徽宗赵佶自创的楷书字体。笔画细劲挺拔、转折顿挫如竹节，结体修长舒展，横画收笔带钩，撇如匕首、捺如切刀，整体瘦硬而飘逸，故称「瘦金体」。代表作品《楷书千字文》《秾芳诗帖》《宣和通宝钱文》。它在楷书史上独树一帜，是书画审美相通、画院重视书法的典型例证。"],
    ["宋代书法（北宋四家、南宋四家）", "宋代书法重「尚意」，不拘唐人法度、强调个人性情。北宋四家为苏轼、黄庭坚、米芾、蔡襄（亦作苏黄米蔡）：苏轼《黄州寒食诗帖》被称「天下第三行书」，丰腴跌宕、天真烂漫；黄庭坚《松风阁诗》，点画开张、长笔波折；米芾《蜀素帖》《苕溪诗帖》，八面出锋、沉着痛快；蔡襄书法端庄淳厚，苏轼推为宋朝第一。南宋四家为陆游、范成大、朱熹、张即之。"],
    ["宋代陶瓷工艺", "宋代是中国单色釉瓷的高峰，以造型简洁、釉色纯净、装饰含蓄为美。五大名窑各有绝技：汝窑天青釉、蟹爪纹开片；官窑紫口铁足、开大片；哥窑金丝铁线；钧窑窑变红蓝釉，「入窑一色，出窑万彩」；定窑白釉、覆烧、印花刻花。另有磁州窑白地黑花、耀州窑青釉刻花、龙泉窑粉青梅子青、景德镇青白瓷（影青）。"],
    ["汝窑、钧窑", "汝窑为北宋晚期宫廷烧造青瓷，窑址在今河南宝丰清凉寺，釉色天青、釉面有蟹爪纹开片，常用裹足支烧留下芝麻钉痕，传世品极少。钧窑创烧于北宋，窑址在今河南禹州神垕镇，以铜为呈色剂烧出窑变红蓝釉（铜红釉），「入窑一色，出窑万彩」，是宋瓷中最富变化的品种。"],
    ["官窑、哥窑", "官窑有北宋官窑与南宋官窑（修内司、郊坛下）之分，专烧宫廷用瓷，釉色粉青、灰青，口沿薄釉处呈紫褐、足部无釉处呈铁黑，即「紫口铁足」，釉面多开大片。哥窑以「金丝铁线」为标志，即釉面开片呈深色（铁线）与金黄色（金丝）交错，釉色灰青、米黄为主；其窑址至今未定，学术界多以哥窑属南宋或龙泉窑系。"],
    ["定窑", "宋代五大名窑之一，窑址在今河北曲阳涧磁村，是五大名窑中唯一以白瓷著称者。白釉微泛牙黄，装饰有刻花、划花、印花，以印花最精；因器物多覆烧（倒扣叠烧）故口沿无釉，称「芒口」，常包金银铜边，称「金装定器」。定窑在北宋一度为宫廷烧瓷，后因定州受战事影响而衰落。"],
    ["李迪、法常等南宋花鸟", "南宋花鸟画趋向精微与简率两极：李迪、李安忠、苏汉臣等院体画家工细写实、富有生活情趣，李迪有《风雨归牧图》《鸡雏待饲图》；僧法常（号牧溪）以水墨写意花鸟著称，代表作《观音猿鹤图》等，笔墨简放，被称为「牧溪样」，对日本水墨画影响极大。此期花鸟多与山水、风俗画结合，重视瞬间情态与诗意。"],
    ["宋代绘画总体特征", "宋代是古代绘画的鼎盛期：题材上山水花鸟人物并盛，宫廷画院与文人画同时登顶，出现「院体画」「文人画」并行的格局；形式上讲究写生与格物、形神兼备，诗意入画、题跋渐多；绘画功能从「成教化、助人伦」扩展到玩赏与抒情；出现了系统的绘画史论著作，如郭若虚《图画见闻志》、邓椿《画继》、刘道醇《圣朝名画评》。"],
    ["黄居寀", "黄筌之子，北宋初画院待诏，继承父风，是「黄家富贵」在宋初画院的代表，其画一度成为画院品评画家的标准。代表作《山鹧棘雀图》。他与徐熙之孙徐崇嗣的画风之争，是宋初画院黄徐二体消长的标志性事件。"]
  ],
  confuse: [
    ["黄筌 / 徐熙", "黄筌是西蜀宫廷画家、风格「黄家富贵」（勾勒填彩、精工艳丽）；徐熙是南唐在野画家、风格「徐熙野逸」（落墨为格、水墨清淡），一富贵一野逸。"],
    ["宋徽宗赵佶 / 宋高宗赵构", "赵佶（徽宗）是北宋皇帝，办画学、编《宣和画谱》、创「瘦金体」，代表作《芙蓉锦鸡图》；赵构（高宗）是南宋开国皇帝，擅长书法，代表作《草书洛神赋》，一为北宋画家皇帝、一为南宋书家皇帝。"],
    ["汝窑 / 钧窑", "汝窑是青瓷、天青釉、蟹爪纹开片、芝麻钉；钧窑是窑变釉、铜红蓝斑、「入窑一色，出窑万彩」，一个素净一个绚烂。"],
    ["官窑 / 哥窑", "官窑有明确宫廷窑场（修内司、郊坛下），特征「紫口铁足」、釉面开大片；哥窑窑址至今未定，特征「金丝铁线」（开片呈深色铁线与金黄色金丝交错）。"],
    ["定窑 / 景德镇青白瓷", "定窑在河北曲阳，是白釉瓷、覆烧、口沿「芒口」、印花刻花；景德镇青白瓷（影青）釉色介于青白之间、胎薄透光、刻花流畅，属南方青白瓷系统，与定窑白瓷不同。"],
    ["翰林图画院 / 画学", "翰林图画院是官方绘画创作机构（画师供职作画）；画学是宋徽宗设的宫廷绘画学校（教学与考试取士），二者并存，画学后并入画院。"]
  ],
  nums: [

    "宋徽宗赵佶创「瘦金体」，代表作《芙蓉锦鸡图》《瑞鹤图》",

ART_CONTENT[12] = {
  frame: "元代美术\n  一、文人画与山水画新变\n    1. 文人画理论\n    2. 山水画由院体转向写意\n  二、元初名家\n    1. 赵孟頫\n    2. 钱选、高克恭、李衎\n  三、元四家\n    1. 黄公望、吴镇\n    2. 倪瓒、王蒙\n  四、王冕与墨梅\n  五、永乐宫壁画\n  六、元代工艺\n    1. 青花与釉里红\n    2. 织造与漆器",
  must: [
    ["元代美术时代背景", "元代是蒙古族建立的大一统王朝，实行民族等级与科举停废政策，大批汉族文人仕进无门，转而寄情书画，文人画因此成为画坛主流。绘画上摒弃南宋院体的精工刻画，上追北宋与唐，讲求笔墨情趣与书法入画，山水画由「再现」转向「表现」；水墨写意、浅绛设色风行，梅兰竹菊「四君子」题材盛行。宗教壁画与工艺美术（青花、纳石失、雕漆）亦有突出成就。"],
    ["文人画", "泛指文人、士大夫所作之画，以区别于民间画工与宫廷院画。理论由北宋苏轼提出并奠基，经赵孟頫到元四家确立，元末明初董其昌正式称「文人画」。特征：重神韵、轻形似，讲求「以书入画」「书画同源」，诗书画印结合，题材多山水与梅兰竹菊，强调自娱遣兴与个人品格，代表作如赵孟頫《秀石疏林图》、倪瓒《渔庄秋霁图》。"],
    ["元代山水画新变化", "元代山水画由南宋院体的刻画雕琢转向萧散简远、抒情写意：一是笔墨由「描」转「写」，干笔皴擦、水墨渲染成为独立审美对象；二是构图多平远、疏简，追求空旷寂寥的意境；三是内容多为隐居、渔隐、林泉之志，寄托文人避世情怀；四是讲求诗书画一体，题跋成为画面构成。代表为元四家的水墨与浅绛山水。"],
    ["赵孟頫", "元代文人画的领袖，元代书画复古与「以书入画」的倡导者。书法各体兼善（楷、行、草、篆、隶），与欧、颜、柳并称「四大楷书家」。绘画主张「作画贵有古意」，力追北宋与唐，反对南宋院体的刻露；又主张「书画本来同」，强调以书法笔意入画。代表作《鹊华秋色图》《秋郊饮马图》《秀石疏林图》《红衣罗汉图》，书法有《洛神赋》《胆巴碑》。"],
    ["钱选", "元代文人画家，湖州吴兴人，与赵孟頫同为「吴兴八俊」。山水、花鸟、人物皆能，画风不入南宋院体，用笔生拙秀润、设色清雅，有士气而无作家习气。代表作《浮玉山居图》《山居图》《八花图》。赵孟頫曾问其「何以称士气」，他答「隶体耳」，强调以书法入画、脱去院体甜熟。"],
    ["高克恭", "元代山水画家，官至刑部尚书。继承米芾、米友仁的「米氏云山」传统，又融合董源、巨然的披麻皴，画云山烟雨、笔墨浑厚中见秀润，是元代米氏云山一路的代表人物。代表作《云横秀岭图》《春山晴雨图》。《云横秀岭图》兼有墨骨与青绿，被视为元代山水融合南北的典型。"],
    ["李衎", "元代画竹名家，官至集贤殿大学士。擅长画枯木竹石，师法文同而有己意，笔法沉着、形神兼备，双钩着色与墨竹皆能。著《竹谱详录》，详细记录竹的品类、形态与画法，是研究画竹的重要文献。代表作《四清图》《双钩竹图》《沐雨图》。"],
    ["元四家", "指黄公望、吴镇、倪瓒、王蒙（明末董其昌定名）。四家同承赵孟頫的文人画传统，以水墨或浅绛作山水，讲究「以书入画」、干笔皴擦，重笔墨情趣与画中意境，题材多写隐逸生活；把元代文人山水推到高峰，直接成为明清文人画的正宗。代表作：黄公望《富春山居图》、吴镇《渔父图》、倪瓒《渔庄秋霁图》、王蒙《青卞隐居图》。"],
    ["黄公望", "元四家之首，字子久，号大痴道人，江苏常熟人。代表作《富春山居图》，纸本水墨，描绘富春江两岸初秋景色，用披麻皴与干笔淡墨，笔势雄放洒脱、浅绛设色温润，历时数年完成，是元代文人山水画的顶峰；因遭火焚断为两段，前段《剩山图》藏浙江省博物馆，后段《无用师卷》藏台北故宫博物院。另有《九峰雪霁图》《天池石壁图》与画论《写山水诀》。"],
    ["吴镇", "元四家之一，字仲圭，号梅花道人，浙江嘉兴人。一生清贫隐居，以卖卜卖画为生。擅山水与墨竹，山水多写渔父、江渚，用湿笔重墨、笔力雄劲，长披麻皴厚重圆浑，画面苍茫沉郁。代表作《渔父图》《双桧平远图》《秋江渔隐图》，并有《墨竹谱》传世。"],
    ["倪瓒", "元四家之一，字元镇，号云林，江苏无锡人。画风简淡萧疏，创「一河两岸」式构图，近景坡石疏树、中景大片留白为水、远景遥岑，用干笔淡墨折带皴，不画人物与舟桥，意境空寂荒寒。代表作《渔庄秋霁图》《容膝斋图》《六君子图》。画论主张「逸笔草草，不求形似，聊以自娱」，是文人画「逸品」审美最典型的表述。"],
    ["王蒙", "元四家之一，字叔明，号黄鹤山樵，赵孟頫外孙。画风以繁密苍郁著称，用解索皴、牛毛皴，重山复岭、林木葱郁、苔点繁密，构图饱满、笔墨功力极深。代表作《青卞隐居图》《葛稚川移居图》《春山读书图》，与倪瓒的简淡形成「一繁一简」的鲜明对照。"],
    ["王冕", "元代画梅名家，字元章，号煮石山农，浙江诸暨人。擅墨梅又创用胭脂作没骨体梅花，以淡墨点瓣、浓墨点蕊。代表作《墨梅图》，枝干挺劲、花朵清润，自题诗「不要人夸好颜色，只留清气满乾坤」，是诗书画印结合、以梅自况的典型，对明清画梅影响很大。"],
    ["永乐宫壁画", "元代道教壁画代表，在山西芮城永乐宫。三清殿《朝元图》为主体，为泰定二年（公元 1325 年）马君祥等绘，绘道教神祇朝拜元始天尊的行列，人物众多、多达数百身，帝君威武、玉女端庄，衣纹用铁线描与兰叶描，线条雄健流畅、设色厚重富丽，是元明壁画中规模最大、保存最完整者之一。另有纯阳殿《纯阳帝君神游显化图》以连环画形式画出吕洞宾故事，重阳殿画王重阳故事。"],
    ["元代工艺（青花、釉里红）", "元代景德镇烧出成熟青花与釉里红，是中国陶瓷史的转折。青花以钴料在坯上彩绘、罩透明釉后高温一次烧成，呈白地蓝花，色调浓艳沉稳，典型器物有「至正十一年」铭青花云龙象耳瓶、「萧何月下追韩信」梅瓶。釉里红以铜为呈色剂，在釉下彩绘经高温还原烧成红色，因铜红极易发色不良，成品稀少而珍贵。"],
    ["纳石失、雕漆等元工艺", "元代工艺美术体现蒙汉交流：织造上加金的「纳石失」为贵官专用，身份等级标志明确；瓷器上青花、釉里红开辟新路；漆器以嘉兴张成、杨茂的雕漆（剔红）最有名，戗金、螺钿亦盛。玉器、银器出现朱碧山等名匠，工艺多富丽繁复，服务于宫廷与贵族的生活需求。"],
    ["赵孟頫《鹊华秋色图》", "赵孟頫为友人周密所画的纸本设色山水，画济南鹊山与华不注山的平远秋景，平原洲渚、枯木疏林，用笔古拙含蓄、设色清润淡雅，取董源、巨然一路而自出新意，是元代文人山水的开山之作，也是「作画贵有古意」主张的实践典范。现藏台北故宫博物院。"]
  ],
  confuse: [
    ["元四家 / 赵孟頫、钱选", "元四家是黄公望、吴镇、倪瓒、王蒙（元末，文人山水代表）；赵孟頫、钱选、高克恭、李衎属元初名家，是元四家的前辈与先导，不要把赵孟頫算进元四家。"],
    ["赵孟頫「作画贵有古意」/ 倪瓒「逸笔草草，不求形似」", "赵孟頫主张上追唐北宋、以书法入画而反对南宋院体（讲法度与古意）；倪瓒主张逸笔草草、聊以自娱、不求形似（讲自娱与逸气），一重古法一重自娱。"],
    ["黄公望《富春山居图》/ 倪瓒《渔庄秋霁图》", "《富春山居图》以披麻皴、干笔淡墨写富春江两岸长卷、峰峦浑厚；《渔庄秋霁图》以折带皴、「一河两岸」写疏林坡石、空旷荒寒，一繁一简。"],
    ["王冕墨梅 / 胭脂没骨体", "墨梅是纯用水墨点瓣画梅，清雅孤高；胭脂没骨体是用胭脂（红色颜料）不勾轮廓直接点染梅花，两者都出自王冕，不要混为一说。"],
    ["元代青花 / 元代釉里红", "青花用钴料呈白地蓝花；釉里红用铜料呈釉下红色，呈色剂不同、铜红更难烧成，成品更稀见。"],
    ["永乐宫《朝元图》/ 敦煌莫高窟壁画", "《朝元图》为元代山西芮城永乐宫三清殿的道教壁画，作者马君祥等；莫高窟壁画为敦煌佛教石窟壁画，时代自北凉至元，二者宗教属性与地点、时代都不同。"]
  ],
  nums: [
    "元四家＝黄公望、吴镇、倪瓒、王蒙（明末董其昌定名）",
    "黄公望《富春山居图》遭火焚断为两段：《剩山图》＋《无用师卷》",
    "倪瓒《渔庄秋霁图》作于公元 1372 年",
    "永乐宫三清殿《朝元图》绘于泰定二年（公元 1325 年），作者马君祥等",
    "元代书画复古、强调「以书入画」的代表人物是赵孟頫",
    "王冕以画梅著称；朱碧山是元代银器名匠",
    "元四家身份：黄公望号大痴道人 / 吴镇号梅花道人 / 倪瓒号云林 / 王蒙号黄鹤山樵"
  ]
};
ART_CONTENT[13] = {
  frame: "明清美术\n  一、明代绘画\n    1. 浙派与吴门画派\n    2. 明四家\n  二、写意花鸟（青藤白阳）\n  三、人物画\n    1. 南陈北崔\n    2. 曾鲸与波臣派\n  四、晚明山水与画论\n    1. 董其昌「南北宗论」\n    2. 松江派\n  五、清代绘画\n    1. 清初四僧\n    2. 四王与清六家\n    3. 恽寿平、龚贤\n  六、扬州画派\n  七、宫廷绘画与画谱\n    1. 郎世宁\n    2. 芥子园画谱\n  八、西泠八家",
  must: [
    ["明清美术时代背景", "明代商品经济发展、城市繁荣，书画成为商品并出现职业画家与收藏市场；画坛前期由浙派（承南宋院体）与吴门画派（承元人文人画）先后主导，后期董其昌倡「南北宗论」重立文人画正统。清代画坛分正统派（四王，摹古）与革新派（四僧、扬州画派，尚个性）两条线；宫廷有郎世宁等中西合璧绘画，版画、年画、工艺美术均极发达。"],
    ["浙派与吴门画派", "浙派以戴进为开创者，吴伟、蓝瑛等继之，取法南宋李唐、马远、夏圭院体，笔墨劲健放纵、注重气势，因戴进为浙江人而得名，是明前期画坛主流。吴门画派以沈周为创始人，文徵明、唐寅、仇英等继起，取法元四家文人画传统，讲求诗书画一体、笔墨文雅含蓄，因苏州（吴门）而得名，明中叶以后取代浙派成为主流。"],
    ["明四家（吴门四家）", "指沈周、文徵明、唐寅、仇英，皆活动于苏州一带，是吴门画派的代表。沈周为创始人，画风粗简浑厚；文徵明兼工细与粗放，称「细文」「粗文」；唐寅（唐伯虎）才气纵横，山水人物俱佳；仇英出身工匠而工笔精丽，长于青绿山水与工笔人物。四人使文人画在明代取得画坛正统地位。"],
    ["沈周与文徵明", "沈周，吴门画派创始人、明四家之首，长洲（今苏州）人，继承元四家尤其黄公望、吴镇的画法，用笔沉厚豪放、晚年尤苍劲，代表作《庐山高图》（为老师陈宽祝寿而作）、《夜坐图》。文徵明，沈周弟子，与沈周并称「沈文」，能画山水人物花卉，山水分工细文雅的「细文」与水墨粗放的「粗文」，代表作《真赏斋图》《兰亭修禊图》，书法与祝允明、王宠并称吴门书派。"],
    ["陈淳（白阳）", "明代写意花鸟画家，字道复，号白阳山人，文徵明弟子。擅长水墨写意花鸟，用笔疏爽奔放、墨色淋漓，一变乃师工整含蓄而为放逸，开明代水墨大写意花鸟之门。代表作《秋葵图》《葵石图》《洛阳春色图》。与徐渭并称「青藤白阳」。"],
    ["徐渭（青藤）", "明代写意花鸟画的集大成者，字文长，号青藤道士、天池山人，浙江山阴人。一生坎坷、几度自戕，把草书笔意与泼墨技法用于花鸟，笔酣墨饱、水墨淋漓、狂放不羁，借物抒愤。代表作《墨葡萄图》（自题「笔底明珠无处卖，闲抛闲掷野藤中」）、《杂花图卷》《黄甲图》。与陈淳并称「青藤白阳」，对八大山人、扬州画派及近代写意花鸟影响极大。"],
    ["「青藤白阳」", "指明代写意花鸟画两位代表：徐渭号青藤道士、陈淳号白阳山人，故合称「青藤白阳」。陈淳开其端，徐渭集其成，二人把写意花鸟由工整勾勒推向水墨大写意，重笔墨情趣与个人情感抒发，是明清写意花鸟画的开创者与高峰。"],
    ["「南陈北崔」", "指明末两位人物画家陈洪绶与崔子忠。陈洪绶号老莲，浙江诸暨人，人物造型夸张变形、躯干伟岸、线条高古如铁线，晚年益趋古拙，代表作《归去来辞图》《女仙图》，并为《水浒叶子》《西厢记》作版画插图；崔子忠，山东莱阳人，善白描人物、衣纹稠密。二人皆能自出机杼，人物画风相近而并称。"],
    ["曾鲸与波臣派", "曾鲸字波臣，明代后期著名肖像画家，福建莆田人，流寓南京。他在传统「墨骨」法基础上吸收西洋画法的明暗与结构，先以淡墨勾出五官结构、再敷彩层层烘染，使肖像兼具立体感与真实感，重「传神写照」。代表作《王时敏像》《张卿子像》。弟子众多，形成「波臣派」，是明清肖像画最重要的流派。"],
    ["董其昌「南北宗论」", "明代后期董其昌（字玄宰，号思白、香光居士，官至礼部尚书）提出的山水画宗派学说：以唐代王维为始祖、李思训父子为北宗之祖，将画家分为南宗（文人画，尚渲淡、重笔墨、讲顿悟，如董源、巨然、米芾、元四家）与北宗（行家画，尚钩斫、精工刻画，如李思训、赵伯驹、马远、夏圭），并崇南抑北。此说以禅喻画，为文人画争正统，影响明清画坛数百年；但其划分不完全符合史实，有牵强附会、门户之见。代表作《秋兴八景图》，画论见《画禅室随笔》。"],
    ["松江派", "晚明以松江（今上海）为中心的山水画流派，领袖为董其昌，另有顾正谊、莫是龙、赵左、沈士充等。承吴门画派文人画传统而更重笔墨形式与摹古，讲究「以画为寄」「以画为乐」，把董其昌「南北宗论」与以书法入画的主张落到创作中，后期分化为以赵左为首的苏松派、以沈士充为首的云间派，是明末清初文人山水的主流。"],
    ["清初四僧", "指弘仁、髡残、朱耷（八大山人）、石涛四位僧人画家，皆为明末遗民，入清后出家或为僧，画风个性强烈、反对一味摹古。弘仁（渐江）学倪瓒，画黄山以清逸冷峻著称，代表作《黄海松石图》；髡残（石溪）笔墨苍茫深厚，代表作《苍翠凌天图》；朱耷（八大山人）以水墨大写意花鸟名世，造型夸张、笔墨简练，多作「白眼向人」的鱼鸟；石涛（苦瓜和尚）山水笔墨纵横、变化多端，主张「笔墨当随时代」「我用我法」，著《苦瓜和尚画语录》，代表作《搜尽奇峰打草稿》。"],
    ["清初四王（清六家）", "指王时敏、王鉴、王翚、王原祁四位正统派山水画家，与吴历、恽寿平合称「清初六家」。四王承董其昌的南北宗论，主张摹古、以元四家尤其黄公望为宗，讲究笔墨章法与古法程式，画风温润平正、法度森严，受皇室推崇而成为清初画坛正统，影响直至清末。代表作：王时敏《仿古山水》、王翚《康熙南巡图》、王原祁《山中早春图》。"],
    ["恽寿平与龚贤", "恽寿平（号南田）为清初六家之一，创「没骨花卉」，不用墨线勾轮廓、直接以色彩晕染，清雅秀润、形神兼备，代表作《牡丹图》《出水芙蓉图》，是清代花鸟画正统。龚贤为「金陵八家」之首，长于积墨山水，用墨层层积染至浓黑厚重，画面黑白对比强烈、气氛沉郁清冷，代表作《千岩万壑图》《木叶丹黄图》。"],
    ["扬州画派与扬州八怪", "清乾隆年间活跃于扬州的一批鬻画为生的画家，以金农、郑燮、黄慎、李鱓、李方膺、汪士慎、高翔、罗聘为代表（另有华喦等），人称「扬州八怪」。他们因画风不合正统、被视作怪异而得名，主张自立门户、抒发个性，题材多梅竹松石、花鸟人物，兼工书法篆刻。其中郑燮号板桥，擅画兰竹石，提出「眼中之竹——胸中之竹——手中之竹」的创作过程论，自创「六分半书」题画，代表作《竹石图》《兰竹图》；金农号冬心，画梅古拙奇特，自创笔画方扁浓重的「漆书」，代表作《墨梅图》。因扬州盐商经济繁荣、绘画商品化，此派得以立足，是清代最具革新精神的画派。"],
    ["郎世宁", "清代康熙、雍正、乾隆三朝宫廷画家，意大利耶稣会传教士（原名 Giuseppe Castiglione）。以西洋明暗、透视法与中国画笔墨、题材相结合，形成中西合璧的宫廷画风，长于人物、骏马、花鸟走兽与纪实绘画。代表作《百骏图》《十骏图》《嵩献英芝图》，并参与圆明园西洋楼建筑的设计，是清代中西美术交流的关键人物。同期来华的传教士画家还有王致诚、艾启蒙。"],
    ["《芥子园画谱》", "清代绘画技法图谱，由李渔之婿沈心友主持，王概、王蓍、王臬兄弟编绘，康熙十八年（公元 1679 年）初集问世，因刻于李渔别墅「芥子园」而得名。分三集，系统示范树石、山水、梅兰竹菊、花鸟草虫的程式与画法，图文对照、便于临摹，是中国影响最大的绘画入门教材，流传至日本、朝鲜。"],
    ["西泠八家", "清代篆刻流派，又称「浙派」，以丁敬为首，继起者为蒋仁、黄易、奚冈、陈豫钟、陈鸿寿、赵之琛、钱松，八人皆为浙江杭州人，故称「西泠八家」。宗法秦汉印，讲究刀法（善用切刀），风格古拙朴茂、苍劲生涩，力矫当时甜熟柔媚的印风，是清代影响最大的篆刻流派之一，与皖派（邓石如）并称。"]
  ],
  confuse: [
    ["吴门画派 / 浙派", "吴门画派（沈周、文徵明等，苏州）取法元四家文人画，笔墨文雅含蓄、诗书画一体；浙派（戴进、吴伟等）取法南宋院体，笔墨劲健放纵、注重气势，一崇元人一法南宋。"],
    ["陈淳、徐渭 / 青藤白阳", "「青藤」是徐渭的号，「白阳」是陈淳的号，青藤白阳即指此二人，不是四个人；陈淳开写意花鸟之门、徐渭集其大成。"],
    ["「南陈北崔」/ 「明四家」", "南陈北崔指陈洪绶、崔子忠两位明末人物画家（古拙夸张、变形高古）；明四家指沈周、文徵明、唐寅、仇英（山水为主），二者人物不同、领域不同。"],

ART_CONTENT[14] = {
  frame: "外国美术史·第一章 原始古代美术（一）古埃及\n  一、古埃及美术特点\n    1. 宗教性与为法老服务\n    2. 程式化法则（正面律）\n  二、金字塔\n    1. 马斯塔巴、阶梯金字塔\n    2. 吉萨三大金字塔\n  三、狮身人面像（斯芬克斯）\n  四、正面律与浮雕壁画\n  五、神庙与雕塑、工艺",
  must: [
    ["古埃及美术时代背景", "古埃及美术指公元前 3000 年左右至公元前 30 年（托勒密王朝被罗马吞并）古代埃及的美术。埃及是尼罗河孕育的中央集权奴隶制国家，国王（法老）被视为神，宗教上相信灵魂不灭与来世复活，故美术主要服务于宗教祭祀与丧葬，为法老和贵族服务，长期封闭稳定、程式固定，具有强烈的功利性与永恒性追求。"],
    ["古埃及美术的主要特点", "①宗教性与功利性：为法老与宗教服务，「来世」观念支配创作；②稳定与程式化：数千年风格变化极小，人物雕刻遵循「正面律」等固定法则；③宏伟庄严：金字塔、神庙体量巨大，强调永恒与秩序；④写实与程式结合：局部刻画细致写实，整体比例与姿态受法则约束；⑤装饰性强：浮雕壁画分层分格、色彩鲜明，图文并用。"],
    ["古埃及美术分期", "①古王国时期（约公元前 2686—2181 年，含第三至第六王朝）：美术的第一个高峰，金字塔、狮身人面像与《村长像》《书吏凯伊像》等雕塑；②中王国时期（约公元前 2040—1786 年）：陵墓与方尖碑，雕塑更注重人物个性；③新王国时期（约公元前 1567—1085 年，含第十八至第二十王朝）：帝国的黄金时代，卡纳克与卢克索神庙、阿布辛贝勒石窟庙、图坦卡蒙墓与《纳菲尔提提王后像》、阿马尔奈风格（埃赫那顿宗教改革带来的短暂写实新风）；④后期与托勒密时期：受外来影响，渐趋衰落。"],
    ["金字塔", "古埃及法老的陵墓，由早王朝的「马斯塔巴」（长方形平顶石墓）发展而来：第三王朝左塞尔的萨卡拉阶梯金字塔（建筑师伊姆霍特普设计，六层阶梯，第一座金字塔）→ 第四王朝斯涅弗鲁的折线金字塔与真正金字塔 → 吉萨三大金字塔（胡夫、哈夫拉、门卡乌拉）达于顶峰。金字塔以巨大石灰石块垒砌、四面呈等腰三角形、方位与天体对应，象征法老的神性与永恒，是王权与宗教结合的产物。"],
    ["吉萨三大金字塔", "位于开罗附近吉萨高地，为第四王朝法老陵墓：胡夫金字塔最大，原高约 146.5 米、底边各长约 230 米，由约 230 万块巨石砌成，是古代世界七大奇迹中唯一保存至今者；哈夫拉金字塔次之，原高约 143.5 米，其前有狮身人面像；门卡乌拉金字塔最小，原高约 66 米。三者成对角线排列，附有祭庙、神道与王后小金字塔，体现严整的规划与工程能力。"],
    ["狮身人面像（斯芬克斯）", "位于吉萨哈夫拉金字塔前，由整块石灰岩雕成，约长 57 米、高约 20 米，面部即为哈夫拉法老的形象。人面象征智慧、狮身象征力量，是法老神性与威严的守护者。因长期风沙侵蚀，面部与身体残损严重，是古埃及最著名的巨石雕刻。"],
    ["正面律", "古埃及人物雕刻与绘画遵循的核心程式法则：①头部为侧面（脸朝一侧），眼睛为正面；②肩与胸为正面；③腰部以下（骨盆、腿、脚）为侧面，双脚一前一后；④人物身份决定大小比例，法老最大、随从最小；⑤全身各部分按固定比例分格。目的是让形象的每一部分都取最完整、最易辨认的角度，从而保证「永恒存在」，因此数千年少有变化，是古埃及美术程式化的标志。"],
    ["古埃及浮雕与壁画", "多用于陵墓与神庙装饰，为死者来世生活服务。手法有①分层分格（横带式）排列②不留空白、以象形文字与图案填满③人物用正面律、身份高者大④色彩固定程式：男子赭红、女子浅黄，法老与神用金色等。代表作品《捕禽图》（内巴蒙墓壁画）、《宴乐图》、《群雁图》（美杜姆墓），形象生动、色彩鲜丽，具很强的装饰性和叙事性。"],
    ["古埃及神庙建筑", "新王国时期的神庙是古埃及建筑的另一代表。典型形制为：塔门（两座斜壁高塔夹门）→ 柱廊庭院 → 列柱大厅（多柱厅）→ 供奉神像的圣所，中轴线对称、空间依次收束，气氛由明到暗、由宽阔到神秘。代表：卡纳克阿蒙神庙（其多柱厅有 134 根巨柱，柱头呈莲花、纸草形状，柱身饰浮雕与彩绘）、卢克索阿蒙神庙、阿布辛贝勒拉美西斯二世石窟庙（摩崖凿建，正面四尊 20 余米高法老坐像）。庙前常立方尖碑。"],
    ["古埃及雕塑", "古王国时期雕塑成就突出，多出土于陵墓：①《拉霍特普夫妇像》，石灰岩彩绘，程式化的坐姿与鲜明的色彩；②《村长像》（卡阿佩尔木雕像），圆木雕成、体态肥胖，神态生动；③《书吏凯伊像》，盘膝而坐、手持纸草卷，双目镶嵌水晶，目光炯炯，是写实肖像的代表；④新王国时期《纳菲尔提提王后像》，石灰岩彩色肖像，线条优雅、面貌清秀，为阿马尔奈风格名作。此外《埃赫那顿像》以夸张的长脸、细颈、凸腹表现改革者的宗教理想。"],
    ["新王国与阿马尔奈风格", "新王国第十八王朝法老埃赫那顿（阿蒙霍特普四世）推行宗教改革，独尊太阳神阿顿、迁都阿马尔奈，美术随之冲破传统程式，出现重自然写实、强调亲情的短暂新风，史称「阿马尔奈风格」或「阿马尔奈美术」。代表作品《埃赫那顿像》《纳菲尔提提王后像》、浮雕《埃赫那顿与家人》（表现法老一家在阳光下嬉戏，亲切自然）。改革失败后程式化传统又恢复。"],
    ["古埃及工艺美术与黄金面具", "古埃及工艺美术以贵金属与宝石加工闻名，服务于宗教与丧葬，讲究材料贵重与永恒保存。最著名的代表作是图坦卡蒙黄金面具（约公元前 1323 年，新王国第十八王朝）：以金板打造，镶嵌宝石与彩色玻璃，覆盖法老面部，额上饰眼镜蛇与秃鹫，象征上下埃及的统治权，是古埃及工艺与来世信仰结合的极致之作。图坦卡蒙墓于公元 1922 年被英国考古学家卡特发现，出土随葬品极为丰富。"]

    ["胡夫金字塔 / 哈夫拉金字塔", "胡夫金字塔最大（原高约 146.5 米），是古代世界七大奇迹中唯一保存至今者；哈夫拉金字塔次之（原高约 143.5 米），其前立有狮身人面像，且顶部尚存原砌面石。"],
    ["正面律 / 自然写实", "正面律是古埃及人物雕刻与绘画按固定程式分角度、分比例表现的法则（头部侧面、眼正面、肩胸正面、腰以下侧面）；自然写实是按真人动态如实描绘。埃及绝大多数作品守正面律，只有阿马尔奈风格时期有短暂的写实新风。"],
    ["《纳菲尔提提王后像》/《图坦卡蒙黄金面具》", "《纳菲尔提提王后像》是新王国第十八王朝埃赫那顿王后的石灰岩彩色肖像（阿马尔奈风格，写实清秀）；《图坦卡蒙黄金面具》是第十八王朝法老图坦卡蒙的黄金随葬面具（工艺美术，镶嵌宝石），一为雕像一为随葬工艺品。"],
    ["金字塔 / 方尖碑", "金字塔是法老陵墓，底方顶尖的巨大石砌建筑；方尖碑是整块石料凿成的细长方柱、顶端呈金字塔形的纪念碑，常立神庙前，多用于宗教祭祀与纪念，二者形状与用途都不同。"],

ART_CONTENT[15] = {
  frame: "外国美术史·第一章 原始古代美术（二）古希腊\n  一、古希腊艺术繁荣的动因\n  二、瓶画\n    1. 几何风格、东方风格\n    2. 黑绘、红绘\n  三、建筑与三大柱式（多立克、爱奥尼亚、科林斯）\n  四、古风时期与古风式微笑\n  五、古典时期\n    1. 米隆《掷铁饼者》\n    2. 菲迪亚斯《命运三女神》\n  六、希腊化时期\n    1. 萨莫色雷斯的胜利女神\n    2. 米洛斯的阿佛洛狄忒\n    3. 《拉奥孔》",
  must: [
    ["古希腊美术繁荣的动因", "①城邦民主政治与自由民制度，公民有参与公共事务与竞技、观剧的自由，艺术为城邦公共生活服务；②发达的航海贸易与殖民地经济提供物质基础；③神话宗教「神人同形同性」，神具有人的形体与情感，为人体美塑造提供依据；④崇尚体育竞技（奥林匹克运动会）与健美人体的社会风尚；⑤哲学与自然科学（毕达哥拉斯、柏拉图、亚里士多德）追求和谐、比例、数量关系，形成「美在和谐」的观念；⑥东西方文化交流（受埃及、两河流域影响）与本土爱琴文明的继承。"],
    ["古希腊美术总体特征", "以人为中心，追求理想化的人体美与和谐的比例秩序：雕刻不满足于写实，而把人体提炼为理想范型；建筑讲求比例、对称与视错觉校正；艺术风格由古风的程式、古典的静穆理想，到希腊化时期的激烈动感与个性化，被誉为西方古典美术的源头。"],
    ["瓶画（几何风格与东方风格）", "古希腊陶器上的绘画是了解早期希腊绘画的主要实物。①几何风格（约公元前 9—前 8 世纪）：器表以平行线、锯齿纹、回纹、三角等几何纹样分区装饰，人物简化为几何形，代表作《狄庇隆陶瓶》；②东方风格（约公元前 7 世纪）：受埃及、两河影响，出现狮、豹、斯芬克斯等动物纹样与花环图案，画面繁密。"],
    ["瓶画（黑绘与红绘）", "①黑绘式（约公元前 6 世纪）：在陶器本色（赭红）底上用黑色釉料涂绘人物形象，再用刻刀划出内部细节，形象呈黑色剪影效果，代表作《阿喀琉斯与埃阿斯掷骰子》（埃克塞基亚斯绘）、《弗朗索瓦瓶》。②红绘式（约公元前 6 世纪末至前 5 世纪）：底子涂黑，人物留出陶土本色（红色），以黑线勾勒内部结构，便于表现透视与体积，代表作《欧罗巴与公牛》《赫拉克勒斯与雅典娜》。③另有白底彩绘，多用于随葬器物。"],
    ["多立克柱式", "古希腊三大柱式之一，形成于古风时期，流行于希腊本土与南意大利。特征：无柱基，柱身直接立于台基上；柱身粗壮、有凹槽（约 20 条），槽与槽相交成尖锐棱角；柱头为简单的圆盘形与方形顶板；整体朴素、厚重、刚健，具男性气质。代表作品：雅典帕特农神庙、奥林匹亚宙斯神庙、波塞冬神庙。"],
    ["爱奥尼亚柱式", "古希腊三大柱式之一，流行于小亚细亚与爱琴海岛屿。特征：有柱基（多层圆环）；柱身较细、凹槽深而密（约 24 条），凹槽之间留平边而不相交成棱；柱头有左右对称的涡卷形装饰；整体轻快、秀雅、修长，具女性气质。代表作品：雅典卫城胜利女神庙、伊瑞克提翁神庙、以弗所阿尔忒弥斯神庙。"],
    ["科林斯柱式", "古希腊三大柱式之一，出现最晚（约公元前 5 世纪），由爱奥尼亚柱式发展而来。柱身细长、柱基与凹槽同爱奥尼亚式，特征是柱头呈倒钟形，四周饰以毛茛叶（莨苕叶）与卷涡，形似盛满花草的花篮，华丽繁复、装饰性最强。代表作品：雅典奥林波斯宙斯神庙、雅典李西克拉特音乐纪念亭。罗马人特别喜爱并大量采用。"],
    ["古风式微笑", "古希腊古风时期（约公元前 6 世纪）雕刻人物面部特有的程式化表情：嘴角两端微微上翘，形成固定的、略带生硬的笑容。它并非表现人物真实情绪，而是雕刻家为使面孔「生动」而采用的统一手法。代表作品《荷犊者》（克里提奥斯少年）、《克罗伊索斯像》、《萨摩斯岛的赫拉像》。到古典时期，这种微笑被自然、真实的表情与静穆的神态取代。"],
    ["米隆《掷铁饼者》", "古希腊古典时期（约公元前 5 世纪）雕刻家米隆的代表作。原作青铜，现存为大理石摹制品。作品表现运动员弯腰屈膝、单臂后摆、即将掷出铁饼的临界瞬间，身体呈弓形扭转，重心集中于一足，把激烈的运动与稳定的平衡完美统一，体现了古典时期「理想的人体比例」与「运动中和谐」的追求，是古希腊雕塑动态表现的典范。"],
    ["菲迪亚斯《命运三女神》", "希腊古典时期最伟大的雕刻家菲迪亚斯（又译菲狄亚斯）的代表作，原为雅典帕特农神庙东山墙（东三角楣）的高浮雕群像之一。表现三位命运女神（摩伊赖）依偎而坐：衣褶如流水般贴体，透过薄衣可感到丰满柔软的人体起伏，姿态闲适优雅，虽头部已残缺，仍被称为古典雕刻的最高典范。菲迪亚斯还主持了帕特农神庙的雕刻工程，并为奥林匹亚宙斯神庙制作黄金象牙的宙斯巨像。"],
    ["萨莫色雷斯的胜利女神", "约公元前 2 世纪初希腊化时期雕刻名作，1836 年发现于爱琴海萨莫色雷斯岛，现藏法国卢浮宫。原为带翅膀的胜利女神（尼刻），立于战船船首的基座上，身体前倾、双翅展开、衣襟被海风吹起紧贴身体，薄衣下的躯体清晰可见，充满飞扬的动态与昂扬的胜利激情；虽头与双臂已失，仍是希腊化时期「表现强烈动态与情感」的代表。"],
    ["米洛斯的阿佛洛狄忒（断臂维纳斯）", "约公元前 2 世纪希腊化时期雕刻名作，1820 年发现于爱琴海米洛斯岛，现藏法国卢浮宫。为爱与美之神阿佛洛狄忒立像，双臂已断。面部呈希腊式静穆端庄，身体呈略作扭转的站立姿态，比例匀称、肌肤丰润，衣裳半褪、衣褶自然垂落，把神性的理想美与女性的感性美统一，是古典理想美最著名的化身。"],
    ["《拉奥孔》", "约公元前 1 世纪希腊化时期雕刻名作，由罗德岛雕刻家阿基桑德罗斯、波利多罗斯、阿典诺多罗斯三人合作，1506 年出土于罗马，现藏梵蒂冈博物馆。取材特洛伊祭司拉奥孔因识破木马计而触怒女神雅典娜，与两个儿子一同被巨蟒缠绞而死的传说。作品以金字塔式构图表现三人挣扎、痉挛的躯体与极度痛苦的面部表情，「高贵的单纯与静穆的伟大」式的悲剧张力，是希腊化时期雕塑的最高代表作，对文艺复兴及后世影响巨大。"],
    ["古希腊与古埃及、古罗马的连接", "古希腊美术上承爱琴文明（克里特岛的克诺索斯王宫、迈锡尼的狮子门与阿伽门农金面具），并受埃及、两河流域影响，但转向以人为中心的理想化表现；下启古罗马，罗马人在建筑技术、柱式与写实肖像上继承并发展希腊成果，形成「希腊艺术被罗马继承」的文化脉络。"]

    ["爱奥尼亚柱式 / 科林斯柱式", "爱奥尼亚柱式柱头是左右对称的涡卷形；科林斯柱式柱头是毛茛叶（莨苕叶）组成的倒钟形花篮状，前者简洁后者华丽繁复，科林斯由爱奥尼亚发展而来。"],
    ["黑绘式瓶画 / 红绘式瓶画", "黑绘式是在赭红陶底上用黑釉画人物、再刻划细节，形象呈黑色剪影；红绘式是把底涂黑、人物留出红色陶土本色并以黑线勾画结构，更便于表现体积与透视。"],
    ["古风式微笑 / 古典时期的自然表情", "古风式微笑是古风时期程式化的、略带生硬的面部笑容（如《荷犊者》），不表现真实情绪；古典时期雕刻以自然真实的表情和静穆神情取代了这种固定程式。"],
    ["《米洛斯的阿佛洛狄忒》/《萨莫色雷斯的胜利女神》", "前者是爱与美之神阿佛洛狄忒的静立裸体像（断臂维纳斯），体现典雅静穆的理想美；后者是带翅膀的胜利女神立于船头的雕像，表现迎风飞动的激昂动态，一静一动。"],

  frame: "外国美术史 第一章 原始古代美术\n  三、古罗马美术\n    1. 古罗马美术特点\n    2. 庞贝壁画\n    3. 古罗马建筑\n    4. 古希腊与古罗马艺术异同",
  must: [
    ["古罗马美术的时代背景", "古罗马发源于意大利半岛台伯河畔，经历了王政时代、共和国时期与帝国时期。公元前二世纪罗马征服希腊本土，把大量希腊艺术品和艺术家带回罗马，所以古罗马美术是在继承古希腊与埃特鲁里亚美术传统之上发展起来的。它服务于奴隶制大国的实际需要，工程建筑、公共设施与肖像雕刻特别发达。"],
    ["古罗马美术总特点", "写实求真、实用功利、宏伟壮丽。与希腊相比，罗马更重实际需要和现实人物的再现，缺少希腊那种理想化的审美追求。代表成就：拱券结构的公共建筑（科洛西姆竞技场、万神殿、凯旋门）、罗马式肖像雕刻（《卡拉卡拉像》）、庞贝壁画。"],
    ["古罗马肖像雕刻", "罗马人为祖先制作蜡像，养成了如实记录容貌的习惯，因此肖像雕刻高度写实。代表作品：《卡拉卡拉像》、《布鲁图斯》、《马可·奥勒留骑马像》（青铜，文艺复兴时期曾长期被误认为是君士坦丁像）。特征：不美化、不加修饰，重在刻画人物的性格、表情与内心世界。"],
    ["《马可·奥勒留骑马像》", "古罗马帝国时期青铜骑马像，现藏罗马卡皮托利尼博物馆。特征：皇帝未佩武器、身着简朴长袍、举手作演说或赐福状，人马比例匀称，是古罗马骑马像中最著名的一件，也是中世纪唯一幸存下来的古代青铜骑马像。"],
    ["庞贝壁画", "庞贝是意大利维苏威火山脚下的一座罗马城市，公元七九年火山爆发被埋没，十八世纪开始发掘，保存了大量罗马壁画。庞贝壁画是古罗马绘画的代表，题材有神话、风景、静物、日常风俗与肖像。特征：善于用明暗与透视表现立体感和空间感。按风格发展分为四种样式：镶嵌式、建筑式、埃及式、复合式。"],
    ["庞贝壁画四种样式", "第一样式镶嵌式（约前二世纪）：用灰泥塑出彩色大理石镶板的错觉效果。第二样式建筑式（约前一世纪）：在墙上画柱廊、窗景和远景，制造建筑空间的错觉幻觉。第三样式埃及式（约一世纪）：以纤细的装饰线条和埃及式纹样为主，墙面趋于平面化。第四样式复合式（一世纪）：综合前面各种手法，构图繁复、装饰华丽。代表作有《秘仪图》、《采花的少女》。"],
    ["古罗马建筑总特点", "① 拱券结构：广泛使用半圆拱、交叉拱和穹顶，使建筑内部空间高大开阔；② 建筑材料：大量使用火山灰混凝土与天然石料；③ 类型丰富：神庙、竞技场、浴场、水道桥、凯旋门、纪功柱、广场；④ 规模宏巨，注重实用功能与公共性。"],
    ["万神殿", "古罗马帝国时期哈德良皇帝所建的圆形神庙。特征：正面是希腊式列柱门廊，主体是直径约四十三米的圆形神殿，穹顶中央开圆洞采光，是古代世界跨度最大的穹顶建筑，也是罗马建筑融汇希腊柱式与罗马穹顶技术的代表作。"],
    ["科洛西姆竞技场（罗马斗兽场）", "古罗马帝国时期建于罗马的椭圆形大竞技场。特征：外观分四层，下面三层分别采用多立克柱式、爱奥尼亚柱式和科林斯柱式，第四层是科林斯壁柱，底层设八十个拱门供观众出入，可容纳数万观众，是罗马拱券结构与希腊柱式相结合的典范。"],
    ["凯旋门与纪功柱", "① 凯旋门：为庆祝战争胜利而建的纪念性建筑，如罗马的提图斯凯旋门、君士坦丁凯旋门，其特征是券洞、浮雕、铭文装饰。② 纪功柱：以连续盘旋的浮雕带叙述战争功绩，如图拉真纪功柱。二者代表了罗马最富特色的纪念性建筑样式。"],
    ["图拉真纪功柱", "古罗马帝国时期为纪念图拉真皇帝征服达契亚而建。柱身用大理石砌成，表面环绕长达约二百米的连续浮雕带，盘旋二十余圈，描绘战争、行军、交战与凯旋场面，刻画人物两千多个，是古代浮雕中叙事性最强的作品之一。"],
    ["古希腊与古罗马艺术相同点", "① 都建立在奴隶制基础之上，都属于欧洲古典艺术；② 都采用神话、宗教、战争等共同题材；③ 都以人为主要表现对象，重视人体比例与写实造型；④ 罗马直接承继了希腊的柱式、雕刻与神话体系，因此常被合称古希腊罗马美术。"],
    ["古希腊与古罗马艺术不同点", "① 民族性格：希腊自由、浪漫、尚美，罗马务实、严谨、尚用；② 审美理想：希腊追求理想化的美和规范，罗马追求写实求真的个性刻画；③ 表现对象：希腊多表现神话中的神与理想化的运动员，罗马多表现现实人物与帝王功业；④ 服务对象：希腊艺术服务于城邦的公民，罗马艺术服务于帝国统治与公共享乐；⑤ 主要成就：希腊长于雕刻与神庙，罗马长于建筑、肖像雕刻与壁画。"],
    ["「光荣属于希腊，伟大属于罗马」", "这是对两个民族艺术成就的概括：希腊的贡献在于理想美的典范与雕塑、建筑柱式；罗马的贡献在于把希腊成果推而广之，在拱券建筑、公共工程、写实肖像与叙事浮雕上达到高度，并把古典艺术传播到整个地中海世界，成为欧洲古典传统的直接来源。"],
    ["古罗马美术的承传与影响", "古罗马美术上承古希腊与埃特鲁里亚美术，下启欧洲中世纪基督教美术（巴西利卡式教堂、穹顶技术）以及文艺复兴与古典主义。罗马的混凝土拱券技术、建筑类型和写实肖像传统是它留给欧洲美术最直接的遗产。"]

    ["早期基督教美术", "公元二至五世纪在罗马及其周边出现。因受迫害，早期基督教徒在罗马城郊挖掘地下墓窟（卡塔康巴），在窟壁上绘制壁画，题材用象征手法：鱼象征基督，善良牧人象征救赎，鸽子象征圣灵。罗马帝国承认基督教后，借用罗马巴西利卡式建筑作为教堂，形成拉丁十字式平面。"],
    ["巴西利卡式", "古罗马一种用作集会、审判与交易的长方形大厅，后为早期基督教教堂采用。特征：平面为纵长长方形，中殿高而宽、两侧为较低窄的侧廊，中殿尽头是半圆形圣坛，入口设在西端，中殿上部开高侧窗采光。它是中世纪教堂最基本的形制，代表作有罗马圣彼得老教堂、圣阿波利纳雷教堂。"],
    ["拜占庭美术", "公元四世纪罗马帝国分裂，东罗马帝国定都君士坦丁堡，形成拜占庭美术，延续到一四五三年帝国灭亡。特征：① 政教合一，皇帝与基督、圣母的形象并置，艺术为神权与皇权服务；② 承继罗马艺术传统并融合东方（叙利亚、波斯）的神秘主义与装饰趣味；③ 成就集中在建筑（圣索菲亚大教堂）和镶嵌画（圣维塔列教堂）上。"],
    ["圣索菲亚大教堂", "拜占庭美术最辉煌的建筑，建于东罗马皇帝查士丁尼时期。特征：采用帆拱技术，把巨大的圆形穹顶架在方形平面上，中央穹顶直径约三十一米，两侧以半穹顶层层承托，形成广阔而流动的内部空间；墙面饰彩色大理石与镶嵌画，穹顶基座开一圈采光窗，使穹顶宛如悬浮空中。"],
    ["拜占庭镶嵌画", "拜占庭美术的代表画种。用彩色玻璃小方块与石子嵌在墙面或穹顶上。特征：① 背景多用金色，象征神圣的天国；② 人物造型平面化、装饰化，姿态端庄、正面直立，目光凝注；③ 排斥真实空间与明暗立体感，强调永恒的宗教气氛。代表作：《查士丁尼皇帝与随从们》、《皇后狄奥多拉与随从们》（意大利拉文纳圣维塔列教堂）。"],
    ["圣像画与圣像破坏运动", "圣像画是拜占庭绘于木板上的宗教图像，多表现基督、圣母与圣徒，造型程式化、金色背景，被视为具有神性。公元八至九世纪拜占庭发生了圣像破坏运动，皇帝下令捣毁圣像，禁止崇拜，后经斗争恢复圣像崇拜，这一运动深刻影响了拜占庭及东欧美术的走向。"],
    ["拜占庭美术的影响", "拜占庭美术随东正教传播到巴尔干半岛、俄罗斯和南意大利。威尼斯圣马可教堂的镶嵌画、俄罗斯的圣像画（如鲁勃廖夫《三圣像》）都直接受其影响。它是欧洲中世纪美术中保存古典传统最多、最富东方色彩的一支。"],
    ["罗马式美术", "十一到十二世纪在西欧兴起。名称是十九世纪学者所定，因这一时期的建筑大量运用类似古罗马的厚墙、拱顶和石造技术而得名。特征：以修道院和朝圣教堂为中心，建筑厚重坚实、粗朴有力，雕刻和绘画依附于建筑，充满宗教威严与禁欲主义气息。"],
    ["罗马式建筑", "特征：① 石墙厚实、体量沉重；② 用筒形拱顶与交叉拱顶取代木架屋顶，因此墙厚柱粗；③ 窗户小而少，室内昏暗，靠厚重墙体和拱顶承重；④ 立面上常设钟塔。代表建筑：法国图卢兹圣塞尔南教堂、德国沃姆斯大教堂、意大利比萨大教堂（含著名的比萨斜塔，属罗马式风格）。"],
    ["朝圣教堂的形制", "为容纳大量朝圣者，罗马式教堂在拉丁十字平面上加宽侧廊，并在圣坛外围增设放射状的小礼拜堂以陈列圣物，使内部空间形成可供人流的环形通道，同时在侧廊上方设楼廊。这一形制是罗马式教堂对中世纪宗教生活的直接回应。"],
    ["罗马式雕刻", "主要装饰在教堂门楣、门框、柱头等处，以《最后的审判》最为常见，用来向不识字的信徒宣讲教义。特征：人物比例失调、形体扭曲、衣纹程式化，充满象征与幻觉色彩，代表作有法国奥顿大教堂的《最后的审判》门楣浮雕、莫瓦萨克修道院回廊柱头雕刻。"],
    ["哥特式美术", "十二世纪中叶起源于法国，十三到十四世纪盛行全欧。名称来自文艺复兴时期的贬称，意为「蛮族哥特人的样式」。特征：以尖拱、肋架券、飞扶壁和彩色玻璃窗构成完整的结构体系，建筑高耸峻峭、内部明亮，雕刻与玻璃窗取代了壁画；美学上强调向上升腾和光的宗教象征，体现中世纪城市与宗教势力的兴盛。"],
    ["哥特式建筑", "特征：① 尖拱取代半圆拱，使压力更趋垂直；② 肋架券使拱顶重量集中到柱墩；③ 飞扶壁在外部承接侧推力，从而把厚墙替换为玻璃窗；④ 彩色玻璃窗以红蓝为主色，四面采光，营造「光的神学」；⑤ 外观有尖塔、小尖饰与玫瑰窗，整体向上升腾。代表建筑：法国圣德尼教堂（最早）、巴黎圣母院、夏特尔大教堂、兰斯大教堂、德国科隆大教堂。"],
    ["哥特式雕刻", "从罗马式的僵硬程式转向优雅与写实，人物开始有个性、姿态自然、面带微笑，衣褶下垂流畅。代表作有法国夏特尔大教堂的《圣母往见》群像、兰斯大教堂的《圣母访问节》和《微笑的天使》，均体现出向人性化、世俗化方向的变化。"],
    ["中世纪美术的主要成就与地位", "① 创造了巴西利卡、罗马式、哥特式三种教堂建筑体系，尖拱、飞扶壁、彩色玻璃与穹顶技术影响深远；② 镶嵌画、圣像画与抄本插图形成了独特的装饰风格；③ 它是连接古典与文艺复兴的桥梁，哥特式建筑技术是近代建筑结构的重要来源。"]
  ],

    ["拜占庭镶嵌画 / 哥特式彩色玻璃窗", "前者用彩色玻璃小方块嵌在墙面，金色背景、平面化，强调永恒神圣；后者是建筑结构的一部分，通过透光讲圣经故事，强调光的神学。"],
    ["罗马式 / 哥特式的名称由来", "两者都是文艺复兴以后学者所定的名称：罗马式因借用古罗马厚墙拱顶技术得名，哥特式则本是「蛮族样式」的贬称，与哥特人并无实际关系。"],

ART_CONTENT[18] = {
  frame: "外国美术史 第三章 文艺复兴时期欧洲美术\n  一、意大利文艺复兴\n    1. 时代背景与总特点\n    2. 佛罗伦萨画派（乔托、马萨乔、波提切利）\n    3. 文艺复兴三杰（达·芬奇、米开朗基罗、拉斐尔）",
  must: [
    ["文艺复兴的时代背景", "文艺复兴是十四至十六世纪西欧从封建社会向资本主义社会过渡时期兴起的思想文化运动。城市工商业发展、新兴资产阶级成长，加之对古希腊罗马文化的重新发现，共同促成这场运动。核心思想是人文主义，主张以人为中心而不是以神为中心，肯定人的价值、尊严与现实生活。"],
    ["意大利文艺复兴的分期", "① 开端（十三世纪末至十四世纪）：乔托；② 早期（十五世纪）：佛罗伦萨画派勃鲁涅列斯奇、多纳太罗、马萨乔、波提切利；③ 盛期（十五世纪末至十六世纪上半叶）：达·芬奇、米开朗基罗、拉斐尔，威尼斯画派；④ 晚期（十六世纪中后期）：样式主义与威尼斯画派的提香。"],
    ["文艺复兴美术的总特征", "① 以人和现实世界为表现中心，宗教题材中注入世俗情感；② 科学地探索造型规律，发明并运用焦点透视法、明暗法、解剖学知识；③ 恢复古希腊罗马的艺术传统，崇尚自然与古典规范；④ 绘画、雕塑脱离建筑成为独立门类，画家的社会地位从工匠上升为艺术家。"],
    ["乔托", "佛罗伦萨画派的创始人，文艺复兴绘画的先驱。代表作：斯克罗维尼礼拜堂（阿雷纳礼拜堂）壁画《哀悼基督》，以及《犹大之吻》、《逃往埃及》。特征：突破拜占庭艺术的平面程式化，人物富有体积感与重量感，表情真实、情感强烈，并用自然景物和简练的构图制造空间深度，被誉为「欧洲绘画之父」。"],
    ["马萨乔", "十五世纪佛罗伦萨画派早期代表，继承乔托并第一次把透视法与解剖学系统用于绘画。代表作：佛罗伦萨勃兰卡奇礼拜堂壁画《纳税钱》、《逐出伊甸园》，以及《圣三位一体》。特征：人物形体坚实概括，明暗对比强烈，画面有真实可信的空间与光线，是文艺复兴绘画走向成熟的关键人物。"],
    ["波提切利", "十五世纪后期佛罗伦萨画派最著名的画家。代表作：《维纳斯的诞生》、《春》，并为但丁《神曲》作插图。特征：以神话与文学题材表现世俗的美，线条柔美流畅、富有节奏感，色彩清丽，人物带有忧郁、诗意的气质，是佛罗伦萨画派由盛期向样式主义过渡的重要画家。"],
    ["达·芬奇", "盛期文艺复兴三杰之首，集画家、科学家、工程师于一身。代表作：《最后的晚餐》、《蒙娜丽莎》、《岩间圣母》。艺术特点：① 主张绘画是自然的镜子，重视观察与科学实验；② 首创薄雾法（晕涂法），让轮廓与色彩柔和过渡；③ 着力表现人物内心活动与性格，构图严谨、气氛庄重而含蓄。"],
    ["《蒙娜丽莎》", "达·芬奇肖像画代表作，现藏法国卢浮宫。特征：描绘一位面带神秘微笑的妇女，双手交叠、姿态自然，背景是空气透视的山水；用薄雾法使面部轮廓柔和过渡，人物心理刻画细腻，是文艺复兴肖像画的典范。"],
    ["《最后的晚餐》", "达·芬奇为米兰圣玛利亚感恩修道院所作的壁画。特征：把十三个人物安排在一张长桌后，以基督为中心、用透视线的汇聚把观者视线引向基督；通过手势与表情刻画十二门徒各不相同的心理反应，构图对称而富有戏剧张力，被誉为构图与心理描写的典范。"],
    ["米开朗基罗", "盛期文艺复兴三杰之一，雕塑家、画家、建筑师、诗人。代表作：雕塑《大卫》、《摩西》、《哀悼基督》；绘画西斯廷礼拜堂天顶画《创世纪》与祭坛画《最后的审判》；建筑圣彼得大教堂穹顶。特点：作品充满英雄主义与巨人的力量，人体健壮有力、肌肉夸张，构图宏大并富有悲剧性激情，体现人文主义的理想。"],
    ["《大卫》与《创世纪》", "① 《大卫》：米开朗基罗为佛罗伦萨创作的大理石雕像，表现大卫迎战歌利亚之前蓄势待发的瞬间，体格健壮、目光坚毅，被视为佛罗伦萨共和国的象征和人文主义英雄气概的体现。② 西斯廷礼拜堂天顶画《创世纪》：取材旧约创世故事，塑造了数百个巨人般的人体形象，气势宏伟、形象有力。"],
    ["拉斐尔", "盛期文艺复兴三杰之一，以画圣母著称。代表作：《雅典学院》、《西斯廷圣母》、《椅中圣母》。特征：构图均衡完整、色彩明净优雅、线条圆润流畅，人物形象秀美、亲切而理想化，把人文主义的理想美与古典的和谐发挥到极致，是盛期文艺复兴审美理想的集中体现。"],
    ["《雅典学院》", "拉斐尔为梵蒂冈签字厅所作的壁画。特征：以古希腊哲学家柏拉图和亚里士多德为中心，把不同时代的学者汇聚于一座宏伟的古典建筑中，运用焦点透视营造深远空间，人物性格鲜明、姿态各异，是文艺复兴人文主义精神的纪念碑式作品。"],
    ["文艺复兴三杰的不同风貌", "达·芬奇博学多能，重科学与心理刻画，画风含蓄深邃，创立薄雾法；米开朗基罗以雕塑思维入画，重人体力量与宏大构图，风格雄强悲壮；拉斐尔重和谐与理想美，构图严谨、形象秀美优雅。三人共同把盛期文艺复兴绘画推上顶点。"],
    ["佛罗伦萨画派的历史地位", "佛罗伦萨画派是意大利文艺复兴绘画的第一个中心，从乔托奠基，经马萨乔把透视与解剖引入绘画，到波提切利完成世俗题材与线条美的探索，再到三杰达到顶峰，构成了文艺复兴绘画发展的主线。它确立了写实造型与科学观察的方法，影响了整个欧洲美术。"]

    ["老彼得·布鲁盖尔", "十六世纪尼德兰最伟大的画家，以农民题材著称，被称为「农民的布鲁盖尔」。代表作：《农民的舞蹈》、《农民的婚礼》、《雪中猎人》、《巴别塔》、《盲人的寓言》。特征：画面充满民间生活气息与幽默感，形象朴素，同时含有对社会现实的讽刺和道德寓意，善于表现宏大的自然景色与人群场面。"],

    ["法国文艺复兴与枫丹白露画派", "十六世纪法国文艺复兴以宫廷为中心。弗朗索瓦一世聘请意大利画家来法，在枫丹白露宫进行装饰，形成枫丹白露画派。特征：把意大利样式主义的优雅精致与法国的宫廷趣味相结合，以壁画、灰泥浮雕和装饰性人物为主，长于神话题材与女性人体的优美表现，代表作有《狄安娜·德·普瓦捷像》，代表人物有罗索、普里马蒂乔。"],

    ["学院派美术与波伦亚学院", "十六世纪后期，卡拉奇兄弟在意大利波伦亚创办了欧洲第一所美术学院（波伦亚学院）。主张：① 绘画要有法则和规范，应把素描作为基础；② 要综合拉斐尔的构图、米开朗基罗的人体、提香的色彩和古希腊罗马的典范；③ 提倡学习古典与大师，追求理想化的美。它奠定了欧洲学院派美术教育体系的基础，对后来法国古典主义影响很大。"],

    ["《召唤圣马太》", "卡拉瓦乔为罗马圣路易吉教堂肯塔雷利礼拜堂所作的油画。特征：画面表现基督召唤税吏马太的瞬间，一束强光从基督一侧射入昏暗的房间，照亮马太与周围人物；人物身着当时平民服装，姿态自然，光线的戏剧性对比把叙事高潮凝于一刻，是卡拉瓦乔主义的代表作品。"],
    ["卡拉瓦乔主义", "指受卡拉瓦乔影响而形成的绘画倾向，十七世纪流传于意大利、西班牙、荷兰、法国等地。特征：忠实模仿自然、不加理想化修饰；使用强烈的明暗对比与聚光效果；把宗教题材平民化、现实化。代表画家有意大利的奥拉齐奥·真蒂莱斯基、西班牙的里贝拉、荷兰的卡拉瓦乔派画家等。"],
    ["巴洛克美术", "十七世纪流行于欧洲的美术风格。名称来源说法不一，一说源于葡萄牙语，意为形状不规则的珍珠，最初含贬义。特征：① 强调激情、运动与戏剧性，造型充满扭动感和张力；② 注重强烈的明暗对比、华丽的光色与复杂的曲线；③ 建筑、雕刻、绘画综合为一体，形成宏大的整体效果；④ 服务于天主教反宗教改革和君主专制，用来宣扬教权与皇权的威严。代表：贝尼尼、鲁本斯、委拉斯贵支。"],
    ["贝尼尼", "十七世纪意大利巴洛克美术最杰出的雕塑家与建筑师。代表作：雕塑《圣特雷莎的狂喜》、《阿波罗与达芙妮》、《大卫》，建筑圣彼得大教堂广场柱廊与青铜华盖。特征：作品充满运动感、激情与戏剧性，善于表现人体柔软细腻的肉体质感和衣褶的飘动，把大理石处理得如同可塑的软材料，是巴洛克雕塑的最高代表。"],
    ["《圣特雷莎的狂喜》", "贝尼尼为罗马圣玛利亚·德拉·维多利亚教堂科尔纳罗礼拜堂所作的雕塑。特征：表现圣特雷莎在神视中因神的爱而感到身心战栗的瞬间，天使举箭欲刺其心；人物悬于云上，衣褶翻滚，背景用金色光线造成舞台般的照明效果，雕塑与建筑、光线合为一体，是巴洛克艺术的典型作品。"],
    ["鲁本斯", "十七世纪佛兰德斯巴洛克绘画的代表。代表作：《劫夺吕西普的女儿》、《玛丽·德·美第奇的一生》组画、《下十字架》。特征：色彩饱满明亮、笔触奔放有力，人物健壮丰满、充满生命力，画面充满运动感与激情，兼具宏伟的装饰性和浓郁的感官魅力，是巴洛克绘画最辉煌的代表。"],
    ["委拉斯贵支", "十七世纪西班牙巴洛克绘画最高代表。代表作：《宫娥》、《纺织女》、《布列达的投降》。特征：造型严谨、色彩优雅，善于用轻松的笔触和丰富的光影表现空气与空间，肖像画能深刻揭示人物性格，把现实主义与巴洛克的华丽结合起来。"],

    ["巴洛克美术与学院派美术的关系", "两者都兴盛于十七世纪，都为教会与宫廷服务，但取向不同：学院派以古典法则和理想化为准则，推崇素描与规范；巴洛克美术强调激情、运动、光影和整体效果，更重感官的感染力。二者既有对立，也在教会的大型装饰工程中互相配合。"]

    ["伦勃朗", "17 世纪荷兰最伟大的现实主义画家，代表作《夜巡》1642《杜普教授的解剖学课》《自画像》系列；特征：独创「明暗法」（黑中透亮的舞台光），用厚涂与透明罩染结合，一生画大量自画像记录心境，晚年贫困仍深刻揭示人物性格与精神世界。"],

    ["《泉》", "安格尔晚年代表作，布面油画；特征：以正面站立的裸体少女与倾倒的水罐构成单纯稳定的构图，线条柔美流畅，形体比例理想化，色彩纯净，是新古典主义理想美的集中体现。"],
    ["浪漫主义美术", "19 世纪初兴起于法国的流派，代表画家籍里柯、德拉克洛瓦，雕塑家吕德；特征：反对新古典主义的理性与法则，强调个性、情感与想象，重视色彩与动态构图，题材取当代事件、异国情调与文学，风格激烈、奔放、富于激情。"],
    ["籍里柯", "法国浪漫主义绘画的先驱，代表作《梅杜萨之筏》1819、《爱普松赛马》；特征：以真实海难事件入画，用金字塔式构图与强烈的明暗对比表现求生与死亡，情感激越，震动当时画坛。"],
    ["《梅杜萨之筏》", "籍里柯 1819 年所作，浪漫主义宣言式作品；特征：构图呈两个对抗的对角线三角形（绝望与希望），人物尸骸与呼救者交错，明暗对比强烈，以当代政治丑闻为题材，标志浪漫主义对新古典主义的胜利。"],
    ["德拉克洛瓦", "法国浪漫主义绘画的最高代表，代表作《自由引导人民》1830、《希奥岛的屠杀》《萨达那帕勒斯之死》；特征：色彩炽烈饱满，笔触奔放，构图充满动荡与激情，善用补色对比，被称为「浪漫主义的狮子」，对印象派色彩有直接影响。"],
    ["《自由引导人民》", "德拉克洛瓦 1830 年所作，纪念七月革命；特征：以象征自由的女性形象居中引导，与工人、市民、儿童并肩前进，金字塔式构图与硝烟中的强光造成强烈动感，是浪漫主义与现实题材结合的典范。"],
    ["现实主义美术", "19 世纪中叶在法国兴起的流派，代表画家库尔贝、杜米埃、米勒，理论主张见库尔贝 1855 年个人画展宣言；特征：反对古典与浪漫的虚构，主张「画你所见」，以平凡劳动者与当代社会生活为题材，风格质朴、客观、有社会批判性。"],
    ["库尔贝", "法国现实主义美术的旗手，代表作《奥尔南的葬礼》《画室》《石工》；特征：以巨大尺幅描绘普通人的葬礼、劳动与日常生活，不做美化，笔触厚重朴实，主张艺术应表现真实与当代。"],
    ["杜米埃", "法国现实主义画家、讽刺漫画家与版画家，代表作《三等车厢》《高康大》《立法肚子》；特征：以夸张变形的漫画手法讽刺资产阶级与政客，油画则色调沉郁，表现城市平民的艰辛。"],

    ["立体主义", "1907 至 1914 年间由毕加索与布拉克在巴黎创立的画派，被视为 20 世纪最重要的现代主义运动之一；特征：否定单一视点与传统的明暗造型，把对象分解为几何切面并同时呈现多个视角，画面平面化、结构理性化。分「分析立体主义」（1907 至 1911，形色碎裂、以灰褐为主）与「综合立体主义」（1912 年后，引入拼贴与字母，色彩明亮）。开山之作是毕加索 1907 年的《亚威农少女》（五个变形裸体，面部借鉴非洲黑人雕刻，人体与背景碎裂为尖锐几何块面）；布拉克代表作《埃斯塔克的房子》，首创在画面上使用字母与纸拼贴。"],
    ["毕加索", "西班牙籍画家、立体主义创始人，代表作《亚威农少女》1907《格尔尼卡》1937《弹曼陀铃的女孩》《镜前的少女》；特征：一生风格多变（蓝色时期、玫瑰色时期、立体主义、新古典主义、超现实主义），造型自由、充满张力，是现代艺术最具影响力的大师。"],
    ["《格尔尼卡》", "毕加索 1937 年所作，控诉德国法西斯轰炸西班牙小镇格尔尼卡；特征：以黑白灰三色、碎裂的立体主义构图表现母亲、死婴、奔马、公牛与残肢等象征形象，画面动荡而有纪念碑式力量，是 20 世纪最著名的反战作品。"],
    ["未来主义", "1909 年由意大利诗人马里内蒂发表宣言、随后扩展到美术的运动，代表画家波丘尼、巴拉、塞韦里尼，雕塑家波丘尼；特征：赞美现代工业、机器、速度与战争，用连续重叠的形象与「力的线条」表现运动的过程与同时性，把立体主义的分解法用于表现动感。巴拉代表作《拴着皮带的狗的动态》，波丘尼代表作《城市的兴起》《空间中连续的唯一形体》。"],
    ["表现主义", "20 世纪初兴起于德国和北欧、强调表现内在情感与精神的艺术倾向，代表社团为 1905 年在德累斯顿成立的桥社与 1911 年在慕尼黑成立的青骑士社，代表画家基尔希纳、诺尔德、康定斯基、马尔克，奥地利画家席勒、科柯施卡；特征：用扭曲变形的形体、强烈的色彩与粗犷笔触表达焦虑、孤独与社会批判，反对印象主义的外在记录。先驱为挪威画家蒙克，代表作《呐喊》1893。"],
    ["达达主义", "1916 年在瑞士苏黎世伏尔泰酒馆由查拉等人发起的反艺术运动，代表艺术家杜尚、阿尔普、皮卡比亚、施维特斯，德国有豪斯曼与照片拼贴；特征：以虚无、嘲弄、偶然与破坏对抗战争的荒谬和资产阶级艺术观，用现成物品、拼贴与胡闹式行动否定传统艺术的定义。杜尚代表作《泉》1917（倒置的小便池）、《带胡须的蒙娜丽莎》、《下楼梯的裸女》。"],
    ["杜尚", "法国籍艺术家、达达主义的核心人物，代表作《泉》1917《带胡须的蒙娜丽莎》《大玻璃（甚至被单身汉剥光了的新娘）》《下楼梯的裸女第二号》；特征：把日常工业品签上名当作品展出，提出「现成品」概念，认为艺术的价值在于观念而非技艺，直接开启观念艺术与后现代主义。"],
    ["超现实主义", "1924 年由法国作家布勒东发表《超现实主义宣言》正式成立的流派，代表画家达利、米罗、马格利特、恩斯特、马松，另有阿尔普；特征：以弗洛伊德精神分析学为理论基础，主张摆脱理性与道德束缚，通过自动书写、梦境记录与逼真描绘表现潜意识、梦幻与偶然，画面奇幻怪诞。达利代表作《记忆的永恒》1931《内战的预感》，米罗代表作《哈里昆的狂欢》。"],
    ["抽象主义", "20 世纪初兴起、完全放弃具体物象而只用形、色、线、面等纯形式要素作画的倾向，代表人物康定斯基、蒙德里安、马列维奇；特征：主张绘画应表现内在精神或纯粹的形式关系，走向非具象与几何化。康定斯基被视为抽象绘画的开创者，1910 年前后开始纯抽象的水彩与油画，著有《论艺术的精神》；蒙德里安创立「冷抽象」，以红黄蓝三原色与黑白灰、直线直角构成均衡画面（《红黄蓝的构成》）。"],
    ["抽象表现主义", "20 世纪 40 至 50 年代在美国兴起的现代主义绘画运动，又称「纽约画派」，代表画家波洛克、德库宁、罗斯科、纽曼、克莱因；特征：尺幅巨大、无主题无中心构图，强调绘画行动本身与纯粹情感的宣泄，分「行动绘画」（波洛克《第 31 号》《薰衣草之雾》，用滴洒与泼溅作画）与「色域绘画」（罗斯科《橙与黄》等大块柔和色面）。它的出现标志西方现代艺术中心由巴黎转到纽约。"],
    ["后现代主义美术的总体特征", "指 20 世纪 60 年代以后、与现代主义相对的艺术与文化倾向；特征：① 反对现代主义的原创性、精英性与进步信念，主张多元、折中与并置；② 大量采用拼贴、挪用、复制、戏仿的手法，打破高雅与通俗的界限；③ 消解作者中心与艺术的唯一性，重视大众文化与消费社会；④ 常带反讽与解构意味，典型代表为波普艺术、观念艺术、照相写实主义与大地艺术。"],
    ["波普艺术", "20 世纪 50 年代兴起于英国、60 年代鼎盛于美国的大众艺术运动，代表艺术家安迪·沃霍尔、利希滕斯坦、劳申伯格、英国汉密尔顿（《是什么使今天的家庭如此不同，如此有魅力？》）；特征：以商业广告、连环画、明星照片、商品与日常消费品为题材，采用丝网印刷、重复排列与平涂手法，取消艺术作品的手工性与唯一性，模糊艺术与生活的界限。沃霍尔代表作《玛丽莲·梦露》系列、《布里洛盒子》。"],
    ["观念艺术", "20 世纪 60 年代中后期兴起的美术倾向，代表艺术家科苏斯、博伊斯、克赖因，理论见科苏斯《哲学之后的艺术》；特征：认为艺术的本质在于观念而非物质形态，作品可以是文字、照片、行为、现成物与语言命题，极度弱化甚至取消传统的造型与技艺，其源头为杜尚的现成品。"],
    ["20 世纪现代雕塑（布朗库西、亨利·摩尔、贾克梅蒂）", "共同倾向：脱离纪念碑式与学院派传统，走向抽象、简化与空间观念的拓展。布朗库西（罗马尼亚）把形体极度简化磨光，追求材质纯净与形态本质，代表作《吻》《沉睡的缪斯》《空间中的鸟》《无穷柱》；亨利·摩尔（英国）以抽象简化的人体（斜倚躯体、母子）为母题，在实体上凿洞使形体与空间互相穿透，代表作《斜倚的人体》系列、《国王与王后》《母与子》；贾克梅蒂（瑞士）用极度拉长、粗糙如被侵蚀的形体表现现代人的孤独与存在的虚无感，代表作《行走的人》《城市广场》《迭戈像》。"],
    ["俄国至上主义", "1915 年由俄国画家马列维奇创立的抽象流派，代表作《白底上的黑方块》1915《白色上的白色》；特征：主张绘画应彻底摆脱物象与实用，以最基本的几何形（方块、圆、十字）和纯色表现「纯粹感觉的至上」，画面非具象、无透视、无体积，是最极端的几何抽象。"],
    ["俄国构成主义", "20 世纪 10 至 20 年代在俄国兴起、与十月革命关系密切的艺术运动，代表艺术家塔特林、罗德琴科、加博，代表作塔特林《第三国际纪念碑》模型；特征：主张艺术应当进入生产与建设，用工业材料（铁、玻璃、木头）与几何结构创作，把艺术变为实用设计与建筑的任务，对包豪斯与现代设计影响深远。"],
    ["大地艺术", "20 世纪 60 年代兴起于美国的美术倾向，代表艺术家史密森、克里斯托与让娜—克劳德、海泽，代表作史密森《螺旋形防波堤》；特征：走出美术馆，在自然与荒野中以土、石、水等大地材料创作巨尺度作品，强调与环境、时间、过程的关系，常无法收藏与展出。"],
    ["照相写实主义", "20 世纪 60 至 70 年代兴起于美国（又称超级写实主义）的美术倾向，代表画家克洛斯、埃斯蒂斯，雕塑家杜安·汉森；特征：以照片为唯一依据，用机械的复制手法把人物、街景与日常物品放大到极度逼真，画面平滑无笔触，取消个人情感与笔法痕迹，反映消费社会与图像复制时代。"],
  ],
  confuse: [
    ["野兽主义 / 立体主义", "野兽主义从色彩入手，用大块纯色与狂放笔触解放色彩，形体仍可辨认（马蒂斯）；立体主义从形体入手，把对象分解为几何切面、同时呈现多视角（毕加索、布拉克）。"],
    ["立体主义 / 未来主义", "立体主义是静态的结构分解；未来主义借用其分解法专门表现速度、运动与同时性，并赞美机器、战争与都市（巴拉、波丘尼）。"],
    ["达达主义 / 超现实主义", "达达以否定、嘲弄与破坏对抗战争与资产阶级艺术，目标是取消艺术；超现实主义以弗洛伊德理论为依据，用自动技法与梦境意象探入潜意识，目标是把潜意识视觉化。"],
    ["抽象主义 / 抽象表现主义", "抽象主义是欧洲 20 世纪初的理论与形式探索，追求纯粹形式与精神性（康定斯基、蒙德里安）；抽象表现主义是美国战后的绘画运动，尺幅巨大、强调行动与情感宣泄，标志纽约取代巴黎。"],
    ["现代主义 / 后现代主义", "现代主义追求原创、前卫、纯粹形式与精英性；后现代主义反对这些主张，用拼贴、挪用、复制与折中，模糊高雅与通俗、取消艺术的唯一性。"],
    ["波普艺术 / 观念艺术", "波普取材于商业与大众图像，仍有具体可见的形象与物质作品；观念艺术则主张观念即艺术，作品可以是文字、行为或现成物，极力弱化物的形态。"],
    ["布朗库西 / 亨利·摩尔", "布朗库西追求单一形体的极致简化与材质磨光，作品紧凑、内向、近乎抽象符号；亨利·摩尔以人体（尤其斜倚躯体与母子）为母题，用实体上凿洞使形体与空间穿透，尺幅巨大、多置户外。"]
  ],
  nums: [
    "毕加索《亚威农少女》1907 年（立体主义开山之作）、《格尔尼卡》1937 年。",
    "杜尚《泉》1917 年（现成品）；《带胡须的蒙娜丽莎》（L.H.O.Q.）。",
    "达利《记忆的永恒》1931 年；超现实主义 1924 年由布勒东发表宣言。",
    "蒙克《呐喊》1893 年；达达主义 1916 年在苏黎世伏尔泰酒馆发起。",
    "德国表现主义社团：1905 年成立桥社（德累斯顿），1911 年成立青骑士社（慕尼黑）。",
    "马蒂斯《舞蹈》1909 至 1910 年；马列维奇《白底上的黑方块》1915 年。",
    "波普艺术 20 世纪 50 年代起于英国、60 年代盛于美国，代表安迪·沃霍尔《玛丽莲·梦露》系列。"
  ]
};
ART_CONTENT[25] = {
  frame: "综合 全科串讲与自测\n  一、中美史时间线（原始 → 明清）\n  二、外美史流派线（古埃及希腊罗马 → 20 世纪）\n  三、中外对照与易混点总清",
  must: [
    ["中国美术史时间线——原始时期", "原始时期美术代表作：仰韶文化彩陶三大类型（半坡类型＝人面鱼纹盆；庙底沟类型＝花瓣纹彩陶盆；马家窑类型＝漩涡纹彩陶瓮）；龙山文化黑陶（蛋壳陶，器壁薄如蛋壳、漆黑光亮）；红山文化碧玉龙；良渚文化玉琮、玉璧等玉器。"],
    ["中国美术史时间线——奴隶制时期（夏商周）", "青铜器代表：兽面纹鼎、后母戊方鼎、四羊方尊、毛公鼎、颂壶、莲鹤方壶；纹饰由饕餮纹（兽面纹）向窃曲纹、蟠螭纹等演变；铸造法有范铸法与失蜡法，装饰工艺有金银错；青铜器是礼器，与礼制密切相关。书法：甲骨文、金文、石鼓文；三星堆遗址青铜立人像。"],
    ["中国美术史时间线——战国秦汉", "帛画：长沙楚墓《人物龙凤帛画》《人物御龙帛画》、马王堆汉墓 T 形帛画；画像石与画像砖；秦始皇陵兵马俑（写实、规模宏大、千人千面）；霍去病墓前石雕（《马踏匈奴》，循石造型、写意浑朴）；长信宫灯；采桑宴乐攻战纹铜壶；马踏飞燕（铜奔马）；击鼓说唱俑、立式说唱俑；瓦当（四神瓦当）。"],
    ["中国美术史时间线——魏晋南北朝", "美术发展新特点：佛教美术兴盛、山水画萌芽、绘画走向自觉、出现专业画家与画论；代表画家顾恺之、陆探微、张僧繇；顾恺之提出「传神写照」「以形写神」「迁想妙得」，代表作《女史箴图》《洛神赋图》；谢赫《古画品录》提出「六法」；宗炳《画山水序》、王微《叙画》论山水画；竹林七贤与荣启期砖画；书法「二王」（王羲之《兰亭序》、王献之）。"],
    ["中国美术史时间线——隋唐", "阎立本（《步辇图》《历代帝王图》）；吴道子（「画圣」，吴带当风，代表作《送子天王图》）；张萱（《虢国夫人游春图》《捣练图》）、周昉（《簪花仕女图》《挥扇仕女图》）的绮罗仕女画；青绿山水展子虔《游春图》、李思训、李昭道；水墨山水王维、张璪（「外师造化，中得心源」）；韩干画马、韩滉《五牛图》；张彦远《历代名画记》；昭陵六骏；唐三彩；初唐四家；颜真卿、柳公权与颠张狂素（张旭、怀素）；石窟艺术。"],
    ["中国美术史时间线——五代两宋", "顾闳中《韩熙载夜宴图》；周文矩；荆浩、关仝、董源、巨然（荆关董巨，南北画派分野）；黄荃（黄家富贵）与徐熙（徐熙野逸）；院体画与翰林图画院；文人画；梁楷（减笔人物《泼墨仙人图》）；李公麟（白描）；张择端《清明上河图》北宋；北宋三大家（李成、范宽、董源）；米氏山水（米芾、米友仁）；南宋四家（李唐、刘松年、马远、夏圭）；宋代花鸟、宋徽宗、宋代书法、宋代陶瓷。"],
    ["中国美术史时间线——元代", "赵孟頫（主张「作画贵有古意」，代表作《鹊华秋色图》《秋郊饮马图》，书法为元代大家）；文人画大兴，元四家＝黄公望（《富春山居图》）、吴镇、倪瓒、王蒙；王冕以墨梅著名；钱选、高克恭、李衎；山西永乐宫壁画（《朝元图》）；元工艺（青花瓷）。"],
    ["中国美术史时间线——明清", "吴门画派（沈周、文徵明、唐寅、仇英）；青藤白阳（徐渭、陈淳的大写意花鸟）；南陈北崔（陈洪绶、崔子忠）；曾鲸与波臣派（肖像画）；董其昌「南北宗论」与松江派；清初四僧（弘仁、髡残、朱耷、石涛）；清初四王（王时敏、王鉴、王翚、王原祁）；扬州画派（金农、郑燮等扬州八怪）；恽寿平（没骨花卉）、龚贤（积墨山水）；郎世宁宫廷绘画；《芥子园画谱》；西泠八家；明清壁画、版画、年画与工艺美术。"],

const INT = [1,3,7,14,30,60];
