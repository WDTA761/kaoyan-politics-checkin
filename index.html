/* 抢救：扫出本机所有本 App 的存储键，挑内容最多的那份 */
function salvage(){
  let best = null, bestN = 0;
  try{
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (!k || k.indexOf('kaoyan2027') !== 0) continue;
      try{
        const o = JSON.parse(localStorage.getItem(k));
        if (!o || typeof o !== 'object') continue;
        const n = Object.keys(o.days||{}).length * 3 + (o.words||[]).length * 2
                + Object.keys(o.life||{}).length * 2 + (o.notes||[]).length
                + Object.keys(o.cards||{}).length + Object.keys(o.art||{}).length * 2;
        if (n > bestN){ bestN = n; best = o; }
      }catch(e){}
    }
  }catch(e){}
  return best;
}
function load(){
  let o = null;
  try{ const raw = localStorage.getItem(LS); if (raw) o = JSON.parse(raw); }catch(e){}
  if (!o) o = fromSnap();                     /* 主数据没了 → 用快照 */
  if (!o) o = salvage();                      /* 快照也没 → 全盘扫一遍抢救 */

function rateCard(key, q){
  const c = S.cards[key] || {lv:0, reps:0, lapses:0};
  const t = todayStr();
  if (q === 0){ c.lv = 0; c.lapses = (c.lapses||0)+1; c.due = addDays(t,1); }
  else if (q === 1){ c.lv = Math.max(0,(c.lv||0)-1); c.due = addDays(t,2); }
  else { c.lv = Math.min(5,(c.lv||0)+1); c.due = addDays(t, INT[c.lv]); }
  c.reps = (c.reps||0)+1; c.last = t;
  S.cards[key] = c;
  bump('cards');
  save();
  return c;
}

function dueCards(){
  const t = todayStr();
  const out = [];
  for (const x of DAYS){
    const c = CONTENT[x.d];
    if (!c || !c.must) continue;
    if (diffDays(S.start, dateOf(x)) > diffDays(S.start, t)) continue;
    c.must.forEach((m,i) => {
      const key = polKey(x.d, i), cd = S.cards[key];
      if (S.skip[key]) return;
      if (cd && cd.due <= t) out.push({key, d:x.d, i, q:m[0], a:m[1], lv:cd.lv, from:'Day '+x.d+' · '+x.sub});
    });
  }
  for (let d = 1; d <= ART_DAYS; d++){
    const c = ART_CONTENT[d];
    if (!c || !c.must) continue;
    if (artOffset() < d - 1) continue;
    c.must.forEach((m,i) => {
      const key = 'a' + d + ':' + i, cd = S.cards[key];
      if (S.skip[key]) return;
      if (cd && cd.due <= t) out.push({key, d, i, q:m[0], a:m[1], lv:cd.lv, from:'美术史 '+d+' · '+artPlanOf(d).sub});
    });
  }
  /* 单词不进这个队列 —— 单词一律在「单词」页做四选一（看英文选中文） */
  out.sort((p,q) => (p.lv - q.lv) || (p.d - q.d));
  return out;
}

  const t = todayStr(), l = lifeOf(t), idx = todaysSmall(t);

      }).join('')

           : '<p class="focus" style="margin:12px 0 0;color:var(--sub);font-size:13px">三件都勾上，今天的'+WORD+'就解锁了</p>')
    + '</div>';

  const moods = ['😄 超好','🙂 不错','😐 一般','😔 低落'];
  h += '<div class="sec-title">今天的心情<span>'+(l.mood ? '已记录' : '点一个')+'</span></div>'
    + '<div class="card"><div class="moods">'
    + moods.map((m,i) => '<button class="mood'+(l.mood === i+1 ? ' on' : '')+'" data-mood="'+(i+1)+'">'+m+'</button>').join('')
    + '</div>'
    + (l.mood ? '<div class="rated" style="margin-top:14px">已记下：'+moods[l.mood-1]+'。谢谢你告诉我。</div>' : '')
    + '</div>';

  // 连续低落 → 多说一句
  let low = 0, cur = t;
  for (let i = 0; i < 7; i++){
    const mm = (S.life[cur] || {}).mood;
    if (mm === 4){ low++; cur = addDays(cur, -1); } else break;
  }
  if (low >= 3){
    h += '<div class="card" style="background:linear-gradient(150deg,#F4F6FD,#E9EEFA);border-color:#D6DFF5">'
      + '<div class="sec-title" style="margin:0 0 8px">多想跟你说一句</div>'
      + '<p style="margin:0;font-size:15.5px;line-height:1.9;font-weight:600;color:var(--ink2)">'
      + '这几天你好像都不太好。<br>不用硬撑，想说什么就跟我说；不说也可以，我在。</p>'
      + '<div class="row-btn"><button class="btn ghost sm" data-newnote="1">写一句给他</button></div></div>';
  }

  h += '<div class="sec-title">最近<span>心情与打卡</span></div>' + moodStrip(7);
  h += '<div class="sec-title">英语单词<span>累计 '+words().length+' 个</span></div>';
  h += wordCardToday();
  return h;
}

function moodStrip(n){
  let h = '<div class="card"><div class="mstrip">';
  for (let i = n-1; i >= 0; i--){
    const d = addDays(todayStr(), -i);
    const m = (S.life[d] || {}).mood || 0;
    const dn = lifeDone(d) ? ' dn' : '';
    h += '<div class="md'+(m ? ' m'+m : '')+dn+'"><b>'+Number(d.slice(8))+'</b>'
      + '<span>周'+'日一二三四五六'[D(d).getUTCDay()]+'</span></div>';
  }
  return h + '</div></div>';
}

/* ---------- 陪伴模式：心情日历 ---------- */
function viewMood(){
  const t = todayStr();
  const y = Number(t.slice(0,4)), mo = Number(t.slice(5,7));
  const daysIn = new Date(Date.UTC(y, mo, 0)).getUTCDate();
  const startDow = (D(y+'-'+pad(mo)+'-01').getUTCDay() + 6) % 7;
  let cells = '', stat = [0,0,0,0], doneN = 0, moodN = 0;
  for (let i = 0; i < startDow; i++) cells += '<div class="calcell ph"></div>';
  for (let d = 1; d <= daysIn; d++){
    const ds = y+'-'+pad(mo)+'-'+pad(d), l = S.life[ds] || {};
    const mood = l.mood || 0;
    if (mood){ stat[mood-1]++; moodN++; }
    const dn = lifeDone(ds); if (dn) doneN++;
    cells += '<div class="calcell'+(mood ? ' m'+mood : '')+(dn ? ' dn' : '')
      + (ds === t ? ' today' : '') + (diffDays(t, ds) > 0 ? ' fut' : '') + '">'
      + '<b>'+d+'</b>'+(dn ? '<i>✓</i>' : '')+'</div>';
  }
  const moods = ['😄 超好','🙂 不错','😐 一般','😔 低落'];

  let h = '<div class="sec-title">'+mo+' 月心情日历<span>'+doneN+' 天打卡 · '+moodN+' 天记了心情</span></div>'
    + '<div class="card"><div class="calhead">'
    + ['一','二','三','四','五','六','日'].map(w => '<span>'+w+'</span>').join('')
    + '</div><div class="calgrid">'+cells+'</div>'
    + '<div class="callegend">'
    + moods.map((m,i) => '<span><i class="sw m'+(i+1)+'"></i>'+m.slice(2)+' '+stat[i]+' 天</span>').join('')
    + '</div></div>';

  const lifeDays = Object.keys(S.life).filter(lifeDone).length;
  h += '<div class="sec-title">总览</div><div class="grid2">'
    + '<div class="stat"><b>'+lifeDays+'</b><span>累计打卡天数</span></div>'
    + '<div class="stat"><b>'+lifeStreak()+'</b><span>连续打卡（天）</span></div>'
    + '<div class="stat"><b>'+moodN+'</b><span>记过心情的天数</span></div>'
    + '<div class="stat"><b>'+notesEarned()+'</b><span>收下的小纸条</span></div>'
    + '</div>';
  if (togetherDays() > 0){
    h += '<div class="card" style="text-align:center;background:linear-gradient(150deg,#FFF7FA,#FDEDF3);border-color:#F8DCE6">'
      + '<div class="love-hero"><div class="big">第 '+togetherDays()+' 天</div>'
      + '<div style="font-size:13px;color:var(--sub);margin-top:6px">从 '+S.together.replace(/-/g,'/')+' 算起</div></div></div>';
  }
  return h;
}

  {n:'② 毛中特', note:'Day 15–21', a:15, b:21},

let OPEN_STAGE = null;   /* null = 还没选过，默认展开「当前」那一段；-1 = 全部收起 */

function planRow(x){
  const done = isDone(x.d), st = S.days[x.d] || {steps:{}};

  return '<button class="prow'+(done?' done':'')+'" data-dayview="'+x.d+'">'

function viewPlan(){
  let seg = '<div class="seg" style="margin:0 0 14px">'
    + '<button data-plantab="pol"'+(PLAN_TAB==='pol'?' class="on"':'')+'>考研政治</button>'
    + '<button data-plantab="art"'+(PLAN_TAB==='art'?' class="on"':'')+'>美术史</button></div>';
  if (PLAN_TAB === 'art') return seg + viewArtPlan();

  const t = todayNo(), total = DAYS.length;
  const curIdx = STAGES.findIndex(s => t >= s.a && t <= s.b);
  if (OPEN_STAGE === null) OPEN_STAGE = curIdx < 0 ? STAGES.length - 1 : curIdx;

  let h = seg + '<div class="todaybox"><div class="n">'
    + (t >= 1 && t <= total ? ('Day ' + t) : (t < 1 ? '预备' : '完成')) + '</div>'
    + '<div class="t"><b>' + (t >= 1 && t <= total ? esc(BY_NO[t].task) : (t < 1 ? '还没开始' : '计划已走完'))
    + '</b><span>全程 ' + doneCount() + ' / ' + total + ' 天 · 距考试 ' + daysLeft() + ' 天</span></div>'
    + (t >= 1 && t <= total ? '<button class="btn rose sm" data-tab="today">去打卡</button>' : '')
    + '</div>'
    + '<div class="pbar" style="margin:12px 6px 0"><i style="width:' + (doneCount()/total*100).toFixed(1) + '%"></i></div>';

  h += '<div class="sec-title">全部计划<span>点阶段展开 / 收起</span></div>';
  STAGES.forEach((s,i) => {
    const list = DAYS.filter(x => x.d >= s.a && x.d <= s.b);
    const d = list.filter(x => isDone(x.d)).length;
    const open = (OPEN_STAGE === i), cur = (i === curIdx);
    h += '<button class="stagehead' + (open ? ' open' : '') + (cur ? ' cur' : '') + '" data-stage="' + i + '">'
      + '<div class="sh-l"><b>' + s.n + (cur ? '<span class="here">当前</span>' : '') + '</b>'
      + '<span>' + s.note + '</span></div>'
      + '<div class="sh-r"><span>' + d + '/' + list.length + '</span><i class="caret">›</i></div></button>'
      + '<div class="pbar" style="margin:8px 6px 10px"><i style="width:' + (d/list.length*100).toFixed(1) + '%"></i></div>';
    if (open) h += '<div class="plist">' + list.map(planRow).join('') + '</div>';
  });
  return h;
}

const words = () => S.words || (S.words = []);
const wordKey = id => 'w:' + id;
function addWord(en, zh, ex){
  const w = {id: 'w' + Date.now() + Math.floor(Math.random()*900 + 100),
             en: en.trim(), zh: zh.trim(), ex: (ex||'').trim(), date: todayStr(), ts: Date.now()};
  words().push(w); save(); return w;
}
function delWord(id){
  S.words = words().filter(w => w.id !== id);
  delete S.cards[wordKey(id)];
  save();
}
const wordCard = w => ({key: wordKey(w.id), wid: w.id, q: w.en,
                        a: w.zh + (w.ex ? '\n' + w.ex : ''), from: '单词 · ' + (w.date||'')});
/* 今日检测队列：不是今天才加的、且还没通过的词（没通过的会一直滚到明天） */
const dailyTestQueue = () => words().filter(w => !w.passed && w.date < todayStr() && !S.skip[wordKey(w.id)]);
/* 长期复习队列：已通过、按 3/7/14/30/60 天到期的词 */
const dueWords = () => { const t = todayStr();
  return words().filter(w => w.passed && !S.skip[wordKey(w.id)])
               .filter(w => { const c = S.cards[wordKey(w.id)]; return c && c.due <= t; }); };
/* 统一出口：会了→毕业进长期复习；模糊/不会→回到每日检测队列（明天和新词一起测） */
function rateWord(id, q){
  const w = words().find(x => x.id === id);
  if (!w) return;
  w.tests = (w.tests||0) + 1;
  w.lastTest = todayStr();
  if (q === 2){
    w.passed = true;
    w.passDate = todayStr();
    rateCard(wordKey(id), 2);
  } else {
    w.fails = (w.fails||0) + 1;
    w.passed = false;
    save();
  }
}
function wordStats(){
  const ws = words(), t = todayStr();
  return {total: ws.length,
          passed: ws.filter(w => w.passed).length,
          todayNew: ws.filter(w => w.date === t).length,
          dueNow: dailyTestQueue().length,
          srsDue: dueWords().length};
}
function wordBars(){
  const N = 14, data = []; let max = 1;
  for (let i = N-1; i >= 0; i--){
    const d = addDays(todayStr(), -i);
    const n = words().filter(w => w.date === d).length;
    if (n > max) max = n;
    data.push({d, n});
  }
  return '<div class="bars">' + data.map(x =>
    '<div class="bar" title="'+x.d+'：'+x.n+' 个"><i style="height:'+Math.round(x.n/max*100)+'%"></i>'
    + '<span>'+Number(x.d.slice(8))+'</span></div>').join('') + '</div>'
    + '<div style="font-size:11.5px;color:var(--sub);margin-top:9px;text-align:center">最近 14 天每天新增的单词</div>';
}

function heatmap(){
  const weeks = 8, cells = [];
  const t = todayStr(), dow = (D(t).getUTCDay() + 6) % 7;
  const start = addDays(t, -(weeks*7 - 1) - (6 - dow));
  for (let i = 0; i < weeks*7; i++){
    const day = addDays(start, i), l = S.log[day];
    let lv = 0;
    if (l){
      const tot = (l.steps||0) + (l.cards||0);
      lv = tot >= 20 ? 4 : tot >= 10 ? 3 : tot >= 5 ? 2 : tot >= 1 ? 1 : 0;
    }
    cells.push('<i data-l="'+lv+'" title="'+day+'"></i>');
  }
  return cells.join('');
}
function quizChart(){
  const N = 14, days = [];
  for (let i = N - 1; i >= 0; i--){
    const d = addDays(todayStr(), -i), e = S.quizLog[d];
    days.push({pct: (e && e.n) ? Math.round(e.good / e.n * 100) : null});
  }
  const pts = [];
  days.forEach((x, i) => { if (x.pct !== null) pts.push([6 + i * 288 / (N - 1), 84 - x.pct / 100 * 72]); });
  if (!pts.length) return '<div style="font-size:13.5px;color:var(--sub);padding:8px 0">做完一次复习或抽测，这里就会出现曲线 🐾</div>';
  return '<svg viewBox="0 0 300 90" style="width:100%;height:96px;display:block">'
    + '<defs><linearGradient id="qg" x1="0" y1="0" x2="1" y2="0">'
    + '<stop offset="0" stop-color="#F4A8BE"/><stop offset="1" stop-color="#C94D72"/></linearGradient></defs>'
    + '<line x1="6" y1="84" x2="294" y2="84" stroke="#F3E3E8" stroke-width="1"/>'
    + '<line x1="6" y1="12" x2="294" y2="12" stroke="#F8EEF1" stroke-width="1" stroke-dasharray="4 4"/>'
    + '<polyline points="' + pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ') + '" fill="none" '
    + 'stroke="url(#qg)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'
    + pts.map(p => '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.4" fill="#fff" stroke="#C94D72" stroke-width="2"/>').join('')
    + '</svg>';

function avgPct(){

function rateRow(key, cd){
  if (cd && cd.reps){
    const left = diffDays(todayStr(), cd.due);
    return '<div class="rated">✓ 记住了' + (left <= 0 ? '，今天再见一次' : '，' + left + ' 天后再见')
      + '（已复习 ' + cd.reps + ' 次）</div>';
  }
  return '<div class="level">'
    + '<button data-rate="0" data-key="'+key+'">不会 😣</button>'
    + '<button data-rate="1" data-key="'+key+'">模糊 🤔</button>'
    + '<button data-rate="2" data-key="'+key+'">会了 😊</button></div>';
}
function buildContentSheet(c, title, task, keyPrefix){
  if (!c){
    return '<h3>'+title+'</h3><p class="hint">这一天的内容还在整理，先按计划里的要点自己过一遍 🐾</p>'
      + '<div class="row-btn"><button class="btn line" data-close="1">关闭</button></div>';
  }
  let h = '<h3>'+title+'</h3><p class="hint">'+esc(task||'')+'　·　先自己想，再点开看答案</p>'
    + '<div class="sec-title" style="margin:4px 4px 8px">框架</div><div class="kframe">'+esc(c.frame)+'</div>';
  if (c.must && c.must.length){
    const keys = c.must.map((m,i) => keyPrefix + i);
    const skipN = keys.filter(isSkipped).length;
    const hasType = keys.some(k => ctypeOf(k));
    const bigN = keys.filter(k => !isSkipped(k) && ctypeOf(k) && ctypeOf(k) !== '选').length;
    const selN = keys.filter(k => !isSkipped(k) && ctypeOf(k) === '选').length;
    h += '<div class="sec-title" style="margin:18px 4px 8px">必背点 · 自测'
       + '<button class="btn ghost sm" id="qaall">全部显示</button></div>'
       + '<div class="filterbar" id="cflt">'
       +   '<button data-cfilter="all" class="on">全部 '+(keys.length - skipN)+'</button>'
       +   (hasType ? '<button data-cfilter="big">会出大题 '+bigN+'</button>'
                    + '<button data-cfilter="sel">只出选择题 '+selN+'</button>' : '')
       +   '<button data-cfilter="skip">已跳过 '+skipN+'</button>'
       + '</div>'
       + '<div class="card qalist" data-f="all" style="padding:2px 15px;margin-bottom:0">'
       + c.must.map((m,i)=>{
           const key = keyPrefix + i, ty = ctypeOf(key), sk = isSkipped(key);
           const tl = ty === '选' ? '选择题' : ty === '大' ? '大题' : ty === '都' ? '都考' : '';
           const tc = ty === '选' ? 'ts' : ty === '大' ? 'tb' : 'td';
           return '<div class="qa" data-qa="'+key+'" data-ty="'+(ty||'')+'" data-sk="'+(sk?1:0)+'">'
             + '<div class="qh"><button class="q"><i>'+(i+1)+'</i>'
             + (tl ? '<span class="typetag '+tc+'">'+tl+'</span>' : '')
             + '<span>'+esc(m[0])+'</span><u>看答案</u></button>'
             + '<button class="skipb'+(sk?' back':'')+'" data-skip="'+key+'">'+(sk?'恢复':'跳过')+'</button></div>'
             + '<div class="a">'+esc(m[1])+rateRow(key, cardOf(key))+'</div></div>';
         }).join('')
       + '</div>'
       + '<p class="focus" style="margin:10px 4px 0;font-size:12.5px;color:var(--sub)">'
       + '「跳过」的考点不再进复习队列和抽测，也不计入掌握率；点「恢复」可以加回来。</p>';
  }
  if (c.confuse && c.confuse.length){
    h += '<div class="sec-title" style="margin:18px 4px 8px">易混对比</div><div class="card" style="padding:2px 15px">'
       + '<ul class="cf">' + c.confuse.map(v => '<li><b>'+esc(v[0])+'</b>'+esc(v[1])+'</li>').join('') + '</ul></div>';
  }
  if (c.nums && c.nums.length){
    h += '<div class="sec-title" style="margin:18px 4px 8px">数字 / 限定词清单</div><div class="card">'
       + '<ul class="nums">' + c.nums.map(v => '<li>'+esc(v)+'</li>').join('') + '</ul></div>';
  }
  h += '<div class="row-btn"><button class="btn line" data-close="1">关闭</button></div>';
  return h;
}

function refreshFilterCounts(){
  const rows = Array.prototype.slice.call(document.querySelectorAll('.qalist .qa'));
  if (!rows.length) return;
  const sk = rows.filter(r => r.dataset.sk === '1').length;
  const sel = rows.filter(r => r.dataset.sk !== '1' && r.dataset.ty === '选').length;
  const big = rows.filter(r => r.dataset.sk !== '1' && r.dataset.ty && r.dataset.ty !== '选').length;
  const set = (f, txt) => { const b = document.querySelector('[data-cfilter="'+f+'"]'); if (b) b.textContent = txt; };
  set('all', '全部 ' + (rows.length - sk));
  set('big', '会出大题 ' + big);
  set('sel', '只出选择题 ' + sel);
  set('skip', '已跳过 ' + sk);
}
function bindContentSheet(){
  document.querySelectorAll('.qa .q').forEach(q => q.onclick = () => {
    const box = q.closest('.qa') || q.parentElement; box.classList.toggle('open');
    q.querySelector('u').textContent = box.classList.contains('open') ? '收起' : '看答案';
  });
  const all = document.getElementById('qaall');
  if (all) all.onclick = () => {
    const items = document.querySelectorAll('.qa');
    const anyClosed = Array.prototype.some.call(items, el => !el.classList.contains('open'));
    items.forEach(el => {
      el.classList.toggle('open', anyClosed);
      const u = el.querySelector('u'); if (u) u.textContent = anyClosed ? '收起' : '看答案';
    });
    all.textContent = anyClosed ? '全部收起' : '全部显示';
  };
  document.querySelectorAll('[data-cfilter]').forEach(b => b.onclick = () => {
    document.querySelectorAll('[data-cfilter]').forEach(o => o.classList.toggle('on', o === b));
    const list = document.querySelector('.qalist');
    if (list) list.dataset.f = b.dataset.cfilter;
  });
  document.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => {
    const key = b.dataset.skip;
    toggleSkip(key);
    const sk = isSkipped(key);
    const row = document.querySelector('.qa[data-qa="'+key+'"]');
    if (row){ row.dataset.sk = sk ? 1 : 0; if (sk) row.classList.remove('open'); }
    b.textContent = sk ? '恢复' : '跳过';
    b.classList.toggle('back', sk);
    refreshFilterCounts();
  });
  document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => {
    const cd = rateCard(b.dataset.key, +b.dataset.rate);
    const left = diffDays(todayStr(), cd.due);
    b.parentElement.outerHTML = '<div class="rated">✓ 已记录' + (left <= 0 ? '，今天再见一次' : '，' + left + ' 天后再见')
      + '（复习 ' + cd.reps + ' 次）</div>';
  });
}

/* ===== 单词测试：一律「看英文选中文」四选一 ===== */
let WQ = [], WI = 0, WSTAT = {ok:0, bad:0}, WMODE = 'test';

function shuffleArr(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function buildWordQuestions(list, mode){
  const pool = words().filter(w => !S.skip[wordKey(w.id)] && w.zh);
  return list.map(w => {
    const cands = shuffleArr(Array.from(new Set(pool.map(x => x.zh).filter(z => z !== w.zh))));
    const opts = shuffleArr(cands.slice(0, 3).concat([w.zh]));
    return {id: w.id, en: w.en, zh: w.zh, ex: w.ex, opts, mode};
  });
}
function startWordTest(){
  const q = dailyTestQueue();
  if (!q.length){
    alert(words().filter(w => w.date === todayStr()).length
      ? '今天新加的单词，明天开始检测 🐾'
      : '现在没有要检测的单词，先去加几个吧 🐾');
    return;
  }
  WMODE = 'test';
  WQ = buildWordQuestions(shuffleArr(q.slice()), 'test');
  WI = 0; WSTAT = {ok:0, bad:0};
  renderWordQuiz();
}
function startWordQuiz(){
  const pool = words().filter(w => !S.skip[wordKey(w.id)]);
  if (pool.length < 2){ alert('先加几个单词再来抽测 🐾'); return; }
  if (pool.length < 4) alert('单词还不多，选项凑不满 4 个，先这样测 🐾');
  WMODE = 'quiz';
  WQ = buildWordQuestions(shuffleArr(pool.slice()).slice(0, Math.min(10, pool.length)), 'quiz');
  WI = 0; WSTAT = {ok:0, bad:0};
  renderWordQuiz();
}
function startWordReview(){
  const ws = dueWords();
  if (!ws.length){ alert('现在没有需要长期复习的单词 🐾'); return; }
  WMODE = 'srs';
  WQ = buildWordQuestions(shuffleArr(ws.slice()), 'srs');
  WI = 0; WSTAT = {ok:0, bad:0};
  renderWordQuiz();
}
function renderWordQuiz(){
  let m = document.getElementById('reviewbox');
  if (!m){ m = document.createElement('div'); m.id = 'reviewbox'; document.body.appendChild(m); }
  const close = () => { m.innerHTML = ''; render(); };

  if (WI >= WQ.length){
    const ok = WSTAT.ok, bad = WSTAT.bad, pct = Math.round(ok / WQ.length * 100);
    logQuiz(WQ.length, ok);
    const line = WMODE === 'test'
      ? (bad === 0 ? '全过了，斐斐你今天超厉害。' : '没过的 ' + bad + ' 个，明天会和新词一起再测，别急。')
      : (bad === 0 ? '全对了，稳。' : '错的还会再碰到，别急。');
    m.innerHTML = '<div class="review"><div class="rv-done">'
      + '<div class="emo">'+(bad === 0 ? '🎉' : pct >= 60 ? '🌿' : '💪')+'</div>'
      + '<h2>'+(WMODE === 'test' ? '检测完成' : WMODE === 'quiz' ? '抽测结束' : '复习完成')+'</h2>'
      + '<div class="scorebig">'+pct+'%</div>'
      + '<p>一共 ' + WQ.length + ' 个：对了 ' + ok + ' · 错了 ' + bad + '<br>' + line + '</p>'
      + '<button class="btn rose big" id="wqend">回到今天</button></div></div>';
    document.getElementById('wqend').onclick = close;
    return;
  }

  const c = WQ[WI];
  const label = c.mode === 'test' ? '📝 今日检测' : c.mode === 'quiz' ? '🎲 随机抽测' : '🔁 长期复习';
  m.innerHTML = '<div class="review">'
    + '<div class="rv-top"><button class="close" id="wqclose">✕</button>'
    + '<div class="rv-prog"><i style="width:'+(WI/WQ.length*100).toFixed(1)+'%"></i></div>'
    + '<div class="rv-num">'+(WI+1)+'/'+WQ.length+'</div></div>'
    + '<div class="rvmode">'+label+' · 看英文选中文</div>'
    + '<div class="rv-card">'
    + '<div class="wq-en">'+esc(c.en)+'</div>'
    + '<div class="wopts">'
    + c.opts.map((o,i) => '<button class="wopt" data-opt="'+i+'">'+esc(o)+'</button>').join('')
    + '</div><div id="wfb"></div></div></div>';
  document.getElementById('wqclose').onclick = close;

  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    const picked = c.opts[+b.dataset.opt];
    const ok = (picked === c.zh);
    rateWord(c.id, ok ? 2 : 0);
    WSTAT[ok ? 'ok' : 'bad']++;
    document.querySelectorAll('[data-opt]').forEach(x => {
      const v = c.opts[+x.dataset.opt];
      x.disabled = true;
      if (v === c.zh) x.classList.add('ok');
      else if (x === b) x.classList.add('no');
    });
    document.getElementById('wfb').innerHTML =
      '<div class="wfb ' + (ok ? 'ok' : 'no') + '">'
      + (ok ? '✓ 对了' : '✗ 错了，正确答案是：' + esc(c.zh))
      + (c.ex ? '<span class="wfbex">' + esc(c.ex) + '</span>' : '')
      + '</div>'
      + '<button class="btn rose big" id="wnext" style="width:100%;margin-top:14px">'
      + (WI + 1 >= WQ.length ? '看结果' : '下一题') + '</button>';
    document.getElementById('wnext').onclick = () => { WI++; renderWordQuiz(); };
  });
}
function renderReview(){
  let m = document.getElementById('reviewbox');
  if (!m){ m = document.createElement('div'); m.id = 'reviewbox'; document.body.appendChild(m); }
  if (RI >= RQ.length){
    const g = RSTAT[2], mid = RSTAT[1], bad = RSTAT[0];
    const pct = Math.round(g / RQ.length * 100);
    logQuiz(RQ.length, g);
    const isTest = QUIZ === 'test';
    let line;
    if (isTest){
      line = (g === RQ.length) ? '全过了，斐斐你今天超厉害。'
           : '没过的 ' + (RQ.length - g) + ' 个，明天会和新词一起再测，别急。';
    } else {
      line = (g === RQ.length) ? '全记住了，斐斐你今天超厉害。'
           : bad === 0 ? '没有完全不会的，稳住这个状态。'
           : '不会的明天还会来找你，别急。';
    }
    m.innerHTML = '<div class="review"><div class="rv-done">'
      + '<div class="emo">'+(g === RQ.length ? '🎉' : pct >= 60 ? '🌿' : '💪')+'</div>'
      + '<h2>'+(isTest ? '检测完成' : QUIZ ? '抽测结束' : '复习完成')+'</h2>'
      + '<div class="scorebig">'+pct+'%</div>'
      + '<p>'+(isTest ? '这次测了 ' : QUIZ ? '这次抽了 ' : '这次过了 ')
      + RQ.length + ' 个：过了 ' + g + ' · 模糊 ' + mid + ' · 不会 ' + bad + '<br>' + line + '</p>'
      + '<button class="btn rose big" id="rvend">回到今天</button></div></div>';
    document.getElementById('rvend').onclick = () => { QUIZ = false; m.innerHTML = ''; render(); };
    return;
  }
  const c = RQ[RI];
  m.innerHTML = '<div class="review">'
    + '<div class="rv-top"><button class="close" id="rvclose">✕</button>'
    + '<div class="rv-prog"><i style="width:'+(RI/RQ.length*100).toFixed(1)+'%"></i></div>'
    + '<div class="rv-num">'+(RI+1)+'/'+RQ.length+'</div></div>'
    + (QUIZ === 'test' ? '<div class="rvmode">📝 今日检测'+(c.from ? ' · '+esc(c.from) : '')+'</div>'
       : QUIZ === 'word' ? '<div class="rvmode">🎲 随机抽测</div>'
       : QUIZ === 'srs' ? '<div class="rvmode">🔁 长期复习</div>' : '')
    + '<div class="rv-card"><div class="rv-from">'+(c.from||'')+' · 已复习 '+(c.lv||0)+' 级</div>'
    + '<div class="rv-q">'+esc(c.q)+'</div><div id="rva"></div></div>'
    + '<div style="margin-top:16px"><button class="btn line big" id="rvshow" style="width:100%">先想一下，再看答案</button></div></div>';
  document.getElementById('rvclose').onclick = () => { QUIZ = false; m.innerHTML = ''; render(); };
  document.getElementById('rvshow').onclick = () => {
    document.getElementById('rva').innerHTML = '<div class="rv-a">'+esc(c.a)+'</div>'
      + '<div class="level" style="margin-top:14px">'
      + '<button data-rq="0">不会 😣</button><button data-rq="1">模糊 🤔</button><button data-rq="2">会了 😊</button></div>';
    document.getElementById('rvshow').outerHTML = '<div style="font-size:12.5px;color:var(--sub);text-align:center;margin-top:12px">按真实感觉点，别客气</div>';
    document.querySelectorAll('[data-rq]').forEach(b => b.onclick = () => {
      const q = +b.dataset.rq;
      if (c.wid) rateWord(c.wid, q); else rateCard(c.key, q);
      RSTAT[q]++; RI++; renderReview();

                                   : (md(dateStr || addDays(lifeFrom(), n - LOVE.length - 1)) + ' · 完成 ✓');

  for (let i = 0; i < 30; i++){
    const size = (14 + Math.random()*20).toFixed(0);
    const dur = (3.4 + Math.random()*2.8).toFixed(2);
    const delay = (Math.random()*1.8).toFixed(2);
    const sway = ((Math.random()*2-1) * 16).toFixed(1);
    const rot = ((Math.random()*2-1) * 320).toFixed(0);
    const op = (0.65 + Math.random()*0.35).toFixed(2);
    parts += '<span class="p" style="left:'+(Math.random()*100).toFixed(1)+'%;font-size:'+size+'px;'
      + '--dur:'+dur+'s;--delay:'+delay+'s;--sway:'+sway+'vw;--rot:'+rot+'deg;--op:'+op+'">'
      + glyphs[i % glyphs.length]+'</span>';
  }
  fx.innerHTML = '<div class="particles">'+parts+'</div><div class="halo"></div><div class="ring"></div>'
    + '<div class="stage"><div class="cel">'
    + '<span class="spark s1">✨</span><span class="spark s2">✨</span>'
    + '<span class="spark s3">🎀</span><span class="spark s4">💗</span>'
    + '<div class="cat">'+CAT+'</div>'
    + '<div class="daytag">'+label+'</div>'
    + '<p class="msg">'+esc(noteByNo(n))+'</p>'
    + '<div class="collect">已收下 '+notesEarned()+' / '+TOTAL_NOTES+' 张'+WORD+'</div>'
    + '<button class="btn rose big" id="celclose">收下 ♡</button>'
    + '</div></div>';
  document.getElementById('celclose').onclick = () => { fx.innerHTML = ''; };
  setTimeout(() => { const ps = fx.querySelector('.particles'); if (ps) ps.remove(); }, 8000);
}

/* =====================================================================
   弹层 / 交互
   ===================================================================== */
function showSheet(inner, after){
  const m = document.getElementById('modal');
  m.innerHTML = '<div class="mask" id="mask"><div class="sheet">'+inner+'</div></div>';
  document.getElementById('mask').onclick = e => { if (e.target.id === 'mask') closeSheet(); };
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { closeSheet(); render(); });
  if (after) after();
}
function closeSheet(){ document.getElementById('modal').innerHTML = ''; }
function openDay(n){ showSheet(dayCard(BY_NO[n], true), bind); }

function openNote(dayNo){
  const d = dayNo || (todayNo() >= 1 && todayNo() <= DAYS.length ? todayNo() : 1);
  const tags = isLife() ? ['日常','心情','想说的','灵感'] : ['错题','易混','难点','灵感'];
  const html = '<h3>记一笔</h3><p class="hint">'+(isLife()?'今天想说什么都可以，一句话就够。':'错题、易混点、背不下来的地方 —— 一句话就够。')+'</p>'
    + '<div class="seg" id="tagseg">'
    + tags.map((t,i)=>'<button data-tag="'+t+'"'+(i===0?' class="on"':'')+'>'+t+'</button>').join('')
    + '</div>'
    + '<textarea id="notetx" placeholder="'+(isLife()?'例：今天终于睡到自然醒，很爽':'例：马原·劳动二重性 ≠ 商品二因素，别记反')+'"></textarea>'
    + '<div class="row-btn"><button class="btn line" data-close="1">取消</button>'
    + '<button class="btn rose" id="savenote">保存</button></div>';
  showSheet(html, () => {
    let tag = tags[0];
    document.querySelectorAll('#tagseg button').forEach(b => b.onclick = () => {
      tag = b.dataset.tag;
      document.querySelectorAll('#tagseg button').forEach(o => o.classList.toggle('on', o === b));
    });
    document.getElementById('savenote').onclick = () => {
      const tx = document.getElementById('notetx').value.trim();
      if (!tx){ alert('先写点内容吧'); return; }
      S.notes.push({id: Date.now()+''+Math.floor(Math.random()*999), day:d, text:tx, tag, date:todayStr(), ts:Date.now()});
      save(); closeSheet(); render();
    };
  });
}

function bind(){
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    const n = +b.dataset.day, k = b.dataset.step, st = dstate(n);
    const was = isDone(n);
    st.steps[k] = !st.steps[k];
    if (isDone(n)) st.doneDate = todayStr(); else delete st.doneDate;
    if (st.steps[k]) bump('steps');
    else if (S.log[todayStr()]) S.log[todayStr()].steps = Math.max(0, (S.log[todayStr()].steps||0)-1);
    save(); render();
    if (!was && isDone(n)) setTimeout(() => celebrate(n), 240);
  });
  document.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { toggleReviewed(+b.dataset.rev); render(); });
  document.querySelectorAll('[data-dayview]').forEach(b => b.onclick = () => openDay(+b.dataset.dayview));
  document.querySelectorAll('[data-content]').forEach(b => b.onclick = () => openContent(+b.dataset.content));
  document.querySelectorAll('[data-relove]').forEach(b => b.onclick = () => celebrate(+b.dataset.relove, b.dataset.rdate || ''));
  const rv = document.querySelector('[data-review]'); if (rv) rv.onclick = startReview;
  document.querySelectorAll('[data-stage]').forEach(b => b.onclick = () => {
    const i = +b.dataset.stage;
    OPEN_STAGE = (OPEN_STAGE === i) ? -1 : i;
    render();
  });

  /* ---- 陪伴模式 ---- */
  document.querySelectorAll('[data-task]').forEach(b => b.onclick = () => {
    const t = todayStr(), si = +b.dataset.task, l = lifeOf(t);
    const was = lifeDone(t);
    const i = l.t.indexOf(si);
    if (i >= 0) l.t.splice(i,1); else { l.t.push(si); bump('steps'); }
    save(); render();
    if (!was && lifeDone(t)) setTimeout(() => celebrate(lifeSerial(t), t), 240);
  });
  document.querySelectorAll('[data-mood]').forEach(b => b.onclick = () => {
    lifeOf(todayStr()).mood = +b.dataset.mood;
    save(); render();
  });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    S.mode = b.dataset.mode; TAB = 'today'; save(); render();
  });
  const tgs = document.getElementById('tgsave');
  if (tgs) tgs.onclick = () => {
    const el = document.getElementById('tgdate');
    S.together = el ? el.value : ''; save(); render();
  };
  const exs = document.getElementById('examsave');
  if (exs) exs.onclick = () => {
    const el = document.getElementById('examdate');
    if (el && el.value){ S.exam = el.value; save(); render(); }
  };
  const ars = document.getElementById('artsave');
  if (ars) ars.onclick = () => {
    const el = document.getElementById('artdate');
    if (el && el.value){ S.artStart = el.value; save(); render(); }
  };

  /* ---- 美术史 ---- */
  document.querySelectorAll('[data-artcontent]').forEach(b => b.onclick = () => openArtContent(+b.dataset.artcontent));
  document.querySelectorAll('[data-artdone]').forEach(b => b.onclick = () => {
    artSet(todayStr(), !artDone(todayStr()));
    render();
  });
  document.querySelectorAll('[data-artday]').forEach(b => b.onclick = () => openArtContent(+b.dataset.artday));
  const asb = document.querySelector('[data-artstart]');
  if (asb) asb.onclick = () => { S.artStart = todayStr(); save(); render(); };
  document.querySelectorAll('[data-plantab]').forEach(b => b.onclick = () => { PLAN_TAB = b.dataset.plantab; render(); });
  const qz = document.querySelector('[data-quiz]'); if (qz) qz.onclick = startQuiz;
  const cl = document.querySelector('[data-closing]'); if (cl) cl.onclick = openClosing;
  const aw = document.querySelector('[data-addword]'); if (aw) aw.onclick = openAddWord;
  const wr = document.querySelector('[data-wordreview]'); if (wr) wr.onclick = startWordReview;
  const wt = document.querySelector('[data-wordtest]'); if (wt) wt.onclick = startWordTest;
  const wq = document.querySelector('[data-wordquiz]'); if (wq) wq.onclick = startWordQuiz;
  document.querySelectorAll('[data-delword]').forEach(b => b.onclick = () => {
    if (confirm('删掉这个单词？')){ delWord(b.dataset.delword); render(); }
  });
  const us = document.querySelector('[data-unskip]');
  if (us) us.onclick = () => { if (confirm('把所有跳过的考点都恢复？')){ S.skip = {}; save(); render(); } };
  document.querySelectorAll('[data-note]').forEach(b => b.onclick = () => openNote(+b.dataset.note));
  const nn = document.querySelector('[data-newnote]'); if (nn) nn.onclick = () => openNote(null);
  document.querySelectorAll('[data-delnote]').forEach(b => b.onclick = () => {
    if (confirm('删除这条记录？')){ S.notes = S.notes.filter(x => String(x.id) !== String(b.dataset.delnote)); save(); render(); }
  });
  document.querySelectorAll('[data-restart]').forEach(b => b.onclick = () => {
    if (confirm('把计划开始日设为 ' + b.dataset.restart.replace(/-/g,'/') + '？\n（只改「今天是第几天」，已打的卡不会丢）')){
      S.start = b.dataset.restart; save(); render();
    }
  });
  const nk = document.querySelector('[data-nick]'); if (nk) nk.onclick = () => {
    const v = prompt('想怎么称呼她？', S.nick || NICK_DEFAULT);
    if (v && v.trim()){ S.nick = v.trim().slice(0,10); save(); render(); }
  };
  const ex = document.querySelector('[data-export]'); if (ex) ex.onclick = exportData;
  const im = document.querySelector('[data-import]'); if (im) im.onclick = importData;
  const rp = document.querySelector('[data-report]'); if (rp) rp.onclick = copyReport;
  const rs = document.querySelector('[data-reset]'); if (rs) rs.onclick = () => {
    if (confirm('清空全部打卡、单词、卡片和记录？不可恢复。') && confirm('真的确定？建议先导出备份。')){
      S = blank();
      try{ for (let i = 0; i < 40; i++) localStorage.removeItem(snapKey(addDays(todayStr(), -i))); }catch(e){}
      save(); render();
    }
  };
  const rsnap = document.querySelector('[data-restoresnap]');
  if (rsnap) rsnap.onclick = () => {
    const list = snapList();
    if (!list.length){ alert('本机还没有快照 🐾'); return; }
    const menu = list.map((x,i) => (i+1) + '. ' + x.d + '（' + x.kb + ' KB）').join('\n');
    const pick = prompt('从哪一天的快照恢复？输入序号：\n' + menu, '1');
    const idx = parseInt(pick, 10) - 1;
    if (!(idx >= 0 && idx < list.length)) return;
    const raw = localStorage.getItem(snapKey(list[idx].d));
    if (!raw){ alert('这份快照读不出来'); return; }
    if (!confirm('会用 ' + list[idx].d + ' 的快照覆盖当前数据，继续？')) return;
    S = Object.assign(blank(), JSON.parse(raw));
    save(); render(); alert('已恢复到 ' + list[idx].d);
  };
  const sv = document.querySelector('[data-salvage]');
  if (sv) sv.onclick = () => {
    const o = salvage();
    if (!o){ alert('本机没有找到可抢救的旧数据 🐾'); return; }
    const n = Object.keys(o.days||{}).length + (o.words||[]).length + Object.keys(o.life||{}).length;
    if (!confirm('找到一份旧数据（打卡/单词/心情共 ' + n + ' 条痕迹），用它覆盖当前数据？')) return;
    S = Object.assign(blank(), o); save(); render(); alert('已抢救回来');
  };
}
function switchTab(t){
  TAB = t;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render();
}
function download(name, text, type){
  const blob = new Blob([text], {type: type || 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportData(){
  S.lastExport = todayStr(); save();
  download('一点点备份_' + todayStr().replace(/-/g,'') + '.json', JSON.stringify(S, null, 1));
}
function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if (!o || !o.days) throw new Error('文件格式不对');
        if (!confirm('导入会覆盖当前记录。继续？')) return;
        S = Object.assign(blank(), o); save(); render();
        alert('导入成功：已完成 ' + doneCount() + ' 天');
      }catch(e){ alert('导入失败：' + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function copyReport(){
  const t = todayStr(), dow = (new Date().getDay()+6)%7, mon = addDays(t,-dow);
  const life = isLife();
  let wd = 0;
  for (let i=0;i<7;i++){
    const ds = addDays(mon,i);
    if (life){ if (lifeDone(ds)) wd++; }
    else { const n = diffDays(S.start, ds)+1; if (n>=1 && n<=DAYS.length && isDone(n)) wd++; }
  }
  const txt = '【一点点'+(life?'·陪伴打卡':'')+'周报】'+md(mon)+'–'+md(t)+'\n'
    + '本周打卡：'+wd+' 天（完成率 '+(wd/7*100).toFixed(0)+'%）\n'
    + (life
        ? '累计打卡：'+Object.keys(S.life).filter(lifeDone).length+' 天，连续 '+lifeStreak()+' 天\n'
          + '收下'+WORD+'：'+notesEarned()+' / '+TOTAL_NOTES+' 张'
        : '累计完成：'+doneCount()+'/'+DAYS.length+' 天，连续 '+streak()+' 天\n'
          + '已掌握知识点：'+masteredCount()+' 条　'+WORD+'：'+notesEarned()+' / '+TOTAL_NOTES+' 张\n'
          + '今天要背：'+(BY_NO[todayNo()] ? 'Day '+todayNo()+' '+BY_NO[todayNo()].task : '冲刺阶段'));
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(
    ()=>alert('周报已复制，可以粘贴给他 🐾'), ()=>prompt('复制下面这段：', txt));
  else prompt('复制下面这段：', txt);
}

/* 启动 */
document.getElementById('hCat').innerHTML = CAT;
document.getElementById('navLove').textContent = WORD;
document.querySelectorAll('nav button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
render();
save();          /* 首次打开也立刻写一份本机快照 */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
