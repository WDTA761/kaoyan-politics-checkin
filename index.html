function rateCard(key, q){
  const c = S.cards[key] || {lv:0, reps:0, lapses:0};
  const t = todayStr();
  if (q === 0){ c.lv = 0; c.lapses = (c.lapses||0)+1; c.due = addDays(t,1); }
  else if (q === 1){ c.lv = Math.max(0,(c.lv||0)-1); c.due = addDays(t,2); }
  else { c.lv = Math.min(5,(c.lv||0)+1); c.due = addDays(t, INT[c.lv]); }
  c.reps = (c.reps||0)+1; c.last = t;
  S.cards[key] = c;
  bump('cards');
  save();
  return c;
}
function bump(kind){
  const t = todayStr();
  if (!S.log[t]) S.log[t] = {steps:0, cards:0};
  S.log[t][kind] = (S.log[t][kind]||0) + 1;
}
function dueCards(){
  const t = todayStr();
  const out = [];
  for (const x of DAYS){
    const c = CONTENT[x.d];
    if (!c || !c.must) continue;
    if (diffDays(S.start, dateOf(x)) > diffDays(S.start, t)) continue;
    c.must.forEach((m,i) => {
      const key = x.d + ':' + i, cd = S.cards[key];
      if (cd && cd.due <= t) out.push({key, d:x.d, i, q:m[0], a:m[1], lv:cd.lv, from:'Day '+x.d+' · '+x.sub});
    });
  }
  for (let d = 1; d <= ART_DAYS; d++){
    const c = ART_CONTENT[d];
    if (!c || !c.must) continue;
    if (artOffset() < d - 1) continue;
    c.must.forEach((m,i) => {
      const key = 'a' + d + ':' + i, cd = S.cards[key];
      if (cd && cd.due <= t) out.push({key, d, i, q:m[0], a:m[1], lv:cd.lv, from:'美术史 '+d+' · '+artPlanOf(d).sub});
    });
  }
  out.sort((p,q) => (p.lv - q.lv) || (p.d - q.d));
  return out;
}

    + '</div>'

function moodStrip(n){
  let h = '<div class="card"><div class="mstrip">';
  for (let i = n-1; i >= 0; i--){

    h += '<div class="md'+(m ? ' m'+m : '')+dn+'"><b>'+Number(d.slice(8))+'</b>'
      + '<span>周'+'日一二三四五六'[D(d).getUTCDay()]+'</span></div>';
  }
  return h + '</div></div>';
}

  STAGES.forEach((s,i) => {

    const open = (OPEN_STAGE === i), cur = (i === curIdx);
    h += '<button class="stagehead' + (open ? ' open' : '') + (cur ? ' cur' : '') + '" data-stage="' + i + '">'
      + '<div class="sh-l"><b>' + s.n + (cur ? '<span class="here">当前</span>' : '') + '</b>'

      + '<div class="pbar" style="margin:8px 6px 10px"><i style="width:' + (d/list.length*100).toFixed(1) + '%"></i></div>';
    if (open) h += '<div class="plist">' + list.map(planRow).join('') + '</div>';
  });
  return h;
}

function heatmap(){
  const weeks = 8, cells = [];
  const t = todayStr(), dow = (D(t).getUTCDay() + 6) % 7;
  const start = addDays(t, -(weeks*7 - 1) - (6 - dow));
  for (let i = 0; i < weeks*7; i++){
    const day = addDays(start, i), l = S.log[day];
    let lv = 0;
    if (l){
      const tot = (l.steps||0) + (l.cards||0);
      lv = tot >= 20 ? 4 : tot >= 10 ? 3 : tot >= 5 ? 2 : tot >= 1 ? 1 : 0;
    }
    cells.push('<i data-l="'+lv+'" title="'+day+'"></i>');
  }
  return cells.join('');
}
function quizChart(){
  const N = 14, days = [];
  for (let i = N - 1; i >= 0; i--){
    const d = addDays(todayStr(), -i), e = S.quizLog[d];
    days.push({pct: (e && e.n) ? Math.round(e.good / e.n * 100) : null});
  }
  const pts = [];
  days.forEach((x, i) => { if (x.pct !== null) pts.push([6 + i * 288 / (N - 1), 84 - x.pct / 100 * 72]); });
  if (!pts.length) return '<div style="font-size:13.5px;color:var(--sub);padding:8px 0">做完一次复习或抽测，这里就会出现曲线 🐾</div>';
  return '<svg viewBox="0 0 300 90" style="width:100%;height:96px;display:block">'
    + '<defs><linearGradient id="qg" x1="0" y1="0" x2="1" y2="0">'
    + '<stop offset="0" stop-color="#F4A8BE"/><stop offset="1" stop-color="#C94D72"/></linearGradient></defs>'
    + '<line x1="6" y1="84" x2="294" y2="84" stroke="#F3E3E8" stroke-width="1"/>'
    + '<line x1="6" y1="12" x2="294" y2="12" stroke="#F8EEF1" stroke-width="1" stroke-dasharray="4 4"/>'
    + '<polyline points="' + pts.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ') + '" fill="none" '
    + 'stroke="url(#qg)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'
    + pts.map(p => '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.4" fill="#fff" stroke="#C94D72" stroke-width="2"/>').join('')
    + '</svg>';
}
function avgPct(){
  let n = 0, g = 0;
  for (let i = 0; i < 14; i++){
    const e = S.quizLog[addDays(todayStr(), -i)];
    if (e){ n += e.n; g += e.good; }
  }
  return n ? Math.round(g / n * 100) : 0;
}

function rateRow(key, cd){
  if (cd && cd.reps){
    const left = diffDays(todayStr(), cd.due);
    return '<div class="rated">✓ 记住了' + (left <= 0 ? '，今天再见一次' : '，' + left + ' 天后再见')
      + '（已复习 ' + cd.reps + ' 次）</div>';
  }
  return '<div class="level">'
    + '<button data-rate="0" data-key="'+key+'">不会 😣</button>'
    + '<button data-rate="1" data-key="'+key+'">模糊 🤔</button>'
    + '<button data-rate="2" data-key="'+key+'">会了 😊</button></div>';
}
function buildContentSheet(c, title, task, keyPrefix){
  if (!c){
    return '<h3>'+title+'</h3><p class="hint">这一天的内容还在整理，先按计划里的要点自己过一遍 🐾</p>'
      + '<div class="row-btn"><button class="btn line" data-close="1">关闭</button></div>';
  }
  let h = '<h3>'+title+'</h3><p class="hint">'+esc(task||'')+'　·　先自己想，再点开看答案</p>'
    + '<div class="sec-title" style="margin:4px 4px 8px">框架</div><div class="kframe">'+esc(c.frame)+'</div>';
  if (c.must && c.must.length){
    h += '<div class="sec-title" style="margin:18px 4px 8px">必背点 · 自测'
       + '<button class="btn ghost sm" id="qaall">全部显示</button></div>'
       + '<div class="card" style="padding:2px 15px;margin-bottom:0">'
       + c.must.map((m,i)=>{
           const key = keyPrefix + i;
           return '<div class="qa" data-qa="'+key+'">'
             + '<button class="q"><i>'+(i+1)+'</i><span>'+esc(m[0])+'</span><u>看答案</u></button>'
             + '<div class="a">'+esc(m[1])+rateRow(key, cardOf(key))+'</div></div>';
         }).join('')
       + '</div>';
  }
  if (c.confuse && c.confuse.length){
    h += '<div class="sec-title" style="margin:18px 4px 8px">易混对比</div><div class="card" style="padding:2px 15px">'
       + '<ul class="cf">' + c.confuse.map(v => '<li><b>'+esc(v[0])+'</b>'+esc(v[1])+'</li>').join('') + '</ul></div>';

  if (c.nums && c.nums.length){
    h += '<div class="sec-title" style="margin:18px 4px 8px">数字 / 限定词清单</div><div class="card">'
       + '<ul class="nums">' + c.nums.map(v => '<li>'+esc(v)+'</li>').join('') + '</ul></div>';
  }
  h += '<div class="row-btn"><button class="btn line" data-close="1">关闭</button></div>';
  return h;
}

let RQ = [], RI = 0, RSTAT = {0:0,1:0,2:0}, QUIZ = false;
function startReview(){
  QUIZ = false;
  RQ = dueCards();
  if (!RQ.length){ alert('现在没有到期的卡片，先去背今天的内容吧 🐾'); return; }
  RI = 0; RSTAT = {0:0,1:0,2:0};
  renderReview();
}
function startQuiz(){
  const items = quizPool();
  if (items.length < 5){ alert('内容还太少，先背几天再来抽测 🐾'); return; }
  for (let i = items.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = items[i]; items[i] = items[j]; items[j] = t;
  }
  QUIZ = true;
  RQ = items.slice(0, 10);
  RI = 0; RSTAT = {0:0,1:0,2:0};
  renderReview();
}
function renderReview(){
  let m = document.getElementById('reviewbox');
  if (!m){ m = document.createElement('div'); m.id = 'reviewbox'; document.body.appendChild(m); }
  if (RI >= RQ.length){
    const g = RSTAT[2], mid = RSTAT[1], bad = RSTAT[0];
    const pct = Math.round(g / RQ.length * 100);
    logQuiz(RQ.length, g);
    m.innerHTML = '<div class="review"><div class="rv-done">'
      + '<div class="emo">'+(bad === 0 ? '🎉' : pct >= 60 ? '🌿' : '💪')+'</div>'
      + '<h2>'+(QUIZ ? '抽测结束' : '复习完成')+'</h2>'
      + '<div class="scorebig">'+pct+'%</div>'
      + '<p>'+(QUIZ ? '这次抽了 ' : '这次过了 ')+RQ.length+' 条：会了 '+g+' · 模糊 '+mid+' · 不会 '+bad+'<br>'
      + (g === RQ.length ? '全记住了，斐斐你今天超厉害。'
         : bad === 0 ? '没有完全不会的，稳住这个状态。'
         : '不会的明天还会来找你，别急。') + '</p>'
      + '<button class="btn rose big" id="rvend">回到今天</button></div></div>';
    document.getElementById('rvend').onclick = () => { QUIZ = false; m.innerHTML = ''; render(); };
    return;

  const c = RQ[RI];

    + '<div class="rv-top"><button class="close" id="rvclose">✕</button>'
    + '<div class="rv-prog"><i style="width:'+(RI/RQ.length*100).toFixed(1)+'%"></i></div>'
    + '<div class="rv-num">'+(RI+1)+'/'+RQ.length+'</div></div>'

    + '<div class="rv-card"><div class="rv-from">'+(c.from||'')+' · 已复习 '+(c.lv||0)+' 级</div>'

  document.getElementById('rvclose').onclick = () => { QUIZ = false; m.innerHTML = ''; render(); };
  document.getElementById('rvshow').onclick = () => {
    document.getElementById('rva').innerHTML = '<div class="rv-a">'+esc(c.a)+'</div>'
      + '<div class="level" style="margin-top:14px">'
      + '<button data-rq="0">不会 😣</button><button data-rq="1">模糊 🤔</button><button data-rq="2">会了 😊</button></div>';
    document.getElementById('rvshow').outerHTML = '<div style="font-size:12.5px;color:var(--sub);text-align:center;margin-top:12px">按真实感觉点，别客气</div>';

    + '<span class="spark s1">✨</span><span class="spark s2">✨</span>'
    + '<span class="spark s3">🎀</span><span class="spark s4">💗</span>'
    + '<div class="cat">'+CAT+'</div>'
    + '<div class="daytag">'+label+'</div>'
    + '<p class="msg">'+esc(noteByNo(n))+'</p>'
    + '<div class="collect">已收下 '+notesEarned()+' / '+TOTAL_NOTES+' 张'+WORD+'</div>'
    + '<button class="btn rose big" id="celclose">收下 ♡</button>'
    + '</div></div>';
  document.getElementById('celclose').onclick = () => { fx.innerHTML = ''; };
  setTimeout(() => { const ps = fx.querySelector('.particles'); if (ps) ps.remove(); }, 8000);
}

/* =====================================================================
   弹层 / 交互
   ===================================================================== */
function showSheet(inner, after){
  const m = document.getElementById('modal');
  m.innerHTML = '<div class="mask" id="mask"><div class="sheet">'+inner+'</div></div>';
  document.getElementById('mask').onclick = e => { if (e.target.id === 'mask') closeSheet(); };
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
  if (after) after();
}
function closeSheet(){ document.getElementById('modal').innerHTML = ''; }
function openDay(n){ showSheet(dayCard(BY_NO[n], true), bind); }

function openNote(dayNo){
  const d = dayNo || (todayNo() >= 1 && todayNo() <= DAYS.length ? todayNo() : 1);
  const tags = isLife() ? ['日常','心情','想说的','灵感'] : ['错题','易混','难点','灵感'];
  const html = '<h3>记一笔</h3><p class="hint">'+(isLife()?'今天想说什么都可以，一句话就够。':'错题、易混点、背不下来的地方 —— 一句话就够。')+'</p>'
    + '<div class="seg" id="tagseg">'
    + tags.map((t,i)=>'<button data-tag="'+t+'"'+(i===0?' class="on"':'')+'>'+t+'</button>').join('')
    + '</div>'
    + '<textarea id="notetx" placeholder="'+(isLife()?'例：今天终于睡到自然醒，很爽':'例：马原·劳动二重性 ≠ 商品二因素，别记反')+'"></textarea>'
    + '<div class="row-btn"><button class="btn line" data-close="1">取消</button>'
    + '<button class="btn rose" id="savenote">保存</button></div>';
  showSheet(html, () => {
    let tag = tags[0];
    document.querySelectorAll('#tagseg button').forEach(b => b.onclick = () => {
      tag = b.dataset.tag;
      document.querySelectorAll('#tagseg button').forEach(o => o.classList.toggle('on', o === b));
    });
    document.getElementById('savenote').onclick = () => {
      const tx = document.getElementById('notetx').value.trim();
      if (!tx){ alert('先写点内容吧'); return; }
      S.notes.push({id: Date.now()+''+Math.floor(Math.random()*999), day:d, text:tx, tag, date:todayStr(), ts:Date.now()});
      save(); closeSheet(); render();
    };
  });
}

function bind(){
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    const n = +b.dataset.day, k = b.dataset.step, st = dstate(n);
    const was = isDone(n);
    st.steps[k] = !st.steps[k];
    if (isDone(n)) st.doneDate = todayStr(); else delete st.doneDate;
    if (st.steps[k]) bump('steps');
    else if (S.log[todayStr()]) S.log[todayStr()].steps = Math.max(0, (S.log[todayStr()].steps||0)-1);
    save(); render();
    if (!was && isDone(n)) setTimeout(() => celebrate(n), 240);
  });
  document.querySelectorAll('[data-rev]').forEach(b => b.onclick = () => { toggleReviewed(+b.dataset.rev); render(); });
  document.querySelectorAll('[data-dayview]').forEach(b => b.onclick = () => openDay(+b.dataset.dayview));
  document.querySelectorAll('[data-content]').forEach(b => b.onclick = () => openContent(+b.dataset.content));
  document.querySelectorAll('[data-relove]').forEach(b => b.onclick = () => celebrate(+b.dataset.relove, b.dataset.rdate || ''));
  const rv = document.querySelector('[data-review]'); if (rv) rv.onclick = startReview;
  document.querySelectorAll('[data-stage]').forEach(b => b.onclick = () => {
    const i = +b.dataset.stage;
    OPEN_STAGE = (OPEN_STAGE === i) ? -1 : i;
    render();
  });

  /* ---- 陪伴模式 ---- */
  document.querySelectorAll('[data-task]').forEach(b => b.onclick = () => {
    const t = todayStr(), si = +b.dataset.task, l = lifeOf(t);
    const was = lifeDone(t);
    const i = l.t.indexOf(si);
    if (i >= 0) l.t.splice(i,1); else { l.t.push(si); bump('steps'); }
    save(); render();
    if (!was && lifeDone(t)) setTimeout(() => celebrate(lifeSerial(t), t), 240);
  });
  document.querySelectorAll('[data-mood]').forEach(b => b.onclick = () => {
    lifeOf(todayStr()).mood = +b.dataset.mood;
    save(); render();
  });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    S.mode = b.dataset.mode; TAB = 'today'; save(); render();
  });
  const tgs = document.getElementById('tgsave');
  if (tgs) tgs.onclick = () => {
    const el = document.getElementById('tgdate');
    S.together = el ? el.value : ''; save(); render();
  };
  const exs = document.getElementById('examsave');
  if (exs) exs.onclick = () => {
    const el = document.getElementById('examdate');
    if (el && el.value){ S.exam = el.value; save(); render(); }
  };
  const ars = document.getElementById('artsave');
  if (ars) ars.onclick = () => {
    const el = document.getElementById('artdate');
    if (el && el.value){ S.artStart = el.value; save(); render(); }
  };

  /* ---- 美术史 ---- */
  document.querySelectorAll('[data-artcontent]').forEach(b => b.onclick = () => openArtContent(+b.dataset.artcontent));
  document.querySelectorAll('[data-artdone]').forEach(b => b.onclick = () => {
    artSet(todayStr(), !artDone(todayStr()));
    render();
  });
  document.querySelectorAll('[data-artday]').forEach(b => b.onclick = () => openArtContent(+b.dataset.artday));
  const asb = document.querySelector('[data-artstart]');
  if (asb) asb.onclick = () => { S.artStart = todayStr(); save(); render(); };
  document.querySelectorAll('[data-plantab]').forEach(b => b.onclick = () => { PLAN_TAB = b.dataset.plantab; render(); });
  const qz = document.querySelector('[data-quiz]'); if (qz) qz.onclick = startQuiz;
  const cl = document.querySelector('[data-closing]'); if (cl) cl.onclick = openClosing;
  document.querySelectorAll('[data-note]').forEach(b => b.onclick = () => openNote(+b.dataset.note));
  const nn = document.querySelector('[data-newnote]'); if (nn) nn.onclick = () => openNote(null);
  document.querySelectorAll('[data-delnote]').forEach(b => b.onclick = () => {
    if (confirm('删除这条记录？')){ S.notes = S.notes.filter(x => String(x.id) !== String(b.dataset.delnote)); save(); render(); }
  });
  document.querySelectorAll('[data-restart]').forEach(b => b.onclick = () => {
    if (confirm('把计划开始日设为 ' + b.dataset.restart.replace(/-/g,'/') + '？\n（只改「今天是第几天」，已打的卡不会丢）')){
      S.start = b.dataset.restart; save(); render();
    }
  });
  const nk = document.querySelector('[data-nick]'); if (nk) nk.onclick = () => {
    const v = prompt('想怎么称呼她？', S.nick || NICK_DEFAULT);
    if (v && v.trim()){ S.nick = v.trim().slice(0,10); save(); render(); }
  };
  const ex = document.querySelector('[data-export]'); if (ex) ex.onclick = exportData;
  const im = document.querySelector('[data-import]'); if (im) im.onclick = importData;
  const rp = document.querySelector('[data-report]'); if (rp) rp.onclick = copyReport;
  const rs = document.querySelector('[data-reset]'); if (rs) rs.onclick = () => {
    if (confirm('清空全部打卡、卡片和记录？不可恢复。') && confirm('真的确定？建议先导出备份。')){
      S = blank(); save(); render();
    }
  };
}
function switchTab(t){
  TAB = t;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  render();
}
function download(name, text, type){
  const blob = new Blob([text], {type: type || 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportData(){ download('背诵手册备份_' + todayStr().replace(/-/g,'') + '.json', JSON.stringify(S, null, 1)); }
function importData(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const o = JSON.parse(r.result);
        if (!o || !o.days) throw new Error('文件格式不对');
        if (!confirm('导入会覆盖当前记录。继续？')) return;
        S = Object.assign(blank(), o); save(); render();
        alert('导入成功：已完成 ' + doneCount() + ' 天');
      }catch(e){ alert('导入失败：' + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function copyReport(){
  const t = todayStr(), dow = (new Date().getDay()+6)%7, mon = addDays(t,-dow);
  const life = isLife();
  let wd = 0;
  for (let i=0;i<7;i++){
    const ds = addDays(mon,i);
    if (life){ if (lifeDone(ds)) wd++; }
    else { const n = diffDays(S.start, ds)+1; if (n>=1 && n<=DAYS.length && isDone(n)) wd++; }
  }
  const txt = '【'+(life?'陪伴打卡':'背诵手册')+'周报】'+md(mon)+'–'+md(t)+'\n'
    + '本周打卡：'+wd+' 天（完成率 '+(wd/7*100).toFixed(0)+'%）\n'
    + (life
        ? '累计打卡：'+Object.keys(S.life).filter(lifeDone).length+' 天，连续 '+lifeStreak()+' 天\n'
          + '收下'+WORD+'：'+notesEarned()+' / '+TOTAL_NOTES+' 张'
        : '累计完成：'+doneCount()+'/'+DAYS.length+' 天，连续 '+streak()+' 天\n'
          + '已掌握知识点：'+masteredCount()+' 条　'+WORD+'：'+notesEarned()+' / '+TOTAL_NOTES+' 张\n'
          + '今天要背：'+(BY_NO[todayNo()] ? 'Day '+todayNo()+' '+BY_NO[todayNo()].task : '冲刺阶段'));
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(
    ()=>alert('周报已复制，可以粘贴给他 🐾'), ()=>prompt('复制下面这段：', txt));
  else prompt('复制下面这段：', txt);
}

/* 启动 */
document.getElementById('hCat').innerHTML = CAT;
document.getElementById('navLove').textContent = WORD;
document.querySelectorAll('nav button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
render();
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
